<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="26" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1f2937">Flip-flop J-K: tabla, ecuación característica y conversión a D y a T</text>
  <rect x="24" y="42" width="380" height="300" rx="6" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="40" y="66" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#1f2937">J-K: el que resuelve el estado prohibido</text>
  <rect x="70" y="86" width="130" height="96" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.8"/>
  <text x="135" y="116" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2937">J-K</text>
  <line x1="52" y1="108" x2="70" y2="108" stroke="#1f2937" stroke-width="1.6"/>
  <text x="56" y="102" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="start" fill="#1f2937">J</text>
  <line x1="52" y1="146" x2="70" y2="146" stroke="#1f2937" stroke-width="1.6"/>
  <text x="56" y="162" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="start" fill="#1f2937">K</text>
  <path d="M70,152 l10,6 l-10,6" fill="none" stroke="#1f2937" stroke-width="1.3"/>
  <text x="60" y="172" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="700" text-anchor="start" fill="#1f2937">C</text>
  <line x1="200" y1="112" x2="220" y2="112" stroke="#1f2937" stroke-width="1.6"/>
  <text x="224" y="116" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#1f2937">Q</text>
  <line x1="200" y1="156" x2="220" y2="156" stroke="#1f2937" stroke-width="1.6"/>
  <text x="224" y="160" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#1f2937">Q'</text>
  <text x="40" y="216" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="700" text-anchor="start" fill="#1f2937">J C K | Q(t+1)</text>
  <text x="40" y="236" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="400" text-anchor="start" fill="#1f2937">0 ↑ 0 | Q   (mantiene)</text>
  <text x="40" y="253" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="400" text-anchor="start" fill="#1f2937">1 ↑ 0 | 1   (set)</text>
  <text x="40" y="270" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="400" text-anchor="start" fill="#1f2937">0 ↑ 1 | 0   (reset)</text>
  <text x="40" y="287" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="400" text-anchor="start" fill="#1f2937">1 ↑ 1 | Q'  (conmuta)</text>
  <text x="40" y="318" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">Con J = K = 1 ya no hay prohibido: conmuta.</text>
  <rect x="426" y="42" width="450" height="300" rx="6" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="442" y="66" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#1f2937">Ecuación característica</text>
  <text x="442" y="92" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="700" text-anchor="start" fill="#0f766e">Q(t+1) = J·Q' + K'·Q</text>
  <text x="442" y="116" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">Se deduce de la tabla: mantiene con 00, pone con 10,</text>
  <text x="442" y="132" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">borra con 01 y conmuta con 11.</text>
  <text x="442" y="164" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="700" text-anchor="start" fill="#1f2937">Tabla de excitación (para diseñar):</text>
  <text x="442" y="184" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="700" text-anchor="start" fill="#1f2937">Q → Q(t+1) | J K</text>
  <text x="442" y="202" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="400" text-anchor="start" fill="#1f2937">0 → 0    | 0 x</text>
  <text x="442" y="218" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="400" text-anchor="start" fill="#1f2937">0 → 1    | 1 x</text>
  <text x="442" y="234" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="400" text-anchor="start" fill="#1f2937">1 → 0    | x 1</text>
  <text x="442" y="250" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="400" text-anchor="start" fill="#1f2937">1 → 1    | x 0</text>
  <text x="600" y="184" font-family="Consolas, 'Courier New', monospace" font-size="10.4" font-weight="400" text-anchor="start" fill="#7c2d12">J-K → D:  J = D,  K = D'</text>
  <text x="600" y="202" font-family="Consolas, 'Courier New', monospace" font-size="10.4" font-weight="400" text-anchor="start" fill="#7c2d12">J-K → T:  J = K = T</text>
  <text x="600" y="226" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">Chequeo con D: J·Q' + K'·Q</text>
  <text x="600" y="242" font-family="Consolas, 'Courier New', monospace" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">= D·Q' + D·Q = D ✓</text>
  <text x="442" y="288" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">Un J-K con J = K = T se comporta como T; con J = D y K = D',</text>
  <text x="442" y="304" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">como D. Por eso el J-K es el biestable 'general'.</text>
  <text x="24" y="372" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="400" text-anchor="start" fill="#1f2937">El J-K es el único que aprovecha el caso 1-1 en vez de prohibirlo: en ese caso la salida conmuta.</text>
</svg>
