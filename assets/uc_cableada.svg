<svg xmlns="http://www.w3.org/2000/svg" width="920" height="490" viewBox="0 0 920 490">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="26" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1f2937">Unidad de control cableada: las AND eligen, las OR juntan</text>
  <rect x="20" y="52" width="168" height="52" rx="6" ry="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.7"/>
  <text x="104.0" y="75.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">IR 15..12</text>
  <text x="104.0" y="92.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">opcode de 4 bits</text>
  <rect x="20" y="122" width="168" height="52" rx="6" ry="6" fill="#dbeafe" stroke="#1f2937" stroke-width="1.7"/>
  <text x="104.0" y="145.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">1 → 16</text>
  <text x="104.0" y="162.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">una línea por instrucción</text>
  <rect x="20" y="192" width="168" height="52" rx="6" ry="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.7"/>
  <text x="104.0" y="215.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">FF STATE · RUN · TRA</text>
  <text x="104.0" y="232.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">F/E · corriendo · E/S</text>
  <rect x="20" y="262" width="168" height="52" rx="6" ry="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.7"/>
  <text x="104.0" y="285.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">reloj maestro</text>
  <text x="104.0" y="302.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">CP1 … CP8</text>
  <line x1="188" y1="78" x2="216" y2="78" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="216" y1="78" x2="216" y2="288" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="216" y1="288" x2="188" y2="288" stroke="#1f2937" stroke-width="1.6"/>
  <circle cx="216" cy="78" r="3.4" fill="#1f2937"/>
  <circle cx="216" cy="148" r="3.4" fill="#1f2937"/>
  <circle cx="216" cy="218" r="3.4" fill="#1f2937"/>
  <circle cx="216" cy="288" r="3.4" fill="#1f2937"/>
  <line x1="216" y1="183" x2="250" y2="183" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="250" y1="183" x2="241.7780908812166" y2="179.3393702123178" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="250" y1="183" x2="241.7780908812166" y2="186.6606297876822" stroke="#1f2937" stroke-width="1.6"/>
  <rect x="250" y="148" width="190" height="70" rx="6" ry="6" fill="#fef3c7" stroke="#1f2937" stroke-width="1.7"/>
  <text x="345.0" y="180.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">compuertas AND</text>
  <text x="345.0" y="197.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">una por señal</text>
  <line x1="440" y1="183" x2="474" y2="183" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="474" y1="183" x2="465.7780908812166" y2="179.3393702123178" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="474" y1="183" x2="465.7780908812166" y2="186.6606297876822" stroke="#1f2937" stroke-width="1.6"/>
  <rect x="474" y="148" width="156" height="70" rx="6" ry="6" fill="#dcfce7" stroke="#1f2937" stroke-width="1.7"/>
  <text x="552.0" y="180.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">compuertas OR</text>
  <text x="552.0" y="197.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">las que dan el mismo efecto</text>
  <line x1="630" y1="183" x2="664" y2="183" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="664" y1="183" x2="655.7780908812166" y2="179.3393702123178" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="664" y1="183" x2="655.7780908812166" y2="186.6606297876822" stroke="#1f2937" stroke-width="1.6"/>
  <rect x="664" y="132" width="236" height="102" rx="6" ry="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.7"/>
  <text x="782.0" y="180.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">señales de control</text>
  <text x="782.0" y="197.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">Send X · Load Y · Read / Write</text>
  <text x="680" y="214" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="start" fill="#4b5563">(a los registros, la ALU, la memoria)</text>
  <rect x="20" y="330" width="880" height="142" rx="8" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="34" y="352" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.6" font-weight="600" text-anchor="start" fill="#1f2937">Por dentro: cada AND dice «en este estado, en este pulso, con esta instrucción», y la OR junta las que producen la misma señal</text>
  <text x="44" y="384" font-family="Consolas, 'Courier New', monospace" font-size="10.2" font-weight="400" text-anchor="start" fill="#7c2d12">F · CP1</text>
  <text x="250" y="384" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#1f2937">→</text>
  <text x="274" y="384" font-family="Consolas, 'Courier New', monospace" font-size="10.2" font-weight="400" text-anchor="start" fill="#1d4ed8">Send PC, Load MAR</text>
  <text x="44" y="410" font-family="Consolas, 'Courier New', monospace" font-size="10.2" font-weight="400" text-anchor="start" fill="#7c2d12">E · CP2 · ARITH</text>
  <text x="250" y="410" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#1f2937">→</text>
  <text x="274" y="410" font-family="Consolas, 'Courier New', monospace" font-size="10.2" font-weight="400" text-anchor="start" fill="#1d4ed8">Send A, Load Z</text>
  <text x="44" y="436" font-family="Consolas, 'Courier New', monospace" font-size="10.2" font-weight="400" text-anchor="start" fill="#7c2d12">E · CP6 · LDA</text>
  <text x="250" y="436" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" text-anchor="start" fill="#1f2937">→</text>
  <text x="274" y="436" font-family="Consolas, 'Courier New', monospace" font-size="10.2" font-weight="400" text-anchor="start" fill="#1d4ed8">Send MBR, Load A</text>
  <text x="640" y="392" font-family="Consolas, 'Courier New', monospace" font-size="10.2" font-weight="400" text-anchor="start" fill="#4b5563">ARITH = ADD + XOR + AND + IOR</text>
  <text x="640" y="416" font-family="Consolas, 'Courier New', monospace" font-size="10.2" font-weight="400" text-anchor="start" fill="#4b5563">REF  = LDA + STA + ARITH</text>
  <text x="640" y="440" font-family="Consolas, 'Courier New', monospace" font-size="10.2" font-weight="400" text-anchor="start" fill="#b91c1c">MBR_in = F·CP5 + E·CP5·REF</text>
  <text x="34" y="456" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="400" text-anchor="start" fill="#4b5563">La UC cableada es un combinacional gigante: tabla de verdad → función → compuertas.</text>
</svg>
