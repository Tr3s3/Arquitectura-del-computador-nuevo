<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="26" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1f2937">Microprogramado: la microinstrucción y el secuenciamiento del microPC</text>
  <text x="24" y="52" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.8" font-weight="700" text-anchor="start" fill="#1f2937">Cada microinstrucción es una palabra partida en campos</text>
  <rect x="40" y="80" width="320" height="52" rx="3" fill="#dbeafe" stroke="#1f2937" stroke-width="1.4"/>
  <text x="200.0" y="102" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="700" text-anchor="middle" fill="#1f2937">señales de control</text>
  <text x="200.0" y="120" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="400" text-anchor="middle" fill="#4b5563">abre buffers y carga registros</text>
  <rect x="360" y="80" width="150" height="52" rx="3" fill="#fef3c7" stroke="#1f2937" stroke-width="1.4"/>
  <text x="435.0" y="102" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="700" text-anchor="middle" fill="#1f2937">salto</text>
  <text x="435.0" y="120" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="400" text-anchor="middle" fill="#4b5563">qué hacer con el microPC</text>
  <rect x="510" y="80" width="150" height="52" rx="3" fill="#dcfce7" stroke="#1f2937" stroke-width="1.4"/>
  <text x="585.0" y="102" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="700" text-anchor="middle" fill="#1f2937">dirección</text>
  <text x="585.0" y="120" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="400" text-anchor="middle" fill="#4b5563">a dónde ir si salta</text>
  <rect x="660" y="80" width="180" height="52" rx="3" fill="#fce7f3" stroke="#1f2937" stroke-width="1.4"/>
  <text x="750.0" y="102" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="700" text-anchor="middle" fill="#1f2937">condición</text>
  <text x="750.0" y="120" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="400" text-anchor="middle" fill="#4b5563">qué mirar para saltar</text>
  <text x="24" y="168" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.8" font-weight="700" text-anchor="start" fill="#1f2937">Secuenciamiento: de dónde sale la próxima microdirección</text>
  <rect x="60" y="190" width="220" height="56" rx="6" ry="6" fill="#dcfce7" stroke="#1f2937" stroke-width="1.7"/>
  <text x="170.0" y="215.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">microPC</text>
  <text x="170.0" y="232.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">contador de microdirección</text>
  <rect x="340" y="190" width="200" height="56" rx="6" ry="6" fill="#dbeafe" stroke="#1f2937" stroke-width="1.7"/>
  <text x="440.0" y="215.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">MEMORIA DE CONTROL</text>
  <text x="440.0" y="232.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">ROM de microcódigo</text>
  <rect x="600" y="190" width="190" height="56" rx="6" ry="6" fill="#fef3c7" stroke="#1f2937" stroke-width="1.7"/>
  <text x="695.0" y="215.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">REGISTRO</text>
  <text x="695.0" y="232.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">de microinstrucción</text>
  <line x1="280" y1="218" x2="336" y2="218" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="336" y1="218" x2="327.7780908812166" y2="214.3393702123178" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="336" y1="218" x2="327.7780908812166" y2="221.6606297876822" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="540" y1="218" x2="596" y2="218" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="596" y1="218" x2="587.7780908812166" y2="214.3393702123178" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="596" y1="218" x2="587.7780908812166" y2="221.6606297876822" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="695" y1="246" x2="695" y2="290" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="695" y1="290" x2="698.6606297876822" y2="281.7780908812166" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="695" y1="290" x2="691.3393702123178" y2="281.7780908812166" stroke="#1f2937" stroke-width="1.6"/>
  <text x="700" y="276" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.8" font-weight="400" text-anchor="start" fill="#4b5563">sus campos vuelven al microPC</text>
  <line x1="695" y1="292" x2="170" y2="292" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="170" y1="292" x2="178.2219091187834" y2="295.6606297876822" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="170" y1="292" x2="178.2219091187834" y2="288.3393702123178" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="170" y1="292" x2="170" y2="250" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="170" y1="250" x2="166.3393702123178" y2="258.2219091187834" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="170" y1="250" x2="173.6606297876822" y2="258.2219091187834" stroke="#1f2937" stroke-width="1.6"/>
  <text x="190" y="312" font-family="Consolas, 'Courier New', monospace" font-size="9" font-weight="400" text-anchor="start" fill="#7c2d12">1 · incrementar  2 · saltar  3 · salto condicional  4 · mapear el opcode</text>
  <rect x="24" y="322" width="872" height="66" rx="6" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="40" y="344" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#1f2937">Mapeo: al empezar una instrucción, el opcode se pone en el microPC (o en un registro de mapeo) ⇒ cada instrucción tiene su microprograma.</text>
  <text x="40" y="364" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">Ventaja: cambiar el repertorio = cambiar el contenido de la ROM, sin tocar cables. Desventaja: más lento (una lectura de ROM por microinstrucción).</text>
</svg>
