<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="26" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1f2937">Memoria asociativa (CAM): buscar por CONTENIDO, no por dirección</text>
  <text x="24" y="52" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.6" font-weight="700" text-anchor="start" fill="#1f2937">RAM normal: se da la dirección y devuelve el dato · CAM: se da el dato y devuelve la dirección (y si está)</text>
  <rect x="50" y="80" width="180" height="66" rx="6" ry="6" fill="#e0e7ff" stroke="#1f2937" stroke-width="1.7"/>
  <text x="140.0" y="110.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">RAM</text>
  <text x="140.0" y="127.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">dirección → dato</text>
  <rect x="300" y="80" width="200" height="66" rx="6" ry="6" fill="#dcfce7" stroke="#1f2937" stroke-width="1.7"/>
  <text x="400.0" y="110.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">CAM</text>
  <text x="400.0" y="127.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">contenido → coincidencia</text>
  <text x="530" y="96" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">La CAM compara la entrada contra TODAS las</text>
  <text x="530" y="114" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">palabras a la vez (comparadores en paralelo)</text>
  <text x="530" y="132" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">y marca cuáles coinciden.</text>
  <text x="24" y="186" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#1f2937">Dónde aparece en la materia</text>
  <text x="40" y="210" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#1f2937">· TLB: la traducción de páginas se busca por contenido (nº de página virtual).</text>
  <text x="40" y="230" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#1f2937">· Caché totalmente asociativa: el bloque se busca por etiqueta en todos los marcos.</text>
  <text x="40" y="250" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#1f2937">· Tablas de ruteo, colas de instrucciones, detección de dependencias en un superscalar.</text>
  <text x="40" y="274" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#b91c1c">Costo: una celda CAM ocupa ~6-10 transistores y consume mucho ⇒ se usa en memorias CHICAS y muy consultadas.</text>
  <rect x="24" y="296" width="852" height="80" rx="6" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="40" y="318" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#1f2937">Memoria auxiliar (el último nivel): disco, SSD, cinta. Es la que alimenta a la RAM cuando hay fallo de página.</text>
  <text x="40" y="338" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#4b5563">Registros → caché → RAM → memoria auxiliar: cada nivel es ~10-1000 veces más grande y más lento que el anterior.</text>
  <text x="40" y="358" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#4b5563">Por eso la CAM vive arriba (TLB, caché) y el disco abajo: velocidad contra capacidad.</text>
  <text x="24" y="392" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#4b5563">Asociativa = comparación en paralelo. Es la única memoria que responde 'no está' en un solo ciclo.</text>
</svg>
