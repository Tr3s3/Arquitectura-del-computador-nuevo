  <text x="30" y="500" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#4b5563">Capacidad = 8 palabras × 3 bits = 24 bits.   Direcciones: 000 … 111 (3 bits ⇒ 2³ = 8 posiciones).</text>
  <text x="30" y="519" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#4b5563">Cada palabra es un registro de 3 biestables D que comparten la MISMA línea de selección (la salida del decodificador):</text>
  <text x="30" y="538" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#4b5563">por eso la palabra entera se lee o se escribe en un solo acceso de memoria.</text>
  <text x="30" y="557" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#4b5563">Escritura: se ponen dirección + dato en los buses y R/W' = 0 (el flanco guarda el dato en los 3 FF).  Lectura: dirección + R/W' = 1.</text>
