<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="26" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1f2937">SRAM vs DRAM, y el ciclo de refresco de la DRAM</text>
  <text x="24" y="52" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#1f2937">Refresco: cada fila se reescribe antes de que el capacitor pierda la carga</text>
  <rect x="40" y="74" width="86" height="46" rx="4" fill="#dcfce7" stroke="#1f2937" stroke-width="1.3"/>
  <text x="83" y="102" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="middle" fill="#1f2937">fila 0</text>
  <rect x="140" y="74" width="86" height="46" rx="4" fill="#e0e7ff" stroke="#1f2937" stroke-width="1.3"/>
  <text x="183" y="102" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="middle" fill="#1f2937">fila 1</text>
  <rect x="240" y="74" width="86" height="46" rx="4" fill="#dcfce7" stroke="#1f2937" stroke-width="1.3"/>
  <text x="283" y="102" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="middle" fill="#1f2937">fila 2</text>
  <rect x="340" y="74" width="86" height="46" rx="4" fill="#e0e7ff" stroke="#1f2937" stroke-width="1.3"/>
  <text x="383" y="102" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="middle" fill="#1f2937">fila 3</text>
  <rect x="440" y="74" width="86" height="46" rx="4" fill="#dcfce7" stroke="#1f2937" stroke-width="1.3"/>
  <text x="483" y="102" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="middle" fill="#1f2937">fila 4</text>
  <rect x="540" y="74" width="86" height="46" rx="4" fill="#e0e7ff" stroke="#1f2937" stroke-width="1.3"/>
  <text x="583" y="102" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="middle" fill="#1f2937">fila 5</text>
  <rect x="640" y="74" width="86" height="46" rx="4" fill="#dcfce7" stroke="#1f2937" stroke-width="1.3"/>
  <text x="683" y="102" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="middle" fill="#1f2937">fila 6</text>
  <rect x="740" y="74" width="86" height="46" rx="4" fill="#e0e7ff" stroke="#1f2937" stroke-width="1.3"/>
  <text x="783" y="102" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="middle" fill="#1f2937">fila 7</text>
  <text x="24" y="146" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#4b5563">Se refresca una fila por vez, en ronda (refresco distribuido) o todas juntas (refresco en ráfaga).</text>
  <text x="24" y="164" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#4b5563">Mientras el controlador refresca, la memoria NO atiende al procesador ⇒ hay una pérdida de ancho de banda (~1-5 %).</text>
  <text x="24" y="200" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#1f2937">Comparación</text>
  <text x="40" y="224" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="start" fill="#1d4ed8">SRAM</text>
  <text x="40" y="244" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#1f2937">6 transistores por bit</text>
  <text x="40" y="262" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#1f2937">no necesita refresco</text>
  <text x="40" y="280" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#1f2937">1-10 ns, muy rápida</text>
  <text x="40" y="298" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#1f2937">cara por bit ⇒ caché chica</text>
  <text x="40" y="322" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#4b5563">volátil (pierde al apagar)</text>
  <text x="230" y="224" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="start" fill="#b91c1c">DRAM</text>
  <text x="230" y="244" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#1f2937">1 transistor + 1 capacitor</text>
  <text x="230" y="262" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#1f2937">refresco cada ~64 ms</text>
  <text x="230" y="280" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#1f2937">50-100 ns (con fila abierta)</text>
  <text x="230" y="298" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#1f2937">barata por bit ⇒ GB de RAM</text>
  <text x="230" y="322" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#4b5563">volátil (pierde al apagar)</text>
  <rect x="430" y="196" width="466" height="120" rx="6" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="446" y="218" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="700" text-anchor="start" fill="#1f2937">Otros tipos que se nombran</text>
  <text x="446" y="240" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#4b5563">SDRAM: sincrónica, trabaja con el reloj del bus.</text>
  <text x="446" y="258" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#4b5563">DDR: transfiere en los dos flancos ⇒ el doble por ciclo.</text>
  <text x="446" y="276" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#4b5563">RDRAM, VRAM (video, doble puerto), caché L1/L2 en SRAM.</text>
  <text x="446" y="296" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#4b5563">Memoria ROM/Flash: no volátil, se ve en 2.4.</text>
  <text x="24" y="352" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="400" text-anchor="start" fill="#1f2937">Las dos son volátiles: al cortar la alimentación se pierde el contenido. Lo no volátil (ROM, Flash, disco) guarda sin energía.</text>
  <text x="24" y="374" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="400" text-anchor="start" fill="#4b5563">Regla: mientras más rápida, más cara por bit y más chica ⇒ la jerarquía (registros → caché → RAM → disco) es una consecuencia del costo.</text>
</svg>
