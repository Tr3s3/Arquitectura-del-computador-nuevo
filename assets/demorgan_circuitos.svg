  <text x="24" y="396" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="400" text-anchor="start" fill="#7c2d12">Regla para simplificar sin equivocarse: al negar cambia AND↔OR y se niega cada término (también los literales sueltos).</text>
