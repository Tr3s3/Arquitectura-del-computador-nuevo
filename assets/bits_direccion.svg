<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="26" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1f2937">Bits de dirección = log₂ de celdas, y cómo se expande un banco de memoria</text>
  <text x="24" y="52" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="700" text-anchor="start" fill="#0f766e">Si hay N celdas, hacen falta n = log₂ N líneas de dirección</text>
  <rect x="40" y="74" width="160" height="62" rx="5" fill="#dbeafe" stroke="#1f2937" stroke-width="1.4"/>
  <text x="120" y="98" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2937">8 líneas</text>
  <text x="120" y="120" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="middle" fill="#4b5563">256 celdas</text>
  <rect x="215" y="74" width="160" height="62" rx="5" fill="#dbeafe" stroke="#1f2937" stroke-width="1.4"/>
  <text x="295" y="98" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2937">10 líneas</text>
  <text x="295" y="120" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="middle" fill="#4b5563">1 K</text>
  <rect x="390" y="74" width="160" height="62" rx="5" fill="#dbeafe" stroke="#1f2937" stroke-width="1.4"/>
  <text x="470" y="98" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2937">12 líneas</text>
  <text x="470" y="120" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="middle" fill="#4b5563">4 096 (la BLUE)</text>
  <rect x="565" y="74" width="160" height="62" rx="5" fill="#dbeafe" stroke="#1f2937" stroke-width="1.4"/>
  <text x="645" y="98" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2937">16 líneas</text>
  <text x="645" y="120" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="middle" fill="#4b5563">64 K</text>
  <rect x="740" y="74" width="160" height="62" rx="5" fill="#dbeafe" stroke="#1f2937" stroke-width="1.4"/>
  <text x="820" y="98" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1f2937">20 líneas</text>
  <text x="820" y="120" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="middle" fill="#4b5563">1 M</text>
  <text x="24" y="164" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#4b5563">2¹² = 4 096 ⇒ 12 líneas (la BLUE). 2¹⁶ = 65 536 ⇒ 16 líneas. Cada línea nueva duplica la memoria.</text>
  <text x="24" y="200" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.6" font-weight="700" text-anchor="start" fill="#1f2937">Expansión: para una memoria más grande que el chip se combinan chips con un decodificador de selección</text>
  <rect x="50" y="222" width="140" height="64" rx="6" ry="6" fill="#dcfce7" stroke="#1f2937" stroke-width="1.7"/>
  <text x="120.0" y="251.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">8 K × 8</text>
  <text x="120.0" y="268.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">chip 0</text>
  <rect x="50" y="296" width="140" height="64" rx="6" ry="6" fill="#dcfce7" stroke="#1f2937" stroke-width="1.7"/>
  <text x="120.0" y="325.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">8 K × 8</text>
  <text x="120.0" y="342.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">chip 1</text>
  <rect x="230" y="222" width="140" height="64" rx="6" ry="6" fill="#dcfce7" stroke="#1f2937" stroke-width="1.7"/>
  <text x="300.0" y="251.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">8 K × 8</text>
  <text x="300.0" y="268.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">chip 2</text>
  <rect x="230" y="296" width="140" height="64" rx="6" ry="6" fill="#dcfce7" stroke="#1f2937" stroke-width="1.7"/>
  <text x="300.0" y="325.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">8 K × 8</text>
  <text x="300.0" y="342.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">chip 3</text>
  <text x="400" y="240" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#1f2937">Con 4 chips de 8 K×8 y 15 líneas (2¹⁵ = 32 K) se arma 32 K×8:</text>
  <text x="400" y="260" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#4b5563">A0-A12 van a TODOS los chips (dirección dentro del chip);</text>
  <text x="400" y="278" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#4b5563">A13-A14 entran al decodificador 2→4 que activa CS de un solo chip.</text>
  <text x="400" y="298" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#4b5563">CS = chip select: sin CS el chip queda en alta impedancia.</text>
  <text x="400" y="320" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#4b5563">Para más ancho (16 bits) se ponen dos bancos en paralelo con el mismo CS.</text>
  <text x="24" y="380" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="400" text-anchor="start" fill="#1f2937">Regla de examen: primero contar celdas, después sacar log₂ para las líneas, y al final decidir cuántas van al decodificador de chips.</text>
</svg>
