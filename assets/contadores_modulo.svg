<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="26" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1f2937">Contadores: binario de 3 bits (módulo 8) y contador de módulo 6</text>
  <text x="24" y="50" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.8" font-weight="700" text-anchor="start" fill="#1f2937">Contador binario de 3 bits con flip-flops T en cascada</text>
  <rect x="60" y="72" width="96" height="80" rx="5" fill="#dbeafe" stroke="#1f2937" stroke-width="1.7"/>
  <text x="108" y="106" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2937">T</text>
  <text x="72" y="130" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#4b5563">T = 1</text>
  <line x1="156" y1="96" x2="188" y2="96" stroke="#1f2937" stroke-width="1.6"/>
  <text x="192" y="100" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="700" text-anchor="start" fill="#1d4ed8">Q0</text>
  <line x1="100" y1="166" x2="188" y2="166" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="188" y1="166" x2="179.7780908812166" y2="162.3393702123178" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="188" y1="166" x2="179.7780908812166" y2="169.6606297876822" stroke="#1f2937" stroke-width="1.6"/>
  <text x="100" y="182" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#b91c1c">Q → reloj del siguiente</text>
  <line x1="44" y1="130" x2="60" y2="130" stroke="#1f2937" stroke-width="1.6"/>
  <text x="40" y="126" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="400" text-anchor="end" fill="#b91c1c">CLK</text>
  <rect x="225" y="72" width="96" height="80" rx="5" fill="#dbeafe" stroke="#1f2937" stroke-width="1.7"/>
  <text x="273" y="106" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2937">T</text>
  <text x="237" y="130" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#4b5563">T = 1</text>
  <line x1="321" y1="96" x2="353" y2="96" stroke="#1f2937" stroke-width="1.6"/>
  <text x="357" y="100" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="700" text-anchor="start" fill="#1d4ed8">Q1</text>
  <line x1="265" y1="166" x2="353" y2="166" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="353" y1="166" x2="344.7780908812166" y2="162.3393702123178" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="353" y1="166" x2="344.7780908812166" y2="169.6606297876822" stroke="#1f2937" stroke-width="1.6"/>
  <text x="265" y="182" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#b91c1c">Q → reloj del siguiente</text>
  <line x1="209" y1="130" x2="225" y2="130" stroke="#1f2937" stroke-width="1.6"/>
  <rect x="390" y="72" width="96" height="80" rx="5" fill="#dbeafe" stroke="#1f2937" stroke-width="1.7"/>
  <text x="438" y="106" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2937">T</text>
  <text x="402" y="130" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#4b5563">T = 1</text>
  <line x1="486" y1="96" x2="518" y2="96" stroke="#1f2937" stroke-width="1.6"/>
  <text x="522" y="100" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="700" text-anchor="start" fill="#1d4ed8">Q2</text>
  <line x1="374" y1="130" x2="390" y2="130" stroke="#1f2937" stroke-width="1.6"/>
  <text x="600" y="96" font-family="Consolas, 'Courier New', monospace" font-size="9.8" font-weight="400" text-anchor="start" fill="#1f2937">Cuenta:  000 → 001 → 010 → 011</text>
  <text x="600" y="116" font-family="Consolas, 'Courier New', monospace" font-size="9.8" font-weight="400" text-anchor="start" fill="#1f2937">→ 100 → 101 → 110 → 111 → 000</text>
  <text x="600" y="140" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">Módulo 8 = 2³ (tres flip-flops)</text>
  <text x="24" y="206" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#4b5563">Cada flip-flop divide la frecuencia a la mitad: Q0 = f/2, Q1 = f/4, Q2 = f/8.</text>
  <text x="24" y="240" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.8" font-weight="700" text-anchor="start" fill="#1f2937">Contador de módulo 6: se resetea cuando llega a 110 (=6) — así cuenta 0…5</text>
  <rect x="60" y="256" width="130" height="70" rx="5" fill="#dcfce7" stroke="#1f2937" stroke-width="1.7"/>
  <text x="125" y="284" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" text-anchor="middle" fill="#4b5563">contador</text>
  <text x="125" y="302" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#1f2937">0 a 5</text>
  <path d="M250,268 L292.0,268 A22.0,22.0 0 0 1 292.0,312 L250,312 Z" fill="#ffffff" stroke="#1f2937" stroke-width="1.7"/>
  <circle cx="319" cy="290.0" r="5" fill="#ffffff" stroke="#1f2937" stroke-width="1.7"/>
  <line x1="228" y1="282.6666666666667" x2="250" y2="282.6666666666667" stroke="#1f2937" stroke-width="1.6"/>
  <text x="223" y="286.6666666666667" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="600" text-anchor="end" fill="#1f2937">Q2</text>
  <line x1="228" y1="297.3333333333333" x2="250" y2="297.3333333333333" stroke="#1f2937" stroke-width="1.6"/>
  <text x="223" y="301.3333333333333" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="600" text-anchor="end" fill="#1f2937">Q1</text>
  <line x1="340" y1="290" x2="388" y2="290" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="388" y1="290" x2="379.7780908812166" y2="286.3393702123178" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="388" y1="290" x2="379.7780908812166" y2="293.6606297876822" stroke="#1f2937" stroke-width="1.6"/>
  <text x="392" y="276" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">Q2·Q1 = 1 ⟺ cuenta = 110 = 6 ⇒ el NAND manda CLEAR y vuelve a 000.</text>
  <text x="392" y="296" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">Así se arma cualquier módulo N: se detecta el estado N y se borra.</text>
  <text x="392" y="316" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#7c2d12">Para módulo 10 (décadas): NAND(Q3, Q1) detecta 1010.</text>
  <text x="24" y="356" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="400" text-anchor="start" fill="#1f2937">Fórmula: n flip-flops dan como máximo módulo 2ⁿ. Para módulo N se necesitan n ≥ log₂N y un circuito de reset.</text>
  <text x="24" y="378" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#4b5563">Síncrono = todos los FF con el mismo reloj · asíncrono = la salida de uno es el reloj del siguiente (más simple, más lento).</text>
</svg>
