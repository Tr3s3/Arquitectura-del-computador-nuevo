  <text x="40" y="402" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#1f2937">Para qué sirven: convertir entre el mundo paralelo (bus de datos) y el serie (un cable). Son la base de las UART del tema 10.4.</text>
