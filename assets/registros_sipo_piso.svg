  <text x="24" y="206" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#4b5563">Después de 4 pulsos los 4 bits están en paralelo: eso hace la UART cuando recibe un byte.</text>
