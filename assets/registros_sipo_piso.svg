  <text x="24" y="374" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#4b5563">Primero se carga el byte (LOAD en paralelo) y después se desplaza: un bit por pulso hacia la salida.</text>
