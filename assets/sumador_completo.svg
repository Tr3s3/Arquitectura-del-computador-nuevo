  <text x="84" y="138" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="400" text-anchor="end" fill="#64748b">van a X1 y A1</text>
  <line x1="370" y1="70" x2="390" y2="70" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="370" y1="165" x2="390" y2="165" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="390" y1="70" x2="390" y2="165" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="34" y="275" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#4b5563">S1 = A⊕B es la señal intermedia: se calcula una sola vez y se reutiliza en X2 y en A2 (es el 'acarreo generado').</text>
  <text x="34" y="295" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#4b5563">Cout = A·B + Cin·(A⊕B): el acarreo sale si A y B son 1, o si el acarreo de entrada encuentra una suma parcial en 1.</text>
  <text x="34" y="315" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#4b5563">Sumando n bits: se encadenan n sumadores completos y el Cout de cada uno se conecta al Cin del siguiente (acarreo en cascada).</text>
  <text x="34" y="335" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#4b5563">Tabla de verdad: S = 1 sólo con un número impar de unos en A, B y Cin;  Cout = 1 cuando hay dos o tres unos.</text>
</svg>
