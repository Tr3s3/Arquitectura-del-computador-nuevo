<svg xmlns="http://www.w3.org/2000/svg" width="940" height="430" viewBox="0 0 940 430">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="26" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1f2937">NAND como compuerta universal: NOT, AND, OR y XOR armados sólo con NAND</text>
  <text x="30" y="52" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#1f2937">1 · NOT con NAND</text>
  <path d="M60,66 L103.0,66 A23.0,23.0 0 0 1 103.0,112 L60,112 Z" fill="#ffffff" stroke="#1f2937" stroke-width="1.7"/>
  <circle cx="131" cy="89.0" r="5" fill="#ffffff" stroke="#1f2937" stroke-width="1.7"/>
  <line x1="32" y1="81.33333333333333" x2="60" y2="81.33333333333333" stroke="#1f2937" stroke-width="1.6"/>
  <text x="27" y="85.33333333333333" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" text-anchor="end" fill="#1f2937">A</text>
  <line x1="32" y1="96.66666666666667" x2="60" y2="96.66666666666667" stroke="#1f2937" stroke-width="1.6"/>
  <text x="27" y="100.66666666666667" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" text-anchor="end" fill="#1f2937">A</text>
  <line x1="136" y1="89.0" x2="164" y2="89.0" stroke="#1f2937" stroke-width="1.6"/>
  <text x="169" y="93.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#1d4ed8">A'</text>
  <text x="30" y="140" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">Uniendo las dos entradas:</text>
  <text x="30" y="156" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">(A·A)' = A' ⇒ inversor.</text>
  <text x="330" y="52" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#1f2937">2 · AND = dos NAND</text>
  <path d="M348,66 L383.0,66 A23.0,23.0 0 0 1 383.0,112 L348,112 Z" fill="#ffffff" stroke="#1f2937" stroke-width="1.7"/>
  <circle cx="411" cy="89.0" r="5" fill="#ffffff" stroke="#1f2937" stroke-width="1.7"/>
  <line x1="328" y1="81.33333333333333" x2="348" y2="81.33333333333333" stroke="#1f2937" stroke-width="1.6"/>
  <text x="323" y="85.33333333333333" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" text-anchor="end" fill="#1f2937">A</text>
  <line x1="328" y1="96.66666666666667" x2="348" y2="96.66666666666667" stroke="#1f2937" stroke-width="1.6"/>
