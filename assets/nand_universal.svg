  <circle cx="557" cy="89.0" r="5" fill="#ffffff" stroke="#1f2937" stroke-width="1.7"/>
  <line x1="484" y1="81.33333333333333" x2="496" y2="81.33333333333333" stroke="#1f2937" stroke-width="1.6"/>
  <text x="479" y="85.33333333333333" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" text-anchor="end" fill="#1f2937">N1</text>
  <line x1="484" y1="96.66666666666667" x2="496" y2="96.66666666666667" stroke="#1f2937" stroke-width="1.6"/>
  <text x="479" y="100.66666666666667" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" text-anchor="end" fill="#1f2937">N1</text>
  <line x1="562" y1="89.0" x2="574" y2="89.0" stroke="#1f2937" stroke-width="1.6"/>
  <text x="579" y="93.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#1d4ed8">A·B</text>
  <text x="330" y="140" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">La primera da (A·B)' y la segunda</text>
  <text x="330" y="156" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">lo invierte: A·B.</text>
  <text x="660" y="52" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#1f2937">3 · OR = NAND de negados</text>
  <path d="M700,66 L741.0,66 A23.0,23.0 0 0 1 741.0,112 L700,112 Z" fill="#ffffff" stroke="#1f2937" stroke-width="1.7"/>
  <circle cx="769" cy="89.0" r="5" fill="#ffffff" stroke="#1f2937" stroke-width="1.7"/>
  <line x1="676" y1="81.33333333333333" x2="700" y2="81.33333333333333" stroke="#1f2937" stroke-width="1.6"/>
  <text x="671" y="85.33333333333333" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" text-anchor="end" fill="#1f2937">A'</text>
  <line x1="676" y1="96.66666666666667" x2="700" y2="96.66666666666667" stroke="#1f2937" stroke-width="1.6"/>
  <text x="671" y="100.66666666666667" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" text-anchor="end" fill="#1f2937">B'</text>
  <line x1="774" y1="89.0" x2="798" y2="89.0" stroke="#1f2937" stroke-width="1.6"/>
  <text x="803" y="93.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#1d4ed8">A + B</text>
  <text x="660" y="140" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">DeMorgan: (A'·B')' = A + B.</text>
  <text x="660" y="156" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">Necesita dos inversores.</text>
  <rect x="24" y="186" width="892" height="228" rx="6" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="40" y="212" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#1f2937">4 · XOR con 4 NAND (el circuito que se pregunta)</text>
