  <text x="31" y="294.6666666666667" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" text-anchor="end" fill="#1f2937">B</text>
  <line x1="134" y1="283.0" x2="158" y2="283.0" stroke="#1f2937" stroke-width="1.6"/>
  <text x="163" y="287.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#1d4ed8">N1</text>
  <path d="M250,232 L289.0,232 A23.0,23.0 0 0 1 289.0,278 L250,278 Z" fill="#ffffff" stroke="#1f2937" stroke-width="1.7"/>
  <circle cx="317" cy="255.0" r="5" fill="#ffffff" stroke="#1f2937" stroke-width="1.7"/>
  <line x1="226" y1="247.33333333333334" x2="250" y2="247.33333333333334" stroke="#1f2937" stroke-width="1.6"/>
  <text x="221" y="251.33333333333334" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" text-anchor="end" fill="#1f2937">A</text>
  <line x1="226" y1="262.6666666666667" x2="250" y2="262.6666666666667" stroke="#1f2937" stroke-width="1.6"/>
  <text x="221" y="266.6666666666667" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" text-anchor="end" fill="#1f2937">N1</text>
  <line x1="322" y1="255.0" x2="346" y2="255.0" stroke="#1f2937" stroke-width="1.6"/>
  <text x="351" y="259.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#1d4ed8">N2</text>
  <path d="M250,312 L289.0,312 A23.0,23.0 0 0 1 289.0,358 L250,358 Z" fill="#ffffff" stroke="#1f2937" stroke-width="1.7"/>
  <circle cx="317" cy="335.0" r="5" fill="#ffffff" stroke="#1f2937" stroke-width="1.7"/>
  <line x1="226" y1="327.3333333333333" x2="250" y2="327.3333333333333" stroke="#1f2937" stroke-width="1.6"/>
  <text x="221" y="331.3333333333333" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" text-anchor="end" fill="#1f2937">N1</text>
  <line x1="226" y1="342.6666666666667" x2="250" y2="342.6666666666667" stroke="#1f2937" stroke-width="1.6"/>
  <text x="221" y="346.6666666666667" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" text-anchor="end" fill="#1f2937">B</text>
  <line x1="322" y1="335.0" x2="346" y2="335.0" stroke="#1f2937" stroke-width="1.6"/>
  <text x="351" y="339.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#1d4ed8">N3</text>
  <path d="M440,272 L482.0,272 A24.0,24.0 0 0 1 482.0,320 L440,320 Z" fill="#ffffff" stroke="#1f2937" stroke-width="1.7"/>
  <circle cx="511" cy="296.0" r="5" fill="#ffffff" stroke="#1f2937" stroke-width="1.7"/>
  <line x1="418" y1="288.0" x2="440" y2="288.0" stroke="#1f2937" stroke-width="1.6"/>
  <text x="413" y="292.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" text-anchor="end" fill="#1f2937">N2</text>
  <line x1="418" y1="304.0" x2="440" y2="304.0" stroke="#1f2937" stroke-width="1.6"/>
  <text x="413" y="308.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" text-anchor="end" fill="#1f2937">N3</text>
  <line x1="516" y1="296.0" x2="538" y2="296.0" stroke="#1f2937" stroke-width="1.6"/>
  <text x="543" y="300.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#1d4ed8">A ⊕ B</text>
  <text x="612" y="254" font-family="Consolas, 'Courier New', monospace" font-size="10.4" font-weight="400" text-anchor="start" fill="#7c2d12">N1 = (A·B)'</text>
  <text x="612" y="276" font-family="Consolas, 'Courier New', monospace" font-size="10.4" font-weight="400" text-anchor="start" fill="#7c2d12">N2 = (A·N1)' = A' + A·B</text>
  <text x="612" y="298" font-family="Consolas, 'Courier New', monospace" font-size="10.4" font-weight="400" text-anchor="start" fill="#7c2d12">N3 = (N1·B)' = A·B' + B'</text>
  <text x="612" y="320" font-family="Consolas, 'Courier New', monospace" font-size="10.4" font-weight="700" text-anchor="start" fill="#0f766e">salida = (N2·N3)' = A·B' + A'·B = A ⊕ B</text>
  <text x="40" y="372" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#4b5563">Las entradas N1, N2 y N3 son nombres de señales: no hace falta dibujar cada cable, basta con escribir el nombre.</text>
  <text x="40" y="392" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#4b5563">Un XOR cuesta 4 compuertas (4 NAND o 4 NOR): ése es el argumento de 'universal' — un solo tipo de chip arma todo.</text>
</svg>
