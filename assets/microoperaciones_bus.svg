  <text x="740" y="184" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2937">ALU</text>
  <line x1="740" y1="206" x2="740" y2="296" stroke="#1f2937" stroke-width="1.6"/>
