  <line x1="720" y1="296" x2="720" y2="210" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="720" y1="210" x2="716.3393702123178" y2="218.2219091187834" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="720" y1="210" x2="723.6606297876822" y2="218.2219091187834" stroke="#1f2937" stroke-width="1.6"/>
  <text x="696" y="250" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.6" font-weight="400" text-anchor="start" fill="#15803d">in</text>
  <text x="60" y="330" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#4b5563">Cada registro tiene un buffer de 3 estados a la salida (sólo uno habla a la vez) y una entrada que se carga con el pulso.</text>
  <text x="24" y="52" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#1f2937">La microoperación R1 ← R2 se hace en UN pulso:</text>
  <text x="24" y="78" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#1f2937">1 · la UC activa la salida de R2 (R2out) ⇒ R2 pone su contenido en el bus;</text>
  <text x="24" y="98" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#1f2937">2 · la UC activa la carga de R1 (R1in) ⇒ en el flanco del pulso R1 copia el bus.</text>
  <text x="24" y="118" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#4b5563">Todo lo demás queda en alta impedancia: el bus es compartido y sólo un dueño por vez.</text>
  <rect x="24" y="352" width="872" height="40" rx="6" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="40" y="372" font-family="Consolas, 'Courier New', monospace" font-size="9.6" font-weight="400" text-anchor="start" fill="#1f2937">Notación RTL:  R1 ← R2   ·   R3 ← R1 + R2   ·   R0 ← 0   ·   PC ← PC + 1   (la flecha indica destino, el ← es la operación)</text>
  <text x="40" y="388" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#4b5563">Toda instrucción es una secuencia de microoperaciones: buscar (MAR←PC), ejecutar (R1←R2) y actualizar (PC←PC+1).</text>
</svg>
