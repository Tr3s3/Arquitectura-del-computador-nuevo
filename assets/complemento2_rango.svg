<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="26" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1f2937">Complemento a 2: rango, acarreo (C) y desborde (V)</text>
  <text x="24" y="52" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.8" font-weight="700" text-anchor="start" fill="#1f2937">Con n bits: los enteros que entran son de −2ⁿ⁻¹ a +2ⁿ⁻¹ − 1</text>
  <text x="24" y="76" font-family="Consolas, 'Courier New', monospace" font-size="9.6" font-weight="400" text-anchor="start" fill="#7c2d12">4 bits: 1000 = −8  ·  1111 = −1  ·  0000 = 0  ·  0111 = +7   ⇒ 16 valores en total</text>
  <rect x="40" y="92" width="50" height="40" rx="3" fill="#dbeafe" stroke="#1f2937" stroke-width="1.1"/>
  <text x="65" y="110" font-family="Consolas, 'Courier New', monospace" font-size="7.6" font-weight="400" text-anchor="middle" fill="#1f2937">0000</text>
  <text x="65" y="124" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="#1f2937">+0</text>
  <rect x="95" y="92" width="50" height="40" rx="3" fill="#dbeafe" stroke="#1f2937" stroke-width="1.1"/>
  <text x="120" y="110" font-family="Consolas, 'Courier New', monospace" font-size="7.6" font-weight="400" text-anchor="middle" fill="#1f2937">0001</text>
  <text x="120" y="124" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="#1f2937">+1</text>
  <rect x="150" y="92" width="50" height="40" rx="3" fill="#dbeafe" stroke="#1f2937" stroke-width="1.1"/>
  <text x="175" y="110" font-family="Consolas, 'Courier New', monospace" font-size="7.6" font-weight="400" text-anchor="middle" fill="#1f2937">0010</text>
  <text x="175" y="124" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="#1f2937">+2</text>
  <rect x="205" y="92" width="50" height="40" rx="3" fill="#dbeafe" stroke="#1f2937" stroke-width="1.1"/>
  <text x="230" y="110" font-family="Consolas, 'Courier New', monospace" font-size="7.6" font-weight="400" text-anchor="middle" fill="#1f2937">0011</text>
  <text x="230" y="124" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="#1f2937">+3</text>
  <rect x="260" y="92" width="50" height="40" rx="3" fill="#dbeafe" stroke="#1f2937" stroke-width="1.1"/>
  <text x="285" y="110" font-family="Consolas, 'Courier New', monospace" font-size="7.6" font-weight="400" text-anchor="middle" fill="#1f2937">0100</text>
  <text x="285" y="124" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="#1f2937">+4</text>
  <rect x="315" y="92" width="50" height="40" rx="3" fill="#dbeafe" stroke="#1f2937" stroke-width="1.1"/>
  <text x="340" y="110" font-family="Consolas, 'Courier New', monospace" font-size="7.6" font-weight="400" text-anchor="middle" fill="#1f2937">0101</text>
  <text x="340" y="124" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="#1f2937">+5</text>
  <rect x="370" y="92" width="50" height="40" rx="3" fill="#dbeafe" stroke="#1f2937" stroke-width="1.1"/>
  <text x="395" y="110" font-family="Consolas, 'Courier New', monospace" font-size="7.6" font-weight="400" text-anchor="middle" fill="#1f2937">0110</text>
  <text x="395" y="124" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="#1f2937">+6</text>
  <rect x="425" y="92" width="50" height="40" rx="3" fill="#dbeafe" stroke="#1f2937" stroke-width="1.1"/>
  <text x="450" y="110" font-family="Consolas, 'Courier New', monospace" font-size="7.6" font-weight="400" text-anchor="middle" fill="#1f2937">0111</text>
  <text x="450" y="124" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="#1f2937">+7</text>
  <rect x="480" y="92" width="50" height="40" rx="3" fill="#fef3c7" stroke="#1f2937" stroke-width="1.1"/>
  <text x="505" y="110" font-family="Consolas, 'Courier New', monospace" font-size="7.6" font-weight="400" text-anchor="middle" fill="#1f2937">1000</text>
  <text x="505" y="124" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="#1f2937">-8</text>
  <rect x="535" y="92" width="50" height="40" rx="3" fill="#fef3c7" stroke="#1f2937" stroke-width="1.1"/>
  <text x="560" y="110" font-family="Consolas, 'Courier New', monospace" font-size="7.6" font-weight="400" text-anchor="middle" fill="#1f2937">1001</text>
  <text x="560" y="124" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="#1f2937">-7</text>
  <rect x="590" y="92" width="50" height="40" rx="3" fill="#fef3c7" stroke="#1f2937" stroke-width="1.1"/>
  <text x="615" y="110" font-family="Consolas, 'Courier New', monospace" font-size="7.6" font-weight="400" text-anchor="middle" fill="#1f2937">1010</text>
  <text x="615" y="124" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="#1f2937">-6</text>
  <rect x="645" y="92" width="50" height="40" rx="3" fill="#fef3c7" stroke="#1f2937" stroke-width="1.1"/>
  <text x="670" y="110" font-family="Consolas, 'Courier New', monospace" font-size="7.6" font-weight="400" text-anchor="middle" fill="#1f2937">1011</text>
  <text x="670" y="124" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="#1f2937">-5</text>
  <rect x="700" y="92" width="50" height="40" rx="3" fill="#fef3c7" stroke="#1f2937" stroke-width="1.1"/>
  <text x="725" y="110" font-family="Consolas, 'Courier New', monospace" font-size="7.6" font-weight="400" text-anchor="middle" fill="#1f2937">1100</text>
  <text x="725" y="124" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="#1f2937">-4</text>
  <rect x="755" y="92" width="50" height="40" rx="3" fill="#fef3c7" stroke="#1f2937" stroke-width="1.1"/>
  <text x="780" y="110" font-family="Consolas, 'Courier New', monospace" font-size="7.6" font-weight="400" text-anchor="middle" fill="#1f2937">1101</text>
  <text x="780" y="124" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="#1f2937">-3</text>
  <rect x="810" y="92" width="50" height="40" rx="3" fill="#fef3c7" stroke="#1f2937" stroke-width="1.1"/>
  <text x="835" y="110" font-family="Consolas, 'Courier New', monospace" font-size="7.6" font-weight="400" text-anchor="middle" fill="#1f2937">1110</text>
  <text x="835" y="124" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="#1f2937">-2</text>
  <rect x="865" y="92" width="50" height="40" rx="3" fill="#fef3c7" stroke="#1f2937" stroke-width="1.1"/>
  <text x="890" y="110" font-family="Consolas, 'Courier New', monospace" font-size="7.6" font-weight="400" text-anchor="middle" fill="#1f2937">1111</text>
  <text x="890" y="124" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="#1f2937">-1</text>
  <text x="24" y="156" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">Por qué es asimétrico: hay un solo cero (0000) y el 1000 no tiene positivo ⇒ el rango negativo tiene un valor más.</text>
  <text x="24" y="190" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.8" font-weight="700" text-anchor="start" fill="#1f2937">Las dos banderas NO son lo mismo (el error clásico)</text>
  <rect x="24" y="204" width="440" height="120" rx="6" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="40" y="226" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="700" text-anchor="start" fill="#1d4ed8">C (acarreo) = C_out del último bit</text>
  <text x="40" y="248" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" text-anchor="start" fill="#4b5563">Indica que el resultado se salió de n bits</text>
  <text x="40" y="268" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" text-anchor="start" fill="#4b5563">tratándolos como SIN signo.</text>
  <text x="40" y="292" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="400" text-anchor="start" fill="#1f2937">9 + 8 = 17 ⇒ 1 0001: C = 1 (y el bit que</text>
  <text x="40" y="308" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="400" text-anchor="start" fill="#1f2937">queda es 0001).</text>
  <rect x="480" y="204" width="416" height="120" rx="6" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="496" y="226" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="700" text-anchor="start" fill="#b91c1c">V (desborde) = C_entrada ⊕ C_salida del signo</text>
  <text x="496" y="248" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" text-anchor="start" fill="#4b5563">Indica que el resultado no entra con SIGNO:</text>
  <text x="496" y="268" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" text-anchor="start" fill="#4b5563">dos positivos dieron negativo (o al revés).</text>
  <text x="496" y="292" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="400" text-anchor="start" fill="#1f2937">+7 + 1 = 1000 = −8 ⇒ V = 1 (¡y C = 0!)</text>
  <text x="496" y="308" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="400" text-anchor="start" fill="#1f2937">−8 − 1 = 0111 = +7 ⇒ V = 1</text>
  <text x="24" y="348" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#1f2937">Cómo se detecta V sin mirar los acarreos: si los dos operandos tienen el MISMO signo y el resultado tiene otro, hay desborde.</text>
  <text x="24" y="370" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">La resta se hace con A + B' + 1: el +1 entra como C0, y el C final se INVIERTE al leerlo como 'hubo préstamo'.</text>
  <text x="24" y="392" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#7c2d12">Regla de oro: C se lee en aritmética sin signo; V, en aritmética con signo. Nunca se mezclan.</text>
</svg>
