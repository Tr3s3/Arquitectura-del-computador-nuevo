  <text x="40" y="330" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#4b5563">El selector (S1 S0) habilita UN solo AND por vez; por lo tanto sólo ese dato llega a la OR y sale por Z.</text>
  <text x="40" y="345" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#4b5563">Es un selector de datos: conmuta 4 entradas a 1 salida. Es la base del manejo de un bus compartido.</text>
