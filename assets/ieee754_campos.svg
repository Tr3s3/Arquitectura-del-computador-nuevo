<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="26" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1f2937">IEEE 754: los campos del formato simple y del doble</text>
  <text x="24" y="52" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.8" font-weight="700" text-anchor="start" fill="#1f2937">Simple (32 bits): 1 + 8 + 23 · exceso 127</text>
  <rect x="60" y="70" width="50" height="40" rx="3" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="85" y="96" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937">S</text>
  <text x="85" y="126" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.6" font-weight="400" text-anchor="middle" fill="#4b5563">1</text>
  <rect x="110" y="70" width="150" height="40" rx="3" fill="#fef3c7" stroke="#1f2937" stroke-width="1.5"/>
  <text x="185" y="96" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#1f2937">exponente</text>
  <text x="185" y="126" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.6" font-weight="400" text-anchor="middle" fill="#4b5563">8 bits (0-255)</text>
  <rect x="260" y="70" width="400" height="40" rx="3" fill="#dcfce7" stroke="#1f2937" stroke-width="1.5"/>
  <text x="460" y="96" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#1f2937">mantissa (fracción)</text>
  <text x="460" y="126" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.6" font-weight="400" text-anchor="middle" fill="#4b5563">23 bits</text>
  <text x="24" y="156" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.8" font-weight="700" text-anchor="start" fill="#1f2937">Doble (64 bits): 1 + 11 + 52 · exceso 1023 · 15-17 dígitos decimales</text>
  <rect x="60" y="172" width="40" height="40" rx="3" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="80" y="198" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1f2937">S</text>
  <rect x="100" y="172" width="190" height="40" rx="3" fill="#fef3c7" stroke="#1f2937" stroke-width="1.5"/>
  <text x="195" y="198" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#1f2937">exponente (11)</text>
  <rect x="290" y="172" width="500" height="40" rx="3" fill="#dcfce7" stroke="#1f2937" stroke-width="1.5"/>
  <text x="540" y="198" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#1f2937">mantissa (52 bits)</text>
  <rect x="24" y="232" width="872" height="132" rx="6" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="40" y="254" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="700" text-anchor="start" fill="#1f2937">Ejemplo resuelto: decodificar  0 10000010 01000000000000000000000</text>
  <text x="40" y="276" font-family="Consolas, 'Courier New', monospace" font-size="9.4" font-weight="400" text-anchor="start" fill="#1f2937">S = 0 ⇒ positivo · E = 10000010 = 130 ⇒ 130 − 127 = 3 · M = 01000… ⇒ 1,01 (el 1 es implícito)</text>
  <text x="40" y="296" font-family="Consolas, 'Courier New', monospace" font-size="9.4" font-weight="400" text-anchor="start" fill="#0f766e">valor = +1,01₂ × 2³ = 1,25 × 8 = 10,0  ⇒  0x41200000 es el 10,0 en simple precisión</text>
  <text x="40" y="322" font-family="Consolas, 'Courier New', monospace" font-size="9.4" font-weight="400" text-anchor="start" fill="#1f2937">Al revés (10,0 a binario): 10 = 1010 = 1,010 × 2³ ⇒ S=0, E=3+127=130=10000010, M=0100… ⇒ 0 10000010 0100…</text>
  <text x="40" y="346" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" text-anchor="start" fill="#7c2d12">Casos especiales: E = 0 y M = 0 ⇒ ±0 · E = 255 y M = 0 ⇒ ±∞ · E = 255 y M ≠ 0 ⇒ NaN (no es un número) · E = 0 con M ≠ 0 ⇒ desnormalizado.</text>
  <text x="24" y="384" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">Rangos del simple: ≈ 1,2·10⁻³⁸ a 3,4·10³⁸, con 7 dígitos significativos. Por eso 0,1 + 0,2 no da exactamente 0,3.</text>
</svg>
