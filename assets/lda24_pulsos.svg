  <text x="250" y="456" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#4b5563">Amarillo = los pulsos que hay que saber nombrar en el oral: CP1/CP6 de la búsqueda (traer la instrucción),</text>
  <text x="250" y="471" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#4b5563">CP13/CP14 de ejecución 1 (cargar el índice en X y el campo de dirección en W) y CP17/CP22 de ejecución 2</text>
  <text x="250" y="486" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#4b5563">(direccionar el operando y cargarlo en el acumulador).</text>
  <text x="250" y="512" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#4b5563">Hay 3 accesos a memoria: búsqueda (trae la 1. palabra), ejecución 1 (trae la 2. palabra = campo de dirección)</text>
  <text x="250" y="527" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#4b5563">y ejecución 2 (trae el operando). Por eso 24 pulsos y no 16: la instrucción ocupa 2 palabras.</text>
  <text x="250" y="556" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#4b5563">LDA 0, X (directo): 24 pulsos, en CP13 se carga 0 en X.     LDA 1, X (indirecto): 32 pulsos (un ciclo más).</text>
  <text x="250" y="571" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#4b5563">LDA 2, X (RIF): 24 pulsos, en CP13 se carga RIF.             LDA 3, X (RID): 24 pulsos, en CP13 se carga RID.</text>
