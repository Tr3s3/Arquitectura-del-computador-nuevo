<svg xmlns="http://www.w3.org/2000/svg" width="920" height="410" viewBox="0 0 920 410">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="26" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1f2937">estado · pulso · instrucción: la lógica que genera las señales de control</text>
  <text x="24" y="52" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.8" font-weight="700" text-anchor="start" fill="#1f2937">Las señales de control se activan por la combinación de tres cosas</text>
  <rect x="60" y="80" width="130" height="44" rx="6" ry="6" fill="#dbeafe" stroke="#1f2937" stroke-width="1.7"/>
  <text x="125.0" y="99.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">ESTADO</text>
  <text x="125.0" y="116.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">F / E / I</text>
  <rect x="60" y="146" width="130" height="44" rx="6" ry="6" fill="#dcfce7" stroke="#1f2937" stroke-width="1.7"/>
  <text x="125.0" y="165.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">PULSO</text>
  <text x="125.0" y="182.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">CP1 … CP8</text>
  <rect x="60" y="212" width="130" height="44" rx="6" ry="6" fill="#fef3c7" stroke="#1f2937" stroke-width="1.7"/>
  <text x="125.0" y="231.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">INSTRUCCIÓN</text>
  <text x="125.0" y="248.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">opcode (4 bits)</text>
  <rect x="280" y="130" width="180" height="90" rx="6" ry="6" fill="#f8fafc" stroke="#1f2937" stroke-width="1.7"/>
  <text x="370" y="158" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="700" text-anchor="middle" fill="#1f2937">DECODIFICADOR</text>
  <text x="370" y="176" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="middle" fill="#4b5563">1 de 16</text>
  <text x="370" y="198" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" text-anchor="middle" fill="#4b5563">y compuertas AND</text>
  <line x1="192" y1="102" x2="278" y2="140" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="278" y1="140" x2="271.95902409123215" y2="133.3286725406643" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="278" y1="140" x2="269.00003564669635" y2="140.0253305993506" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="192" y1="168" x2="278" y2="168" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="278" y1="168" x2="269.7780908812166" y2="164.3393702123178" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="278" y1="168" x2="269.7780908812166" y2="171.6606297876822" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="192" y1="234" x2="278" y2="196" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="278" y1="196" x2="269.00003564669635" y2="195.9746694006494" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="278" y1="196" x2="271.95902409123215" y2="202.6713274593357" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="462" y1="168" x2="540" y2="94" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="540" y1="94" x2="531.515836763115" y2="97.0031606966477" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="540" y1="94" x2="536.5547700406464" y2="102.31446874593757" stroke="#1f2937" stroke-width="1.6"/>
  <text x="548" y="98" font-family="Consolas, 'Courier New', monospace" font-size="9.4" font-weight="400" text-anchor="start" fill="#1f2937">MAR ← PC</text>
  <line x1="462" y1="168" x2="540" y2="128" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="540" y1="128" x2="531.013595375641" y2="128.49450169595238" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="540" y1="128" x2="534.3544080012534" y2="135.0090863158966" stroke="#1f2937" stroke-width="1.6"/>
  <text x="548" y="132" font-family="Consolas, 'Courier New', monospace" font-size="9.4" font-weight="400" text-anchor="start" fill="#1f2937">PC ← PC+1</text>
  <line x1="462" y1="168" x2="540" y2="162" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="540" y1="162" x2="531.5215511453023" y2="158.98074429398994" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="540" y1="162" x2="532.083066122159" y2="166.28043899312843" stroke="#1f2937" stroke-width="1.6"/>
  <text x="548" y="166" font-family="Consolas, 'Courier New', monospace" font-size="9.4" font-weight="400" text-anchor="start" fill="#1f2937">IR ← MBR</text>
  <line x1="462" y1="168" x2="540" y2="196" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="540" y1="196" x2="533.4983807351748" y2="189.77674145360697" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="540" y1="196" x2="531.0247851726531" y2="196.66747194920308" stroke="#1f2937" stroke-width="1.6"/>
  <text x="548" y="200" font-family="Consolas, 'Courier New', monospace" font-size="9.4" font-weight="400" text-anchor="start" fill="#1f2937">Read</text>
  <line x1="462" y1="168" x2="540" y2="230" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="540" y1="230" x2="535.8415037246165" y2="222.01833922497192" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="540" y1="230" x2="531.2858929620336" y2="227.74959147467303" stroke="#1f2937" stroke-width="1.6"/>
  <text x="548" y="234" font-family="Consolas, 'Courier New', monospace" font-size="9.4" font-weight="400" text-anchor="start" fill="#1f2937">Write</text>
  <line x1="462" y1="168" x2="540" y2="264" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="540" y1="264" x2="537.656390772961" y2="255.3104950779151" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="540" y1="264" x2="531.9742587180355" y2="259.9272273725421" stroke="#1f2937" stroke-width="1.6"/>
  <text x="548" y="268" font-family="Consolas, 'Courier New', monospace" font-size="9.4" font-weight="400" text-anchor="start" fill="#1f2937">AC ← ALU</text>
  <text x="700" y="96" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="700" text-anchor="start" fill="#1f2937">Cada señal es un producto:</text>
  <text x="700" y="118" font-family="Consolas, 'Courier New', monospace" font-size="9.6" font-weight="400" text-anchor="start" fill="#7c2d12">salida = F·CP1·LDA</text>
  <text x="700" y="138" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" text-anchor="start" fill="#4b5563">⇒ MAR←PC sólo en CP1, en</text>
  <text x="700" y="154" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" text-anchor="start" fill="#4b5563">búsqueda, con LDA.</text>
  <text x="700" y="180" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" text-anchor="start" fill="#4b5563">El decodificador 1 de 16 convierte</text>
  <text x="700" y="196" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" text-anchor="start" fill="#4b5563">los 4 bits del opcode en una línea</text>
  <text x="700" y="212" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" text-anchor="start" fill="#4b5563">activa (una por instrucción).</text>
  <rect x="24" y="286" width="872" height="106" rx="6" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="40" y="308" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#1f2937">Con 3 bits de estado (F, E, I), 3 bits de pulso (CP1-CP8) y 4 de opcode: 10 variables ⇒ la UC es una función combinacional enorme.</text>
  <text x="40" y="330" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#4b5563">Por eso se usan dos soluciones: control cableado (compuertas y PLA, rápido pero rígido) o microprogramado (memoria de control, flexible). Ver unidad 6.</text>
  <text x="40" y="352" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#4b5563">El estado F/E/I se guarda en 2 biestables; el pulso lo da un contador de 3 bits que cuenta 1…8 con el reloj.</text>
  <text x="40" y="374" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#7c2d12">Regla de la cátedra: toda señal se escribe como estado·pulso·instrucción — así aparece en las tablas de microoperaciones.</text>
  <text x="24" y="406" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#4b5563">El decodificador 1 de 16 es el mismo circuito de la unidad 1 (2⁴ = 16 salidas), aplicado al campo CodOp.</text>
</svg>
