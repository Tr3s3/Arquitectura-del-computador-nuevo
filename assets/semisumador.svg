  <text x="40" y="60" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#4b5563">Suma sin acarreo de entrada: c = 0</text>
  <text x="40" y="78" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#4b5563">Sólo sirve para el bit menos significativo (LSB).</text>
  <text x="40" y="200" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#4b5563">A, B: bits a sumar.</text>
  <text x="40" y="215" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#4b5563">S: bit de suma.  C: acarreo de salida (carry).</text>
