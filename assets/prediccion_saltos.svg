<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="26" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1f2937">Predicción de saltos: adivinar para no frenar el pipeline</text>
  <text x="24" y="52" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="700" text-anchor="start" fill="#1f2937">Por qué hace falta: cuando llega un salto, la etapa de búsqueda no sabe qué traer</text>
  <text x="24" y="92" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="700" text-anchor="start" fill="#1f2937">Predictor dinámico de 2 bits (máquina de estados)</text>
  <rect x="70" y="130" width="140" height="56" rx="6" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="140" y="154" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="700" text-anchor="middle" fill="#1d4ed8">00</text>
  <text x="140" y="174" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="middle" fill="#4b5563">no tomar (seguro)</text>
  <rect x="230" y="130" width="140" height="56" rx="6" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="300" y="154" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="700" text-anchor="middle" fill="#1d4ed8">01</text>
  <text x="300" y="174" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="middle" fill="#4b5563">casi no tomar</text>
  <rect x="390" y="130" width="140" height="56" rx="6" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="460" y="154" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="700" text-anchor="middle" fill="#1d4ed8">10</text>
  <text x="460" y="174" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="middle" fill="#4b5563">casi tomar</text>
  <rect x="550" y="130" width="140" height="56" rx="6" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="620" y="154" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="700" text-anchor="middle" fill="#1d4ed8">11</text>
  <text x="620" y="174" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="middle" fill="#4b5563">tomar (seguro)</text>
