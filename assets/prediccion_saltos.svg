  <text x="160" y="200" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#15803d">tomó</text>
  <text x="320" y="200" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#15803d">tomó</text>
  <text x="470" y="200" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.4" font-weight="400" text-anchor="start" fill="#15803d">tomó</text>
  <line x1="228" y1="180" x2="210" y2="180" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="210" y1="180" x2="218.2219091187834" y2="183.6606297876822" stroke="#1f2937" stroke-width="1.6"/>
