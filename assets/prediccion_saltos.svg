  <line x1="530" y1="180" x2="538.2219091187834" y2="176.3393702123178" stroke="#1f2937" stroke-width="1.6"/>
  <text x="160" y="196" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8" font-weight="400" text-anchor="start" fill="#1f2937"></text>
  <text x="300" y="232" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.6" font-weight="400" text-anchor="start" fill="#b91c1c">no tomó (vuelve)</text>
  <text x="60" y="252" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.8" font-weight="400" text-anchor="start" fill="#4b5563">Hacen falta DOS errores seguidos para cambiar de opinión: así los lazos no engañan al predictor.</text>
  <rect x="700" y="84" width="196" height="180" rx="6" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="716" y="106" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="700" text-anchor="start" fill="#1f2937">Acierto típico</text>
  <text x="716" y="128" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#1f2937">estático: 50-70 %</text>
  <text x="716" y="146" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#1f2937">dinámico 2 bits: 85-90 %</text>
  <text x="716" y="164" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="400" text-anchor="start" fill="#15803d">con historial: 95 %+</text>
  <text x="716" y="188" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.6" font-weight="400" text-anchor="start" fill="#4b5563">BTB: guarda la dirección</text>
  <text x="716" y="204" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.6" font-weight="400" text-anchor="start" fill="#4b5563">del salto ya tomado</text>
  <text x="716" y="228" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.6" font-weight="400" text-anchor="start" fill="#4b5563">Retorno (RET/RTI):</text>
  <text x="716" y="244" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.6" font-weight="400" text-anchor="start" fill="#4b5563">pila de direcciones</text>
  <text x="24" y="274" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="700" text-anchor="start" fill="#1f2937">El costo de equivocarse (el cálculo del final)</text>
  <rect x="24" y="288" width="872" height="96" rx="6" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="40" y="310" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#1f2937">1 000 instrucciones · 200 saltos (20 %) · penalidad 5 ciclos</text>
  <text x="40" y="332" font-family="Consolas, 'Courier New', monospace" font-size="9.6" font-weight="400" text-anchor="start" fill="#7c2d12">90 % de acierto ⇒ 20 fallos × 5 = 100 ciclos ⇒ CPI = 1,10      ·      95 % ⇒ 10 × 5 = 50 ciclos ⇒ CPI = 1,05</text>
  <text x="40" y="354" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#15803d">Subir el acierto 5 puntos recorta la MITAD de la pérdida: por eso los predictores son tan caros y tan importantes.</text>
  <text x="40" y="374" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">Un salto mal predicho descarta las instrucciones que ya entraron al pipeline: no es gratis aunque el salto 'era lógico'.</text>
  <text x="24" y="396" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">Complementos: delay slot (MIPS: la instrucción siguiente se ejecuta siempre) y saltos retardados por el compilador.</text>
</svg>
