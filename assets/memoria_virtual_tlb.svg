<svg xmlns="http://www.w3.org/2000/svg" width="920" height="410" viewBox="0 0 920 410">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="26" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1f2937">Memoria virtual: dirección virtual → tabla de páginas → dirección física (y el TLB)</text>
  <text x="24" y="52" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.8" font-weight="700" text-anchor="start" fill="#1f2937">La CPU genera una dirección VIRTUAL; la MMU la traduce a FÍSICA usando la tabla de páginas</text>
  <rect x="40" y="76" width="150" height="60" rx="6" ry="6" fill="#dbeafe" stroke="#1f2937" stroke-width="1.7"/>
  <text x="115.0" y="103.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">CPU</text>
  <text x="115.0" y="120.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">dir. virtual</text>
  <rect x="230" y="76" width="130" height="60" rx="6" ry="6" fill="#fef3c7" stroke="#1f2937" stroke-width="1.7"/>
  <text x="295.0" y="103.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">MMU</text>
  <text x="295.0" y="120.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">traduce</text>
  <rect x="400" y="76" width="170" height="60" rx="6" ry="6" fill="#e0e7ff" stroke="#1f2937" stroke-width="1.7"/>
  <text x="485.0" y="103.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">RAM</text>
  <text x="485.0" y="120.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">dir. física</text>
  <line x1="190" y1="106" x2="226" y2="106" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="226" y1="106" x2="217.7780908812166" y2="102.3393702123178" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="226" y1="106" x2="217.7780908812166" y2="109.6606297876822" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="360" y1="106" x2="396" y2="106" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="396" y1="106" x2="387.7780908812166" y2="102.3393702123178" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="396" y1="106" x2="387.7780908812166" y2="109.6606297876822" stroke="#1f2937" stroke-width="1.6"/>
  <rect x="230" y="176" width="130" height="50" rx="6" ry="6" fill="#dcfce7" stroke="#1f2937" stroke-width="1.7"/>
  <text x="295.0" y="198.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">TLB</text>
  <text x="295.0" y="215.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">caché de la tabla</text>
  <line x1="295" y1="140" x2="295" y2="172" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="295" y1="172" x2="298.6606297876822" y2="163.7780908812166" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="295" y1="172" x2="291.3393702123178" y2="163.7780908812166" stroke="#1f2937" stroke-width="1.6"/>
  <text x="410" y="194" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">TLB acierto ⇒ 1 ciclo; fallo ⇒ leer la tabla en RAM (1-2 accesos: 100+ ciclos).</text>
  <text x="410" y="214" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">Es exactamente 'caché de la caché de la traducción'.</text>
  <text x="24" y="258" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="700" text-anchor="start" fill="#1f2937">La dirección se parte en dos campos:</text>
  <rect x="40" y="272" width="150" height="40" rx="3" fill="#dbeafe" stroke="#1f2937" stroke-width="1.4"/>
  <text x="115" y="297" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="700" text-anchor="middle" fill="#1f2937">nº de página</text>
  <rect x="190" y="272" width="120" height="40" rx="3" fill="#fef3c7" stroke="#1f2937" stroke-width="1.4"/>
  <text x="250" y="297" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="700" text-anchor="middle" fill="#1f2937">desplazamiento</text>
  <text x="330" y="288" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">El desplazamiento NO se traduce: pasa tal cual.</text>
  <text x="330" y="306" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">Sólo se traduce el número de página.</text>
  <text x="24" y="344" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#b91c1c">Fallo de página: la página no está en RAM ⇒ el SO la trae del disco (13 ms de un HDD) ⇒ por eso se elige una víctima y se escribe si está sucia.</text>
  <text x="24" y="364" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#4b5563">Qué resuelve: dar a cada proceso un espacio de direcciones propio y aislado, permitir programas más grandes que la RAM y compartir páginas.</text>
  <text x="24" y="384" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#4b5563">Se apoya en la misma idea de la caché: localidad + traducción guardada + política de reemplazo. El 'disco lento' del tema 10.4 es la razón de existir.</text>
</svg>
