<svg xmlns="http://www.w3.org/2000/svg" width="920" height="410" viewBox="0 0 920 410">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="26" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1f2937">Algoritmo de Booth: multiplicar con signo sin separar los signos</text>
  <text x="24" y="52" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.6" font-weight="700" text-anchor="start" fill="#1f2937">La idea: mirar el par (Q0, Q−1) y decidir sin mirar los signos</text>
  <text x="40" y="84" font-family="Consolas, 'Courier New', monospace" font-size="9.4" font-weight="700" text-anchor="start" fill="#1f2937">Q0 Q−1</text>
  <text x="130" y="84" font-family="Consolas, 'Courier New', monospace" font-size="9.4" font-weight="700" text-anchor="start" fill="#1f2937">acción</text>
  <text x="250" y="84" font-family="Consolas, 'Courier New', monospace" font-size="9.4" font-weight="700" text-anchor="start" fill="#1f2937">cuándo</text>
  <text x="40" y="106" font-family="Consolas, 'Courier New', monospace" font-size="9.4" font-weight="400" text-anchor="start" fill="#4b5563">0 0</text>
  <text x="130" y="106" font-family="Consolas, 'Courier New', monospace" font-size="9.4" font-weight="400" text-anchor="start" fill="#4b5563">nada</text>
  <text x="250" y="106" font-family="Consolas, 'Courier New', monospace" font-size="9.4" font-weight="400" text-anchor="start" fill="#4b5563">los bits son iguales: no hay que sumar</text>
  <text x="40" y="128" font-family="Consolas, 'Courier New', monospace" font-size="9.4" font-weight="400" text-anchor="start" fill="#7c2d12">0 1</text>
  <text x="130" y="128" font-family="Consolas, 'Courier New', monospace" font-size="9.4" font-weight="400" text-anchor="start" fill="#7c2d12">A ← A + M</text>
  <text x="250" y="128" font-family="Consolas, 'Courier New', monospace" font-size="9.4" font-weight="400" text-anchor="start" fill="#7c2d12">empieza una tira de unos</text>
  <text x="40" y="150" font-family="Consolas, 'Courier New', monospace" font-size="9.4" font-weight="400" text-anchor="start" fill="#7c2d12">1 0</text>
  <text x="130" y="150" font-family="Consolas, 'Courier New', monospace" font-size="9.4" font-weight="400" text-anchor="start" fill="#7c2d12">A ← A − M</text>
  <text x="250" y="150" font-family="Consolas, 'Courier New', monospace" font-size="9.4" font-weight="400" text-anchor="start" fill="#7c2d12">termina una tira de unos</text>
  <text x="40" y="172" font-family="Consolas, 'Courier New', monospace" font-size="9.4" font-weight="400" text-anchor="start" fill="#4b5563">1 1</text>
  <text x="130" y="172" font-family="Consolas, 'Courier New', monospace" font-size="9.4" font-weight="400" text-anchor="start" fill="#4b5563">nada</text>
  <text x="250" y="172" font-family="Consolas, 'Courier New', monospace" font-size="9.4" font-weight="400" text-anchor="start" fill="#4b5563">los bits son iguales</text>
  <text x="40" y="206" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#4b5563">Después de cada paso se desplaza a la DERECHA el conjunto (A, Q, Q−1) con extensión de signo.</text>
  <text x="470" y="84" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="700" text-anchor="start" fill="#1f2937">Ejemplo: (−5) × 3 = −15</text>
  <text x="470" y="108" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="700" text-anchor="start" fill="#1f2937">paso</text>
  <text x="530" y="108" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="700" text-anchor="start" fill="#1f2937">A</text>
  <text x="600" y="108" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="700" text-anchor="start" fill="#1f2937">Q</text>
  <text x="665" y="108" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="700" text-anchor="start" fill="#1f2937">Q−1</text>
  <text x="720" y="108" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="700" text-anchor="start" fill="#1f2937">acción</text>
  <text x="470" y="130" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="400" text-anchor="start" fill="#15803d">inicio</text>
  <text x="530" y="130" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="400" text-anchor="start" fill="#15803d">0000</text>
  <text x="600" y="130" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="400" text-anchor="start" fill="#15803d">0011</text>
  <text x="665" y="130" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="400" text-anchor="start" fill="#15803d">0</text>
  <text x="720" y="130" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="400" text-anchor="start" fill="#15803d">—</text>
  <text x="470" y="152" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="400" text-anchor="start" fill="#1f2937">1</text>
  <text x="530" y="152" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="400" text-anchor="start" fill="#1f2937">0010</text>
  <text x="600" y="152" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="400" text-anchor="start" fill="#1f2937">1001</text>
  <text x="665" y="152" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="400" text-anchor="start" fill="#1f2937">1</text>
  <text x="720" y="152" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="400" text-anchor="start" fill="#1f2937">par 10 ⇒ A − M</text>
  <text x="470" y="174" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="400" text-anchor="start" fill="#1f2937">2</text>
  <text x="530" y="174" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="400" text-anchor="start" fill="#1f2937">0001</text>
  <text x="600" y="174" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="400" text-anchor="start" fill="#1f2937">0100</text>
  <text x="665" y="174" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="400" text-anchor="start" fill="#1f2937">1</text>
  <text x="720" y="174" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="400" text-anchor="start" fill="#1f2937">par 11 ⇒ nada</text>
  <text x="470" y="196" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="400" text-anchor="start" fill="#1f2937">3</text>
  <text x="530" y="196" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="400" text-anchor="start" fill="#1f2937">1110</text>
  <text x="600" y="196" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="400" text-anchor="start" fill="#1f2937">0010</text>
  <text x="665" y="196" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="400" text-anchor="start" fill="#1f2937">0</text>
  <text x="720" y="196" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="400" text-anchor="start" fill="#1f2937">par 01 ⇒ A + M</text>
  <text x="470" y="218" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="400" text-anchor="start" fill="#1f2937">4</text>
  <text x="530" y="218" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="400" text-anchor="start" fill="#1f2937">1111</text>
  <text x="600" y="218" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="400" text-anchor="start" fill="#1f2937">0001</text>
  <text x="665" y="218" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="400" text-anchor="start" fill="#1f2937">0</text>
  <text x="720" y="218" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="400" text-anchor="start" fill="#1f2937">par 00 ⇒ nada</text>
  <rect x="460" y="238" width="440" height="32" rx="4" fill="#dcfce7" stroke="#1f2937" stroke-width="1.3"/>
  <text x="470" y="260" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="700" text-anchor="start" fill="#0f766e">A:Q = 1111 0001 = −15 en complemento a 2  ✓</text>
  <rect x="24" y="292" width="872" height="100" rx="6" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="40" y="314" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#1f2937">Ventaja: no hay que separar signos ni tomar valores absolutos; se opera directamente en complemento a 2 y el desplazamiento es aritmético.</text>
  <text x="40" y="336" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">Cuándo suma y cuándo no: sólo actúa en los cambios de bit (01 y 10). Una tira de unos se resuelve con UNA suma o UNA resta en vez de varias.</text>
  <text x="40" y="356" font-family="Consolas, 'Courier New', monospace" font-size="9.6" font-weight="400" text-anchor="start" fill="#7c2d12">M = 1011 = −5 · −M = 0101 (se obtiene invirtiendo y sumando 1) · el resultado se lee con signo en A:Q.</text>
  <text x="40" y="378" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">Es el algoritmo que se pregunta con traza: hay que mostrar en cada fila el par, la acción, A, Q y Q−1.</text>
</svg>
