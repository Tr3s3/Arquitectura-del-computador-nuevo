<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="26" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1f2937">Buses: interno (dentro del chip) y externo (del sistema), con sus tres grupos de líneas</text>
  <rect x="40" y="60" width="210" height="190" rx="6" ry="6" fill="#dbeafe" stroke="#1f2937" stroke-width="1.7"/>
  <text x="56" y="84" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#1f2937">CPU</text>
  <text x="60" y="104" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">registros · ALU · UC</text>
  <rect x="80" y="120" width="130" height="40" rx="6" ry="6" fill="#e0e7ff" stroke="#1f2937" stroke-width="1.7"/>
  <text x="145.0" y="137.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">bus interno</text>
  <text x="145.0" y="154.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">muy corto, muy ancho</text>
  <rect x="80" y="180" width="130" height="44" rx="6" ry="6" fill="#dcfce7" stroke="#1f2937" stroke-width="1.7"/>
  <text x="145.0" y="206.55" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">caché L1/L2</text>
  <rect x="330" y="60" width="250" height="190" rx="6" ry="6" fill="#fef3c7" stroke="#1f2937" stroke-width="1.7"/>
  <text x="344" y="86" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="700" text-anchor="start" fill="#1f2937">bus del sistema (externo)</text>
  <text x="344" y="116" font-family="Consolas, 'Courier New', monospace" font-size="9.4" font-weight="400" text-anchor="start" fill="#7c2d12">direcciones (un solo sentido)</text>
  <text x="344" y="142" font-family="Consolas, 'Courier New', monospace" font-size="9.4" font-weight="400" text-anchor="start" fill="#7c2d12">datos (bidireccional, n bits)</text>
  <text x="344" y="168" font-family="Consolas, 'Courier New', monospace" font-size="9.4" font-weight="400" text-anchor="start" fill="#7c2d12">control (Read/Write, IRQ…)</text>
  <text x="344" y="202" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#4b5563">arbitraje: quién es dueño del bus</text>
  <text x="344" y="222" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#4b5563">(la CPU, el DMA o un periférico)</text>
  <rect x="650" y="60" width="200" height="84" rx="6" ry="6" fill="#e0e7ff" stroke="#1f2937" stroke-width="1.7"/>
  <text x="750.0" y="99.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">MEMORIA</text>
  <text x="750.0" y="116.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">DRAM</text>
  <rect x="650" y="166" width="200" height="84" rx="6" ry="6" fill="#e0e7ff" stroke="#1f2937" stroke-width="1.7"/>
  <text x="750.0" y="205.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">E/S</text>
  <text x="750.0" y="222.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">disco · red · USB</text>
  <line x1="290" y1="155" x2="330" y2="155" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="330" y1="155" x2="321.7780908812166" y2="151.3393702123178" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="330" y1="155" x2="321.7780908812166" y2="158.6606297876822" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="570" y1="100" x2="650" y2="100" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="650" y1="100" x2="641.7780908812166" y2="96.3393702123178" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="650" y1="100" x2="641.7780908812166" y2="103.6606297876822" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="570" y1="200" x2="650" y2="200" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="650" y1="200" x2="641.7780908812166" y2="196.3393702123178" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="650" y1="200" x2="641.7780908812166" y2="203.6606297876822" stroke="#1f2937" stroke-width="1.6"/>
  <rect x="40" y="270" width="820" height="112" rx="6" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="56" y="292" font-family="Consolas, 'Courier New', monospace" font-size="10.6" font-weight="600" text-anchor="start" fill="#1f2937">Ancho de banda del bus = (bits del bus de datos / 8) × frecuencia de transferencia</text>
  <text x="56" y="314" font-family="Consolas, 'Courier New', monospace" font-size="10.2" font-weight="400" text-anchor="start" fill="#7c2d12">Ejemplo: 64 bits a 200 MHz = 8 B × 200·10⁶ = 1,6 GB/s  ⇒  transferir 1 MB tarda 1 MB / 1,6 GB/s ≈ 0,62 ms</text>
  <text x="56" y="340" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="400" text-anchor="start" fill="#4b5563">En la BLUE el bus es ÚNICO: memoria, CPU y periféricos comparten un solo camino ⇒ todo va de a una operación.</text>
  <text x="56" y="360" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="400" text-anchor="start" fill="#4b5563">Jerarquía real: bus interno (registros) → bus del sistema → bus de E/S (PCIe, USB, SATA).</text>
</svg>
