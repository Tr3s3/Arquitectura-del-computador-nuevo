<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="26" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1f2937">Los siete modos de direccionamiento: cómo se construye la dirección efectiva (EA)</text>
  <rect x="20" y="44" width="760" height="56" rx="6" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="32" y="68" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#1f2937">1. Inmediato</text>
  <text x="250" y="68" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="600" text-anchor="start" fill="#0f766e">OP  dato</text>
  <text x="32" y="88" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#374151">EA = —   el operando viaja dentro de la instrucción</text>
  <text x="585" y="68" font-family="Consolas, 'Courier New', monospace" font-size="10.5" font-weight="400" text-anchor="start" fill="#b91c1c">0 accesos</text>
  <text x="585" y="88" font-family="Consolas, 'Courier New', monospace" font-size="10.5" font-weight="400" text-anchor="start" fill="#7c2d12">LDI 5</text>
  <rect x="20" y="110" width="760" height="56" rx="6" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="32" y="134" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#1f2937">2. Directo / absoluto</text>
  <text x="250" y="134" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="600" text-anchor="start" fill="#0f766e">OP  D</text>
  <text x="32" y="154" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#374151">EA = D</text>
  <text x="585" y="134" font-family="Consolas, 'Courier New', monospace" font-size="10.5" font-weight="400" text-anchor="start" fill="#b91c1c">1 acceso</text>
  <text x="585" y="154" font-family="Consolas, 'Courier New', monospace" font-size="10.5" font-weight="400" text-anchor="start" fill="#7c2d12">LDA 25h</text>
  <rect x="20" y="176" width="760" height="56" rx="6" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="32" y="200" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#1f2937">3. Indirecto</text>
  <text x="250" y="200" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="600" text-anchor="start" fill="#0f766e">OP  D</text>
  <text x="32" y="220" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#374151">EA = M[D]   en la celda hay una dirección</text>
  <text x="585" y="200" font-family="Consolas, 'Courier New', monospace" font-size="10.5" font-weight="400" text-anchor="start" fill="#b91c1c">2 accesos</text>
  <text x="585" y="220" font-family="Consolas, 'Courier New', monospace" font-size="10.5" font-weight="400" text-anchor="start" fill="#7c2d12">LDA @25h</text>
  <rect x="20" y="242" width="760" height="56" rx="6" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="32" y="266" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#1f2937">4. De registro</text>
  <text x="250" y="266" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="600" text-anchor="start" fill="#0f766e">OP  R</text>
  <text x="32" y="286" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#374151">EA = R   el operando está en un registro</text>
  <text x="585" y="266" font-family="Consolas, 'Courier New', monospace" font-size="10.5" font-weight="400" text-anchor="start" fill="#b91c1c">0 accesos</text>
  <text x="585" y="286" font-family="Consolas, 'Courier New', monospace" font-size="10.5" font-weight="400" text-anchor="start" fill="#7c2d12">ADD RIF</text>
  <rect x="20" y="308" width="760" height="56" rx="6" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="32" y="332" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#1f2937">5. Registro indirecto</text>
  <text x="250" y="332" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="600" text-anchor="start" fill="#0f766e">OP  R</text>
  <text x="32" y="352" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#374151">EA = R   el registro guarda la dirección</text>
  <text x="585" y="332" font-family="Consolas, 'Courier New', monospace" font-size="10.5" font-weight="400" text-anchor="start" fill="#b91c1c">1 acceso</text>
  <text x="585" y="352" font-family="Consolas, 'Courier New', monospace" font-size="10.5" font-weight="400" text-anchor="start" fill="#7c2d12">LDA (RIF)</text>
  <rect x="20" y="374" width="760" height="56" rx="6" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="32" y="398" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#1f2937">6. Desplazamiento / indexado</text>
  <text x="250" y="398" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="600" text-anchor="start" fill="#0f766e">OP  D + X</text>
  <text x="32" y="418" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#374151">EA = D + X   con X = RIF o RID</text>
  <text x="585" y="398" font-family="Consolas, 'Courier New', monospace" font-size="10.5" font-weight="400" text-anchor="start" fill="#b91c1c">1 acceso</text>
  <text x="585" y="418" font-family="Consolas, 'Courier New', monospace" font-size="10.5" font-weight="400" text-anchor="start" fill="#7c2d12">LDA 25h,RIF</text>
  <rect x="20" y="440" width="760" height="56" rx="6" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="32" y="464" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#1f2937">7. De pila (stack)</text>
  <text x="250" y="464" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="600" text-anchor="start" fill="#0f766e">OP</text>
  <text x="32" y="484" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#374151">el operando está en el tope de la pila (LIFO)</text>
  <text x="585" y="464" font-family="Consolas, 'Courier New', monospace" font-size="10.5" font-weight="400" text-anchor="start" fill="#b91c1c">1 acceso</text>
  <text x="585" y="484" font-family="Consolas, 'Courier New', monospace" font-size="10.5" font-weight="400" text-anchor="start" fill="#7c2d12">PUSH / POP</text>
  <text x="20" y="528" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#4b5563">EA (effective address) = dirección final que se pone en el MAR para ir a memoria.</text>
  <text x="20" y="543" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#4b5563">Indexado = directo + un sumador de direcciones: la dirección de la instrucción se suma al registro</text>
  <text x="20" y="558" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#4b5563">índice en el momento del acceso ⇒ permite recorrer arreglos y tablas con un mismo código.</text>
  <text x="20" y="573" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#4b5563">Regla para distinguirlos: contar los accesos a memoria que hacen falta para tener el dato.</text>
</svg>
