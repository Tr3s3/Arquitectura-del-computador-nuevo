<svg xmlns="http://www.w3.org/2000/svg" width="920" height="410" viewBox="0 0 920 410">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="26" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1f2937">Flip-flop D y flip-flop T: ecuación, tabla y formas de onda</text>
  <rect x="24" y="42" width="424" height="300" rx="6" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="40" y="66" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#1d4ed8">Flip-flop D (dato)</text>
  <rect x="56" y="84" width="120" height="80" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.8"/>
  <text x="116" y="106" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2937">D</text>
  <line x1="40" y1="130" x2="56" y2="130" stroke="#1f2937" stroke-width="1.6"/>
  <text x="44" y="124" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" text-anchor="start" fill="#1f2937">D</text>
  <path d="M56,140 l10,6 l-10,6" fill="none" stroke="#1f2937" stroke-width="1.3"/>
  <text x="46" y="160" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="700" text-anchor="start" fill="#1f2937">C</text>
  <line x1="176" y1="112" x2="196" y2="112" stroke="#1f2937" stroke-width="1.6"/>
  <text x="200" y="116" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#1f2937">Q</text>
  <line x1="176" y1="140" x2="196" y2="140" stroke="#1f2937" stroke-width="1.6"/>
  <text x="200" y="144" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#1f2937">Q'</text>
  <text x="40" y="192" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="700" text-anchor="start" fill="#0f766e">Q(t+1) = D</text>
  <text x="40" y="216" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="700" text-anchor="start" fill="#1f2937">D C | Q(t+1)</text>
  <text x="40" y="234" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="400" text-anchor="start" fill="#1f2937">0 ↑ |   0</text>
  <text x="40" y="250" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="400" text-anchor="start" fill="#1f2937">1 ↑ |   1</text>
  <text x="40" y="266" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="400" text-anchor="start" fill="#1f2937">x 0 |   Q (mantiene)</text>
  <text x="216" y="216" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">Es el único que NO tiene</text>
  <text x="216" y="232" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">estado prohibido: la salida</text>
  <text x="216" y="248" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">copia la entrada en el flanco.</text>
  <text x="40" y="300" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">Aplicaciones: registro, memoria, D = J = K'… es el biestable de la cátedra.</text>
  <rect x="470" y="42" width="426" height="300" rx="6" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="486" y="66" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#1d4ed8">Flip-flop T (toggle)</text>
  <rect x="502" y="84" width="120" height="80" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.8"/>
  <text x="562" y="106" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2937">T</text>
  <line x1="486" y1="130" x2="502" y2="130" stroke="#1f2937" stroke-width="1.6"/>
  <text x="490" y="124" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" text-anchor="start" fill="#1f2937">T</text>
  <path d="M502,140 l10,6 l-10,6" fill="none" stroke="#1f2937" stroke-width="1.3"/>
  <text x="492" y="160" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="700" text-anchor="start" fill="#1f2937">C</text>
  <line x1="622" y1="112" x2="642" y2="112" stroke="#1f2937" stroke-width="1.6"/>
  <text x="646" y="116" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#1f2937">Q</text>
  <line x1="622" y1="140" x2="642" y2="140" stroke="#1f2937" stroke-width="1.6"/>
  <text x="646" y="144" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#1f2937">Q'</text>
  <text x="486" y="192" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="700" text-anchor="start" fill="#0f766e">Q(t+1) = T ⊕ Q</text>
  <text x="486" y="216" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="700" text-anchor="start" fill="#1f2937">T C | Q(t+1)</text>
  <text x="486" y="234" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="400" text-anchor="start" fill="#1f2937">0 ↑ | Q (mantiene)</text>
  <text x="486" y="250" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="400" text-anchor="start" fill="#1f2937">1 ↑ | Q' (conmuta)</text>
  <text x="660" y="216" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">Con T = 1 siempre:</text>
  <text x="660" y="232" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">divide la frecuencia</text>
  <text x="660" y="248" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">del reloj a la mitad.</text>
  <text x="486" y="300" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">Aplicaciones: contadores (T = 1 en la primera etapa) y divisores de frecuencia.</text>
  <text x="24" y="372" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="400" text-anchor="start" fill="#1f2937">Los dos son disparados por flanco: Q cambia sólo en el instante del pulso de reloj, no mientras el reloj está en 1.</text>
  <text x="24" y="392" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="400" text-anchor="start" fill="#4b5563">D = 'dato' (se usa para almacenar) · T = 'toggle' (se usa para contar). Con D se arma un registro; con T, un contador.</text>
</svg>
