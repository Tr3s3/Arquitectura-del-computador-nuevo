<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="26" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1f2937">La ALU: entradas, selección de operación, salidas G/P y flags</text>
  <text x="24" y="52" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.8" font-weight="700" text-anchor="start" fill="#1f2937">Bloque combinacional: la operación la elige la Unidad de Control</text>
  <rect x="300" y="80" width="300" height="150" rx="6" fill="#dbeafe" stroke="#1f2937" stroke-width="2"/>
  <text x="450" y="128" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#1f2937">ALU</text>
  <text x="450" y="156" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="middle" fill="#4b5563">suma · resta · AND · OR · XOR</text>
  <text x="450" y="174" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="middle" fill="#4b5563">desplazamientos · complemento</text>
  <text x="450" y="202" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="400" text-anchor="middle" fill="#b91c1c">3-5 bits de selección</text>
  <line x1="180" y1="110" x2="300" y2="110" stroke="#1f2937" stroke-width="1.6"/>
  <text x="176" y="114" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" text-anchor="end" fill="#1f2937">A (n bits)</text>
  <line x1="180" y1="170" x2="300" y2="170" stroke="#1f2937" stroke-width="1.6"/>
  <text x="176" y="174" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" text-anchor="end" fill="#1f2937">B (n bits)</text>
  <line x1="180" y1="226" x2="300" y2="226" stroke="#1f2937" stroke-width="1.6"/>
  <text x="176" y="230" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="700" text-anchor="end" fill="#b91c1c">sel (de la UC)</text>
  <line x1="600" y1="120" x2="700" y2="120" stroke="#1f2937" stroke-width="1.6"/>
  <text x="704" y="124" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" text-anchor="start" fill="#1d4ed8">resultado F</text>
  <line x1="600" y1="200" x2="700" y2="200" stroke="#1f2937" stroke-width="1.6"/>
  <text x="704" y="204" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="700" text-anchor="start" fill="#0f766e">Cout / G / P</text>
  <text x="24" y="262" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#1f2937">Cómo se controla</text>
  <text x="40" y="286" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#1f2937">La UC manda un código de operación (3-5 bits) a un decodificador interno.</text>
  <text x="40" y="306" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#1f2937">Con multiplexores se elige qué resultado sale: cada operación es un bloque y el MUX selecciona uno.</text>
  <text x="40" y="326" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#4b5563">El mismo bloque de suma sirve para restar (B' + 1) y para comparar (restando y mirando Z).</text>
  <rect x="600" y="262" width="296" height="106" rx="6" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="616" y="284" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="700" text-anchor="start" fill="#1f2937">Señales de la cátedra</text>
  <text x="616" y="304" font-family="Consolas, 'Courier New', monospace" font-size="9.4" font-weight="400" text-anchor="start" fill="#1f2937">· G = A·B  (genera acarreo)</text>
  <text x="616" y="322" font-family="Consolas, 'Courier New', monospace" font-size="9.4" font-weight="400" text-anchor="start" fill="#1f2937">· P = A⊕B  (propaga acarreo)</text>
  <text x="616" y="340" font-family="Consolas, 'Courier New', monospace" font-size="9.4" font-weight="400" text-anchor="start" fill="#1f2937">· F: resultado   ·   Cout: acarreo</text>
  <text x="616" y="358" font-family="Consolas, 'Courier New', monospace" font-size="9.4" font-weight="400" text-anchor="start" fill="#1f2937">· flags: Z, C, V, N (ver 3.2.2)</text>
  <text x="24" y="384" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="400" text-anchor="start" fill="#1f2937">La ALU es combinacional (sin reloj): el resultado está apenas cambian las entradas; lo que lo 'guarda' es el registro de destino.</text>
</svg>
