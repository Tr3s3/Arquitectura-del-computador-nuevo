<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="26" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1f2937">La ROM de control del 8088: 504 palabras de 21 bits</text>
  <text x="24" y="52" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="700" text-anchor="start" fill="#0f766e">504 microinstrucciones × 21 bits = 10 584 bits de microcódigo</text>
  <rect x="60" y="86" width="230" height="150" rx="5" fill="#dbeafe" stroke="#1f2937" stroke-width="1.6"/>
  <text x="175" y="112" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="700" text-anchor="middle" fill="#1f2937">ROM DE CONTROL</text>
  <text x="175" y="134" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="400" text-anchor="middle" fill="#1f2937">504 × 21</text>
  <text x="175" y="158" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.8" font-weight="400" text-anchor="middle" fill="#4b5563">cada palabra = 1 microinstrucción</text>
  <text x="175" y="180" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.8" font-weight="400" text-anchor="middle" fill="#7c2d12">9 bits de dirección (2⁹ = 512 ≥ 504)</text>
  <text x="175" y="202" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.8" font-weight="400" text-anchor="middle" fill="#7c2d12">21 bits de salida</text>
  <line x1="290" y1="120" x2="350" y2="120" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="350" y1="120" x2="341.7780908812166" y2="116.3393702123178" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="350" y1="120" x2="341.7780908812166" y2="123.6606297876822" stroke="#1f2937" stroke-width="1.6"/>
  <text x="296" y="112" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.6" font-weight="400" text-anchor="start" fill="#4b5563">microdirección</text>
  <rect x="350" y="96" width="150" height="56" rx="6" ry="6" fill="#dcfce7" stroke="#1f2937" stroke-width="1.7"/>
  <text x="425.0" y="121.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">microPC</text>
  <text x="425.0" y="138.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">9 bits</text>
  <line x1="500" y1="124" x2="560" y2="124" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="560" y1="124" x2="551.7780908812166" y2="120.3393702123178" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="560" y1="124" x2="551.7780908812166" y2="127.6606297876822" stroke="#1f2937" stroke-width="1.6"/>
  <rect x="560" y="96" width="170" height="56" rx="6" ry="6" fill="#fef3c7" stroke="#1f2937" stroke-width="1.7"/>
  <text x="645.0" y="127.29" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="600" text-anchor="middle" fill="#1f2937">registro de microinstrucción</text>
  <line x1="690" y1="152" x2="780" y2="190" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="780" y1="190" x2="773.8494524557219" y2="183.4295536753144" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="780" y1="190" x2="771.0016872049912" y2="190.17426084809776" stroke="#1f2937" stroke-width="1.6"/>
  <text x="700" y="210" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.8" font-weight="400" text-anchor="start" fill="#4b5563">señales de control a toda la máquina</text>
  <rect x="24" y="252" width="872" height="112" rx="6" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="40" y="274" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="700" text-anchor="start" fill="#1f2937">Qué se pregunta de este dato</text>
  <text x="40" y="296" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#1f2937">1 · Cuántas microinstrucciones entran: 2^bits_de_dirección ≥ 504 ⇒ 9 bits (512).</text>
  <text x="40" y="316" font-family="Consolas, 'Courier New', monospace" font-size="9.6" font-weight="400" text-anchor="start" fill="#7c2d12">2 · Tamaño total del microcódigo: 504 × 21 = 10 584 bits ≈ 1,3 KB.</text>
  <text x="40" y="336" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">3 · Para qué sirven los 21 bits: señales de control internas + control del secuenciamiento (condición, salto, próxima dirección).</text>
  <text x="40" y="356" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#4b5563">Es el ejemplo real que cierra la unidad: una máquina CISC resuelve sus instrucciones complejas leyendo microcódigo, paso por paso.</text>
  <text x="24" y="388" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#4b5563">Comparación: en la BLUE cada instrucción son 8 o 16 pulsos fijos de hardware; en el 8088 cada instrucción es un microprograma de varias microinstrucciones.</text>
</svg>
