  <text x="500" y="172" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#374151">1. La CPU programa: dirección, cantidad, sentido</text>
  <text x="500" y="192" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#374151">2. El DMA pide el bus (Bus Request) y lo obtiene (Bus Grant)</text>
  <text x="500" y="212" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#374151">3. Transfiere palabra por palabra o en ráfaga</text>
  <text x="500" y="232" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#374151">4. Al terminar, interrumpe: 'bloque listo'</text>
  <text x="40" y="344" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.6" font-weight="700" text-anchor="start" fill="#1f2937">ROBO DE CICLO (cycle stealing): la CPU y el DMA se turnan el bus</text>
