  <text x="357" y="118.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="600" text-anchor="end" fill="#1f2937">C'</text>
  <line x1="444" y1="100.0" x2="462" y2="100.0" stroke="#1f2937" stroke-width="1.6"/>
