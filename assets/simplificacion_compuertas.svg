  <text x="20" y="26" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1f2937">Simplificar es sacar compuertas: la misma función con menos hardware</text>
  <text x="24" y="52" font-family="Consolas, 'Courier New', monospace" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2937">Sin simplificar:  Y = A'·B·C + A·B·C + A·B·C'</text>
