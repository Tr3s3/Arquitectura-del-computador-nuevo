  <line x1="78" y1="264.0" x2="100" y2="264.0" stroke="#1f2937" stroke-width="1.6"/>
  <text x="73" y="268.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" text-anchor="end" fill="#1f2937">C</text>
  <line x1="164" y1="256.0" x2="186" y2="256.0" stroke="#1f2937" stroke-width="1.6"/>
  <text x="191" y="260.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#1d4ed8">B·C</text>
  <path d="M100,306 L140.0,306 A24.0,24.0 0 0 1 140.0,354 L100,354 Z" fill="#ffffff" stroke="#1f2937" stroke-width="1.7"/>
  <line x1="78" y1="322.0" x2="100" y2="322.0" stroke="#1f2937" stroke-width="1.6"/>
  <text x="73" y="326.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" text-anchor="end" fill="#1f2937">A</text>
  <line x1="78" y1="338.0" x2="100" y2="338.0" stroke="#1f2937" stroke-width="1.6"/>
  <text x="73" y="342.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" text-anchor="end" fill="#1f2937">B</text>
  <line x1="164" y1="330.0" x2="186" y2="330.0" stroke="#1f2937" stroke-width="1.6"/>
  <text x="191" y="334.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#1d4ed8">A·B</text>
  <path d="M320,254 C339.24,254 374.76,260.4 394,286.0 C374.76,311.6 339.24,318 320,318 C333.32,296.24 333.32,275.76 320,254 Z" fill="#ffffff" stroke="#1f2937" stroke-width="1.7"/>
  <line x1="306" y1="275.3333333333333" x2="328" y2="275.3333333333333" stroke="#1f2937" stroke-width="1.6"/>
  <text x="301" y="279.3333333333333" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" text-anchor="end" fill="#1f2937"></text>
  <line x1="306" y1="296.6666666666667" x2="328" y2="296.6666666666667" stroke="#1f2937" stroke-width="1.6"/>
  <text x="301" y="300.6666666666667" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" text-anchor="end" fill="#1f2937"></text>
  <line x1="394" y1="286.0" x2="416" y2="286.0" stroke="#1f2937" stroke-width="1.6"/>
  <text x="421" y="290.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#1d4ed8">Y</text>
  <text x="460" y="240" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="700" text-anchor="start" fill="#0f766e">Y = B·C + A·B</text>
  <text x="460" y="264" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#15803d">3 compuertas de 2 entradas ⇒ 1 circuito integrado</text>
  <text x="460" y="288" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#4b5563">La función es la MISMA: la tabla de verdad no cambia.</text>
  <text x="460" y="312" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">Chequeo: A=1,B=1 ⇒ Y=1 · A=0,B=1,C=1 ⇒ Y=1 · A=1,B=0 ⇒ Y=0.</text>
  <text x="24" y="384" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="400" text-anchor="start" fill="#1f2937">Simplificar no cambia qué hace el circuito: cambia su costo (compuertas, retardos, consumo y tamaño del chip).</text>
  <text x="24" y="406" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="400" text-anchor="start" fill="#4b5563">El Karnaugh es el método sistemático para llegar a esta versión; la simplificación analítica usa postulados y DeMorgan.</text>
</svg>
