  <text x="680" y="104" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="400" text-anchor="start" fill="#7c2d12">p1 = A'BC   p2 = ABC   p3 = ABC'</text>
  <text x="680" y="128" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#b91c1c">3 AND de 3 entradas + 1 OR de 3 + 2 NOT</text>
  <text x="680" y="146" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="700" text-anchor="start" fill="#b91c1c">⇒ 14 compuertas</text>
  <text x="24" y="200" font-family="Consolas, 'Courier New', monospace" font-size="11.5" font-weight="700" text-anchor="start" fill="#1f2937">Simplificada:  Y = B·C + A·B</text>
  <path d="M100,232 L140.0,232 A24.0,24.0 0 0 1 140.0,280 L100,280 Z" fill="#ffffff" stroke="#1f2937" stroke-width="1.7"/>
