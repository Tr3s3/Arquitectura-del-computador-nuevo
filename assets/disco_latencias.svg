<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="26" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1f2937">Disco rígido: de dónde sale la latencia de milisegundos</text>
  <text x="40" y="56" font-family="Consolas, 'Courier New', monospace" font-size="10.8" font-weight="700" text-anchor="start" fill="#1f2937">Tiempo de acceso = búsqueda (seek) + latencia rotacional + transferencia</text>
  <rect x="40" y="76" width="250" height="56" rx="4" fill="#dbeafe" stroke="#1f2937" stroke-width="1.4"/>
  <text x="165.0" y="100" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="700" text-anchor="middle" fill="#1f2937">BÚSQUEDA</text>
  <text x="165.0" y="118" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.8" font-weight="400" text-anchor="middle" fill="#4b5563">mover el cabezal</text>
  <rect x="290" y="76" width="180" height="56" rx="4" fill="#fef3c7" stroke="#1f2937" stroke-width="1.4"/>
  <text x="380.0" y="100" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="700" text-anchor="middle" fill="#1f2937">ROTACIONAL</text>
  <text x="380.0" y="118" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.8" font-weight="400" text-anchor="middle" fill="#4b5563">esperar el sector</text>
  <rect x="470" y="76" width="150" height="56" rx="4" fill="#dcfce7" stroke="#1f2937" stroke-width="1.4"/>
  <text x="545.0" y="100" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="700" text-anchor="middle" fill="#1f2937">TRANSFERENCIA</text>
  <text x="545.0" y="118" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.8" font-weight="400" text-anchor="middle" fill="#4b5563">leer el dato</text>
  <text x="40" y="156" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#374151">HDD típico: 7200 rpm · seek 9 ms · 100 MB/s</text>
  <rect x="40" y="176" width="860" height="76" rx="6" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="56" y="198" font-family="Consolas, 'Courier New', monospace" font-size="9.8" font-weight="400" text-anchor="start" fill="#1f2937">7200 rpm ⇒ 7200/60 = 120 vueltas/s ⇒ una vuelta = 8,33 ms ⇒ rotacional promedio = 8,33/2 ≈ 4,17 ms</text>
  <text x="56" y="220" font-family="Consolas, 'Courier New', monospace" font-size="9.8" font-weight="400" text-anchor="start" fill="#1f2937">Leer 4 KB a 100 MB/s = 4096 / 100·10⁶ ≈ 0,04 ms</text>
  <text x="56" y="242" font-family="Consolas, 'Courier New', monospace" font-size="9.8" font-weight="400" text-anchor="start" fill="#7c2d12">Total ≈ 9 + 4,17 + 0,04 ≈ 13,2 ms por bloque ⇒ ≈ 76 operaciones por segundo (IOPS).</text>
  <text x="40" y="286" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="400" text-anchor="start" fill="#15803d">Un SSD no tiene cabezal ni plato: ≈ 0,1 ms por acceso ⇒ ≈ 10 000 IOPS.</text>
  <text x="40" y="308" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="400" text-anchor="start" fill="#15803d">Con 4 KB por acceso: HDD ≈ 0,3 MB/s 'al azar' contra ≈ 40 MB/s del SSD.</text>
  <text x="40" y="336" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.1" font-weight="400" text-anchor="start" fill="#4b5563">Por eso el disco es el ÚLTIMO nivel de la jerarquía y por eso existen la caché de disco y la paginación.</text>
  <text x="40" y="358" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.1" font-weight="400" text-anchor="start" fill="#4b5563">Cinta: secuencial, minutos para llegar a un dato ⇒ sólo para respaldo, nunca para acceso aleatorio.</text>
</svg>
