<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="26" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1f2937">La lógica de la interrupción: IRQ · SI · CP8</text>
  <text x="24" y="52" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.8" font-weight="700" text-anchor="start" fill="#1f2937">El periférico pide, la CPU decide y sólo acepta al final de la instrucción</text>
  <rect x="60" y="90" width="120" height="32" rx="4" fill="#dbeafe" stroke="#1f2937" stroke-width="1.3"/>
  <text x="120" y="111" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="middle" fill="#1f2937">bandera 0</text>
  <line x1="180" y1="106" x2="250" y2="106" stroke="#1f2937" stroke-width="1.6"/>
  <rect x="60" y="134" width="120" height="32" rx="4" fill="#dbeafe" stroke="#1f2937" stroke-width="1.3"/>
  <text x="120" y="155" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="middle" fill="#1f2937">bandera 1</text>
  <line x1="180" y1="150" x2="250" y2="150" stroke="#1f2937" stroke-width="1.6"/>
  <rect x="60" y="178" width="120" height="32" rx="4" fill="#dbeafe" stroke="#1f2937" stroke-width="1.3"/>
  <text x="120" y="199" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="middle" fill="#1f2937">bandera 2</text>
  <line x1="180" y1="194" x2="250" y2="194" stroke="#1f2937" stroke-width="1.6"/>
  <path d="M250,100 C268.2,100 301.8,107.0 320,135.0 C301.8,163.0 268.2,170 250,170 C262.6,146.2 262.6,123.8 250,100 Z" fill="#ffffff" stroke="#1f2937" stroke-width="1.7"/>
  <line x1="232" y1="117.5" x2="258" y2="117.5" stroke="#1f2937" stroke-width="1.6"/>
  <text x="227" y="121.5" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="600" text-anchor="end" fill="#1f2937">b0</text>
  <line x1="232" y1="135.0" x2="258" y2="135.0" stroke="#1f2937" stroke-width="1.6"/>
  <text x="227" y="139.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="600" text-anchor="end" fill="#1f2937">b1</text>
  <line x1="232" y1="152.5" x2="258" y2="152.5" stroke="#1f2937" stroke-width="1.6"/>
  <text x="227" y="156.5" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="600" text-anchor="end" fill="#1f2937">b2</text>
  <line x1="320" y1="135.0" x2="346" y2="135.0" stroke="#1f2937" stroke-width="1.6"/>
  <text x="351" y="139.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="700" text-anchor="start" fill="#1d4ed8">IRQ</text>
  <path d="M420,108 L465.0,108 A35.0,35.0 0 0 1 465.0,178 L420,178 Z" fill="#ffffff" stroke="#1f2937" stroke-width="1.7"/>
  <line x1="390" y1="125.5" x2="420" y2="125.5" stroke="#1f2937" stroke-width="1.6"/>
  <text x="385" y="129.5" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="600" text-anchor="end" fill="#1f2937">IRQ</text>
  <line x1="390" y1="143.0" x2="420" y2="143.0" stroke="#1f2937" stroke-width="1.6"/>
  <text x="385" y="147.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="600" text-anchor="end" fill="#1f2937">SI</text>
  <line x1="390" y1="160.5" x2="420" y2="160.5" stroke="#1f2937" stroke-width="1.6"/>
  <text x="385" y="164.5" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="600" text-anchor="end" fill="#1f2937">CP8</text>
  <line x1="500" y1="143.0" x2="530" y2="143.0" stroke="#1f2937" stroke-width="1.6"/>
  <text x="535" y="147.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="700" text-anchor="start" fill="#1d4ed8">aceptar</text>
  <text x="60" y="228" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#4b5563">IRQ = OR de todas las banderas: un solo cable hacia la CPU.</text>
  <text x="60" y="246" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#4b5563">Se acepta sólo si SI = 1 (habilitado) y CP8 = 1 (fin de la instrucción).</text>
  <rect x="600" y="90" width="296" height="120" rx="6" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="616" y="112" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="700" text-anchor="start" fill="#1f2937">Si falta una, no pasa nada</text>
  <text x="616" y="134" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" text-anchor="start" fill="#1f2937">IRQ = 0 ⇒ no hay pedido.</text>
  <text x="616" y="152" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" text-anchor="start" fill="#4b5563">SI = 0 ⇒ el pedido queda PENDIENTE</text>
  <text x="616" y="168" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" text-anchor="start" fill="#4b5563">  (máscara: se posterga, no se borra).</text>
  <text x="616" y="186" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" text-anchor="start" fill="#b91c1c">CP8 = 0 ⇒ hay que esperar al final.</text>
  <text x="616" y="202" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" text-anchor="start" fill="#b91c1c">  Nunca se corta una instrucción.</text>
  <text x="24" y="268" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.8" font-weight="700" text-anchor="start" fill="#1f2937">La secuencia completa (los 8 pulsos del ciclo de interrupción)</text>
  <rect x="40" y="282" width="60" height="26" rx="3" fill="#dbeafe" stroke="#1f2937" stroke-width="1.2"/>
  <text x="70" y="300" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.8" font-weight="700" text-anchor="middle" fill="#1d4ed8">CP1</text>
  <text x="108" y="300" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="700" text-anchor="start" fill="#1f2937">SI ← 0</text>
  <text x="230" y="300" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.6" font-weight="400" text-anchor="start" fill="#4b5563">no anidar sin control</text>
  <rect x="40" y="312" width="60" height="26" rx="3" fill="#dbeafe" stroke="#1f2937" stroke-width="1.2"/>
  <text x="70" y="330" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.8" font-weight="700" text-anchor="middle" fill="#1d4ed8">CP2</text>
  <text x="108" y="330" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="700" text-anchor="start" fill="#1f2937">PC al MBR</text>
  <text x="230" y="330" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.6" font-weight="400" text-anchor="start" fill="#4b5563">se guarda la vuelta</text>
  <rect x="40" y="342" width="60" height="26" rx="3" fill="#dbeafe" stroke="#1f2937" stroke-width="1.2"/>
  <text x="70" y="360" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.8" font-weight="700" text-anchor="middle" fill="#1d4ed8">CP3</text>
  <text x="108" y="360" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="700" text-anchor="start" fill="#1f2937">M[0] ← PC</text>
  <text x="230" y="360" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.6" font-weight="400" text-anchor="start" fill="#4b5563">posición 0 = dirección de retorno</text>
  <rect x="480" y="282" width="60" height="26" rx="3" fill="#dbeafe" stroke="#1f2937" stroke-width="1.2"/>
  <text x="510" y="300" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.8" font-weight="700" text-anchor="middle" fill="#1d4ed8">CP4</text>
  <text x="548" y="300" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="700" text-anchor="start" fill="#1f2937">PC ← 1</text>
  <text x="670" y="300" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.6" font-weight="400" text-anchor="start" fill="#4b5563">la rutina empieza en 1</text>
  <rect x="480" y="312" width="60" height="26" rx="3" fill="#dbeafe" stroke="#1f2937" stroke-width="1.2"/>
  <text x="510" y="330" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.8" font-weight="700" text-anchor="middle" fill="#1d4ed8">CP5-CP7</text>
  <text x="548" y="330" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="700" text-anchor="start" fill="#1f2937">—</text>
  <text x="670" y="330" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.6" font-weight="400" text-anchor="start" fill="#4b5563">la rutina ya corre</text>
  <rect x="480" y="342" width="60" height="26" rx="3" fill="#dbeafe" stroke="#1f2937" stroke-width="1.2"/>
  <text x="510" y="360" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.8" font-weight="700" text-anchor="middle" fill="#1d4ed8">CP8</text>
  <text x="548" y="360" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="700" text-anchor="start" fill="#1f2937">I ← 0</text>
  <text x="670" y="360" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.6" font-weight="400" text-anchor="start" fill="#4b5563">termina el reconocimiento</text>
  <text x="24" y="392" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">Con RTI se recupera el PC de la posición 0 y se vuelve a poner SI = 1: el programa no se entera de nada.</text>
</svg>
