<svg xmlns="http://www.w3.org/2000/svg" width="900" height="410" viewBox="0 0 900 410">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="26" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1f2937">von Neumann vs Harvard: una memoria o dos</text>
  <text x="40" y="56" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.8" font-weight="700" text-anchor="start" fill="#1f2937">von NEUMANN: una sola memoria</text>
  <rect x="60" y="70" width="150" height="50" rx="6" ry="6" fill="#dbeafe" stroke="#1f2937" stroke-width="1.7"/>
  <text x="135.0" y="92.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">CPU</text>
  <text x="135.0" y="109.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">UC + ALU + regs</text>
  <rect x="60" y="168" width="150" height="50" rx="6" ry="6" fill="#e0e7ff" stroke="#1f2937" stroke-width="1.7"/>
  <text x="135.0" y="190.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">MEMORIA única</text>
  <text x="135.0" y="207.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">instrucciones + datos</text>
  <line x1="120" y1="120" x2="120" y2="168" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="120" y1="168" x2="123.6606297876822" y2="159.7780908812166" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="120" y1="168" x2="116.3393702123178" y2="159.7780908812166" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="160" y1="168" x2="160" y2="120" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="160" y1="120" x2="156.3393702123178" y2="128.2219091187834" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="160" y1="120" x2="163.6606297876822" y2="128.2219091187834" stroke="#1f2937" stroke-width="1.6"/>
  <text x="180" y="148" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="start" fill="#b91c1c">un solo bus ⇒ se turnan</text>
  <text x="40" y="244" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">Cuello de botella: no puede buscar la instrucción</text>
  <text x="40" y="260" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">y leer el dato al mismo tiempo.</text>
  <text x="40" y="280" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">Ventaja: memoria única, simple y barata.</text>
  <text x="480" y="56" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.8" font-weight="700" text-anchor="start" fill="#1f2937">HARVARD: memoria y bus separados</text>
  <rect x="575" y="70" width="150" height="50" rx="6" ry="6" fill="#dcfce7" stroke="#1f2937" stroke-width="1.7"/>
  <text x="650.0" y="92.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">CPU</text>
  <text x="650.0" y="109.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">UC + ALU + regs</text>
  <rect x="470" y="168" width="150" height="50" rx="6" ry="6" fill="#dbeafe" stroke="#1f2937" stroke-width="1.7"/>
  <text x="545.0" y="190.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">INSTRUCCIONES</text>
  <text x="545.0" y="207.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">su bus</text>
  <rect x="680" y="168" width="150" height="50" rx="6" ry="6" fill="#fef3c7" stroke="#1f2937" stroke-width="1.7"/>
  <text x="755.0" y="190.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">DATOS</text>
  <text x="755.0" y="207.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">su bus</text>
  <line x1="620" y1="120" x2="560" y2="168" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="560" y1="168" x2="568.7070096842285" y2="165.72228571617254" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="560" y1="168" x2="564.1334550856379" y2="160.00534246793435" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="690" y1="120" x2="745" y2="168" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="745" y1="168" x2="741.2124003873378" y2="159.8358044380257" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="745" y1="168" x2="736.398421488468" y2="165.35182192631393" stroke="#1f2937" stroke-width="1.6"/>
  <text x="470" y="244" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#15803d">Puede buscar la instrucción y leer el dato</text>
  <text x="470" y="260" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#15803d">en el MISMO ciclo.</text>
  <text x="470" y="280" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">Costo: dos memorias. Se usa en DSP y en L1.</text>
  <rect x="40" y="300" width="820" height="96" rx="6" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="56" y="322" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="600" text-anchor="start" fill="#1f2937">Híbrido (lo que hay en una PC):</text>
  <text x="56" y="344" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.1" font-weight="400" text-anchor="start" fill="#1f2937">Caché L1 separada (I y D) = Harvard por dentro · memoria principal y L2 unificadas = von Neumann por fuera.</text>
  <text x="56" y="364" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.1" font-weight="400" text-anchor="start" fill="#4b5563">Así se evita el conflicto estructural del pipeline: búsqueda y datos no pelean por el mismo recurso.</text>
  <text x="56" y="384" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.1" font-weight="400" text-anchor="start" fill="#7c2d12">La máquina BLUE es von Neumann pura: un solo bus, un solo camino a la memoria.</text>
</svg>
