  <text x="40" y="152" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="400" text-anchor="start" fill="#4b5563">Cada etapa tiene su propio hardware: la suma C[i] = A[i] + B[i] puede entrar cuando la anterior ya avanzó.</text>
