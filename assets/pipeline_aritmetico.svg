  <text x="60" y="322" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="400" text-anchor="start" fill="#4b5563">El primer resultado sale en el ciclo 4; desde ahí, uno por ciclo ⇒ 4 + (5 − 1) = 8 ciclos para 5 elementos (en serie serían 20).</text>
  <rect x="40" y="356" width="840" height="54" rx="6" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="56" y="378" font-family="Consolas, 'Courier New', monospace" font-size="11" font-weight="600" text-anchor="start" fill="#7c2d12">sin pipeline: k · n     ·     con pipeline: k + (n − 1)     ·     speedup = k·n / (k + n − 1) → k</text>
  <text x="56" y="398" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="400" text-anchor="start" fill="#4b5563">La latencia de UNA operación no baja (sigue siendo 4 ciclos). Lo que sube es el rendimiento: elementos por unidad de tiempo.</text>
