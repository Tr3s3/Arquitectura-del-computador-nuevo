  <text x="700" y="304" font-family="Consolas, 'Courier New', monospace" font-size="9.4" font-weight="400" text-anchor="start" fill="#7c2d12">62 = 0110 0010</text>
  <line x1="20" y1="340" x2="900" y2="340" stroke="#d1d5db" stroke-width="1"/>
  <text x="24" y="358" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" text-anchor="start" fill="#4b5563">Natural: pesos 8-4-2-1 · AIKEN: 2-4-2-1 (el 5 es 1011: 4+0+1) · Exceso 3: al binario puro se le suma 3 (autocomplementario)</text>
  <text x="24" y="374" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" text-anchor="start" fill="#4b5563">BCD empaquetado: un dígito decimal por nible, dos por byte · BCD desempaquetado: un dígito por byte (el otro nible en 0)</text>
  <text x="24" y="396" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" text-anchor="start" fill="#4b5563">Para qué sirve el exceso 3: el complemento a 9 se obtiene invirtiendo los bits, y no tiene la combinación 0000</text>
  <text x="24" y="411" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" text-anchor="start" fill="#4b5563">(un cable roto no parece un 0). Por eso se usa en transmisión.</text>
</svg>
