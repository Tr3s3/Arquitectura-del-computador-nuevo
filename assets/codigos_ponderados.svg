  <text x="700" y="282" font-family="Consolas, 'Courier New', monospace" font-size="9.4" font-weight="400" text-anchor="start" fill="#7c2d12">27 = 0010 0111</text>
  <text x="40" y="304" font-family="Consolas, 'Courier New', monospace" font-size="9.6" font-weight="700" text-anchor="start" fill="#1f2937">9</text>
