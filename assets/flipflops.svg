<svg xmlns="http://www.w3.org/2000/svg" width="820" height="480" viewBox="0 0 820 480">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="26" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1f2937">Biestables: S-R, D, J-K y T (símbolo, tabla de estados y ecuación)</text>
  <rect x="25" y="55" width="145" height="95" rx="6" fill="#f8fafc" stroke="#1f2937" stroke-width="1.8"/>
  <text x="97.5" y="73" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1d4ed8">S-R</text>
  <line x1="170" y1="85" x2="183" y2="85" stroke="#1f2937" stroke-width="1.6"/>
  <text x="187" y="89" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="start" fill="#1f2937">Q</text>
  <line x1="170" y1="118" x2="183" y2="118" stroke="#1f2937" stroke-width="1.6"/>
  <text x="187" y="122" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="600" text-anchor="start" fill="#1f2937">Q'</text>
  <line x1="12" y1="80" x2="25" y2="80" stroke="#1f2937" stroke-width="1.6"/>
  <text x="34" y="84" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="start" fill="#1f2937">S</text>
  <line x1="12" y1="112" x2="25" y2="112" stroke="#1f2937" stroke-width="1.6"/>
  <text x="34" y="116" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="start" fill="#1f2937">R</text>
  <line x1="12" y1="136" x2="37" y2="136" stroke="#1f2937" stroke-width="1.6"/>
  <path d="M37,130 l9,6 l-9,6" fill="none" stroke="#1f2937" stroke-width="1.3"/>
  <text x="49" y="140" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" text-anchor="start" fill="#1f2937">C</text>
  <text x="25" y="178" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" text-anchor="start" fill="#1f2937">S  C  R</text>
  <text x="25" y="197" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#1f2937">0 ↑ 0  →  Q (mantiene)</text>
  <text x="25" y="216" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#1f2937">1 ↑ 0  →  Q = 1  (set)</text>
  <text x="25" y="235" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#1f2937">0 ↑ 1  →  Q = 0  (reset)</text>
  <text x="25" y="254" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#1f2937">1 ↑ 1  →  estado prohibido</text>
  <text x="25" y="288" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="start" fill="#0f766e">Q(t+1) = S + R'·Q</text>
  <rect x="221" y="55" width="145" height="95" rx="6" fill="#f8fafc" stroke="#1f2937" stroke-width="1.8"/>
  <text x="293.5" y="73" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1d4ed8">D</text>
  <line x1="366" y1="85" x2="379" y2="85" stroke="#1f2937" stroke-width="1.6"/>
  <text x="383" y="89" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="start" fill="#1f2937">Q</text>
  <line x1="366" y1="118" x2="379" y2="118" stroke="#1f2937" stroke-width="1.6"/>
  <text x="383" y="122" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="600" text-anchor="start" fill="#1f2937">Q'</text>
  <line x1="208" y1="88" x2="221" y2="88" stroke="#1f2937" stroke-width="1.6"/>
  <text x="230" y="92" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="start" fill="#1f2937">D</text>
  <line x1="208" y1="136" x2="233" y2="136" stroke="#1f2937" stroke-width="1.6"/>
  <path d="M233,130 l9,6 l-9,6" fill="none" stroke="#1f2937" stroke-width="1.3"/>
  <text x="245" y="140" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" text-anchor="start" fill="#1f2937">C</text>
  <text x="221" y="178" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" text-anchor="start" fill="#1f2937">D  C</text>
  <text x="221" y="197" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#1f2937">0 ↑  →  Q = 0</text>
  <text x="221" y="216" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#1f2937">1 ↑  →  Q = 1</text>
  <text x="221" y="235" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#1f2937">Q sigue a D (dato)</text>
  <text x="221" y="254" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#1f2937">sin flanco: mantiene</text>
  <text x="221" y="288" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="start" fill="#0f766e">Q(t+1) = D</text>
  <rect x="417" y="55" width="145" height="95" rx="6" fill="#f8fafc" stroke="#1f2937" stroke-width="1.8"/>
  <text x="489.5" y="73" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1d4ed8">J-K</text>
  <line x1="562" y1="85" x2="575" y2="85" stroke="#1f2937" stroke-width="1.6"/>
  <text x="579" y="89" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="start" fill="#1f2937">Q</text>
  <line x1="562" y1="118" x2="575" y2="118" stroke="#1f2937" stroke-width="1.6"/>
  <text x="579" y="122" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="600" text-anchor="start" fill="#1f2937">Q'</text>
  <line x1="404" y1="80" x2="417" y2="80" stroke="#1f2937" stroke-width="1.6"/>
  <text x="426" y="84" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="start" fill="#1f2937">J</text>
  <line x1="404" y1="112" x2="417" y2="112" stroke="#1f2937" stroke-width="1.6"/>
  <text x="426" y="116" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="start" fill="#1f2937">K</text>
  <line x1="404" y1="136" x2="429" y2="136" stroke="#1f2937" stroke-width="1.6"/>
  <path d="M429,130 l9,6 l-9,6" fill="none" stroke="#1f2937" stroke-width="1.3"/>
  <text x="441" y="140" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" text-anchor="start" fill="#1f2937">C</text>
  <text x="417" y="178" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" text-anchor="start" fill="#1f2937">J  C  K</text>
  <text x="417" y="197" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#1f2937">0 ↑ 0  →  mantiene</text>
  <text x="417" y="216" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#1f2937">1 ↑ 0  →  Q = 1</text>
  <text x="417" y="235" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#1f2937">0 ↑ 1  →  Q = 0</text>
  <text x="417" y="254" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#1f2937">1 ↑ 1  →  conmuta (toggle)</text>
  <text x="417" y="288" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="start" fill="#0f766e">Q(t+1) = J·Q' + K'·Q</text>
  <rect x="613" y="55" width="145" height="95" rx="6" fill="#f8fafc" stroke="#1f2937" stroke-width="1.8"/>
  <text x="685.5" y="73" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle" fill="#1d4ed8">T</text>
  <line x1="758" y1="85" x2="771" y2="85" stroke="#1f2937" stroke-width="1.6"/>
  <text x="775" y="89" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="start" fill="#1f2937">Q</text>
  <line x1="758" y1="118" x2="771" y2="118" stroke="#1f2937" stroke-width="1.6"/>
  <text x="775" y="122" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="600" text-anchor="start" fill="#1f2937">Q'</text>
  <line x1="600" y1="88" x2="613" y2="88" stroke="#1f2937" stroke-width="1.6"/>
  <text x="622" y="92" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="start" fill="#1f2937">T</text>
  <line x1="600" y1="136" x2="625" y2="136" stroke="#1f2937" stroke-width="1.6"/>
  <path d="M625,130 l9,6 l-9,6" fill="none" stroke="#1f2937" stroke-width="1.3"/>
  <text x="637" y="140" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" text-anchor="start" fill="#1f2937">C</text>
  <text x="613" y="178" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" text-anchor="start" fill="#1f2937">T  C</text>
  <text x="613" y="197" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#1f2937">0 ↑  →  mantiene</text>
  <text x="613" y="216" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#1f2937">1 ↑  →  conmuta</text>
  <text x="613" y="235" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#1f2937">Q(t+1) = T ⊕ Q</text>
  <text x="613" y="254" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#1f2937">divisor de frecuencia</text>
  <text x="613" y="288" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="start" fill="#0f766e">Q(t+1) = T ⊕ Q</text>
  <text x="30" y="335" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#4b5563">↑ = flanco activo (normalmente de subida). Los biestables de la cátedra son disparados por flanco:</text>
  <text x="30" y="354" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#4b5563">Q sólo puede cambiar en el instante del pulso de reloj (los cambios asincrónicos se ven como basura).</text>
  <text x="30" y="373" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#4b5563">Entradas asincrónicas PRESET (Q = 1) y CLEAR (Q = 0) actúan sin esperar el reloj: se usan para</text>
  <text x="30" y="392" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#4b5563">inicializar registros y contadores al encender la máquina (RESET del sistema).</text>
  <text x="30" y="411" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#4b5563">Poniendo n biestables en paralelo con el mismo reloj y la misma línea de LOAD se arma un registro de n bits;</text>
  <text x="30" y="430" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#4b5563">con la salida Q' realimentada a la entrada D se obtiene un divisor de frecuencia (T = 1).</text>
</svg>
