<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="26" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1f2937">AMAT: el tiempo promedio de acceso con acierto, fallo y dos niveles</text>
  <text x="24" y="52" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="700" text-anchor="start" fill="#0f766e">AMAT = tiempo de acierto + (tasa de fallos × penalidad de fallo)</text>
  <text x="24" y="84" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="700" text-anchor="start" fill="#1f2937">Una sola caché:  acierto 1 ciclo, 5 % de fallos, penalidad 100 ciclos</text>
  <rect x="40" y="100" width="120" height="34" rx="4" fill="#dcfce7" stroke="#1f2937" stroke-width="1.3"/>
  <text x="100" y="122" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="middle" fill="#1f2937">acierto 1</text>
  <rect x="170" y="100" width="330" height="34" rx="4" fill="#fecaca" stroke="#1f2937" stroke-width="1.3"/>
  <text x="335" y="122" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="middle" fill="#1f2937">5 % de 100 ciclos = 5 ciclos promedio</text>
  <text x="520" y="122" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#7c2d12">⇒ AMAT = 1 + 0,05×100 = 6 ciclos (16,7× mejor que ir siempre a RAM)</text>
  <text x="24" y="166" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="700" text-anchor="start" fill="#1f2937">Dos niveles: L1 (1 ciclo, 5 % falla) → L2 (10 ciclos, de esos fallos el 20 % va a RAM de 100 ciclos)</text>
  <rect x="40" y="182" width="120" height="34" rx="4" fill="#dcfce7" stroke="#1f2937" stroke-width="1.3"/>
  <text x="100" y="204" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="middle" fill="#1f2937">L1: 1</text>
  <rect x="170" y="182" width="180" height="34" rx="4" fill="#fef3c7" stroke="#1f2937" stroke-width="1.3"/>
  <text x="260" y="204" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="middle" fill="#1f2937">L2: 10</text>
  <rect x="360" y="182" width="200" height="34" rx="4" fill="#fecaca" stroke="#1f2937" stroke-width="1.3"/>
  <text x="460" y="204" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="middle" fill="#1f2937">RAM: 20 % × 100 = 20</text>
  <text x="580" y="192" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="400" text-anchor="start" fill="#7c2d12">AMAT = 1 + 0,05 × (10 + 0,2×100)</text>
  <text x="580" y="212" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="700" text-anchor="start" fill="#7c2d12">= 1 + 0,05 × 30 = 2,5 ciclos</text>
  <text x="24" y="250" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#4b5563">Por qué el segundo nivel ayuda tanto: absorbe la mayoría de los fallos de L1 y evita pagar los 100 ciclos de la RAM.</text>
  <rect x="24" y="270" width="872" height="112" rx="6" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="40" y="292" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="700" text-anchor="start" fill="#1f2937">Lo que cambia el resultado, en orden de impacto:</text>
  <text x="40" y="314" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#1f2937">1 · la tasa de fallos (localidad del programa) · 2 · la penalidad (ancho de banda de la RAM) · 3 · el tiempo de acierto.</text>
  <text x="40" y="334" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#15803d">Mejorar la tasa de fallos de 5 % a 2 % con penalidad 100: AMAT = 1 + 2 = 3 ciclos (¡la mitad!).</text>
  <text x="40" y="354" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">Duplicar la caché suele bajar la tasa; subir la asociatividad también; el tamaño del bloque tiene un óptimo (más bloque = más localidad, pero más penalidad).</text>
  <text x="40" y="372" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#7c2d12">CPI con caché: CPI = CPI_ideal + (fallos por instrucción × penalidad). Con 2 % y 100 ⇒ +2 al CPI.</text>
  <text x="24" y="394" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#4b5563">AMAT = Average Memory Access Time: es el número que se usa para comparar dos jerarquías en el final.</text>
</svg>
