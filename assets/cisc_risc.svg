<svg xmlns="http://www.w3.org/2000/svg" width="780" height="520" viewBox="0 0 780 520">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="26" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1f2937">CISC vs RISC: largo de la instrucción, quién hace el trabajo y por qué el pipeline</text>
  <rect x="40" y="46" width="330" height="46" rx="6" fill="#fee2e2" stroke="#1f2937" stroke-width="1.7"/>
  <text x="205" y="66" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2937">CISC  (x86, 8086, VAX)</text>
  <text x="205" y="83" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#4b5563">pocas instrucciones, cada una hace mucho</text>
  <rect x="410" y="46" width="330" height="46" rx="6" fill="#dbeafe" stroke="#1f2937" stroke-width="1.7"/>
  <text x="575" y="66" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2937">RISC  (ARM, MIPS, RISC-V)</text>
  <text x="575" y="83" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="middle" fill="#4b5563">muchas instrucciones, cada una hace poco</text>
  <text x="40" y="122" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#4b5563">Una instrucción puede medir de 1 a 6 bytes:</text>
  <rect x="40" y="130" width="56" height="34" rx="3" fill="#fef3c7" stroke="#1f2937" stroke-width="1.4"/>
  <text x="68.0" y="152" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="600" text-anchor="middle" fill="#1f2937">opc</text>
  <rect x="96" y="130" width="78" height="34" rx="3" fill="#fef3c7" stroke="#1f2937" stroke-width="1.4"/>
  <text x="135.0" y="152" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="600" text-anchor="middle" fill="#1f2937">mod</text>
  <rect x="174" y="130" width="116" height="34" rx="3" fill="#fef3c7" stroke="#1f2937" stroke-width="1.4"/>
  <text x="232.0" y="152" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="600" text-anchor="middle" fill="#1f2937">desplazamiento</text>
  <rect x="290" y="130" width="50" height="34" rx="3" fill="#fef3c7" stroke="#1f2937" stroke-width="1.4"/>
  <text x="315.0" y="152" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="600" text-anchor="middle" fill="#1f2937">dato</text>
  <text x="348" y="152" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="start" fill="#4b5563">← 4 bytes</text>
  <rect x="40" y="170" width="56" height="34" rx="3" fill="#fef3c7" stroke="#1f2937" stroke-width="1.4"/>
  <text x="68.0" y="192" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="600" text-anchor="middle" fill="#1f2937">opc</text>
  <rect x="96" y="170" width="62" height="34" rx="3" fill="#fef3c7" stroke="#1f2937" stroke-width="1.4"/>
  <text x="127.0" y="192" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="600" text-anchor="middle" fill="#1f2937">reg</text>
  <text x="166" y="192" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="600" text-anchor="start" fill="#b91c1c">← 2 bytes  ⇒ largo VARIABLE</text>
  <text x="40" y="226" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="400" text-anchor="start" fill="#1d4ed8">ADD [BX+SI+4], AX   →  memoria + memoria en UNA instrucción</text>
  <text x="410" y="122" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#4b5563">Todas las instrucciones miden lo mismo:</text>
  <rect x="410" y="130" width="60" height="34" rx="3" fill="#bfdbfe" stroke="#1f2937" stroke-width="1.4"/>
  <text x="440" y="152" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="600" text-anchor="middle" fill="#1f2937">Op</text>
  <rect x="470" y="130" width="60" height="34" rx="3" fill="#bfdbfe" stroke="#1f2937" stroke-width="1.4"/>
  <text x="500" y="152" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="600" text-anchor="middle" fill="#1f2937">rs1</text>
  <rect x="530" y="130" width="60" height="34" rx="3" fill="#bfdbfe" stroke="#1f2937" stroke-width="1.4"/>
  <text x="560" y="152" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="600" text-anchor="middle" fill="#1f2937">rs2</text>
  <rect x="590" y="130" width="60" height="34" rx="3" fill="#bfdbfe" stroke="#1f2937" stroke-width="1.4"/>
  <text x="620" y="152" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="600" text-anchor="middle" fill="#1f2937">rd</text>
  <rect x="650" y="130" width="60" height="34" rx="3" fill="#bfdbfe" stroke="#1f2937" stroke-width="1.4"/>
  <text x="680" y="152" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="600" text-anchor="middle" fill="#1f2937">funct</text>
  <rect x="410" y="170" width="300" height="34" rx="3" fill="#eff6ff" stroke="#1f2937" stroke-width="1.4" stroke-dasharray="4 3"/>
  <rect x="410" y="170" width="60" height="34" rx="3" fill="#bfdbfe" stroke="#1f2937" stroke-width="1.4"/>
  <text x="440" y="192" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="600" text-anchor="middle" fill="#1f2937">Op</text>
  <rect x="470" y="170" width="60" height="34" rx="3" fill="#bfdbfe" stroke="#1f2937" stroke-width="1.4"/>
  <text x="500" y="192" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="600" text-anchor="middle" fill="#1f2937">rs1</text>
  <rect x="530" y="170" width="60" height="34" rx="3" fill="#bfdbfe" stroke="#1f2937" stroke-width="1.4"/>
  <text x="560" y="192" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="600" text-anchor="middle" fill="#1f2937">rs2</text>
  <rect x="590" y="170" width="60" height="34" rx="3" fill="#bfdbfe" stroke="#1f2937" stroke-width="1.4"/>
  <text x="620" y="192" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="600" text-anchor="middle" fill="#1f2937">rd</text>
  <rect x="650" y="170" width="60" height="34" rx="3" fill="#bfdbfe" stroke="#1f2937" stroke-width="1.4"/>
  <text x="680" y="192" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="600" text-anchor="middle" fill="#1f2937">funct</text>
  <text x="716" y="152" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="start" fill="#4b5563">4 bytes</text>
  <text x="410" y="226" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="400" text-anchor="start" fill="#1d4ed8">LW + ADD + SW  →  tres instrucciones simples</text>
  <line x1="40" y1="246" x2="740" y2="246" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="44" y="274" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#15803d">+</text>
  <text x="60" y="274" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="400" text-anchor="start" fill="#1f2937">densidad de código alta (programa chico)</text>
  <text x="44" y="299" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#15803d">+</text>
  <text x="60" y="299" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="400" text-anchor="start" fill="#1f2937">compatibilidad: el repertorio crece sin romper</text>
  <text x="44" y="324" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#15803d">+</text>
  <text x="60" y="324" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="400" text-anchor="start" fill="#1f2937">menos búsquedas de instrucción</text>
  <text x="44" y="349" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#b91c1c">-</text>
  <text x="60" y="349" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="400" text-anchor="start" fill="#1f2937">largo variable ⇒ pipeline difícil</text>
  <text x="44" y="374" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#b91c1c">-</text>
  <text x="60" y="374" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="400" text-anchor="start" fill="#1f2937">UC microprogramada ⇒ más lento por microorden</text>
  <text x="44" y="399" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#b91c1c">-</text>
  <text x="60" y="399" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="400" text-anchor="start" fill="#1f2937">hardware complejo y difícil de verificar</text>
  <text x="44" y="424" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#4b5563">→</text>
  <text x="60" y="424" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="400" text-anchor="start" fill="#1f2937">se ejecuta traduciendo a micro-operaciones</text>
  <text x="414" y="274" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#15803d">+</text>
  <text x="430" y="274" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="400" text-anchor="start" fill="#1f2937">un ciclo por instrucción ⇒ pipeline eficiente</text>
  <text x="414" y="299" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#15803d">+</text>
  <text x="430" y="299" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="400" text-anchor="start" fill="#1f2937">UC cableada: pocos modos y todos registro</text>
  <text x="414" y="324" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#15803d">+</text>
  <text x="430" y="324" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="400" text-anchor="start" fill="#1f2937">muchos registros, acceso a memoria sólo load/store</text>
  <text x="414" y="349" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#15803d">+</text>
  <text x="430" y="349" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="400" text-anchor="start" fill="#1f2937">menos consumo y hardware regular y escalable</text>
  <text x="414" y="374" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#b91c1c">-</text>
  <text x="430" y="374" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="400" text-anchor="start" fill="#1f2937">más instrucciones: el programa ocupa más</text>
  <text x="414" y="399" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#b91c1c">-</text>
  <text x="430" y="399" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="400" text-anchor="start" fill="#1f2937">depende del compilador para optimizar</text>
  <text x="414" y="424" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#4b5563">→</text>
  <text x="430" y="424" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="400" text-anchor="start" fill="#1f2937">control cableado, sin memoria de control</text>
  <line x1="40" y1="466" x2="740" y2="466" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="40" y="484" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="400" text-anchor="start" fill="#4b5563">Hoy son híbridos: el x86 (CISC) traduce cada instrucción a micro-operaciones simples y las ejecuta con un núcleo tipo RISC</text>
  <text x="40" y="500" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="400" text-anchor="start" fill="#4b5563">⇒ CISC por fuera, RISC por dentro. Lo que decide no es "cuál es mejor" sino el compromiso: código compacto vs pipeline.</text>
</svg>
