<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="26" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1f2937">Monousuario vs multiusuario: qué cambia al conectar varias máquinas</text>
  <rect x="24" y="46" width="424" height="216" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.4"/>
  <text x="40" y="70" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.8" font-weight="700" text-anchor="start" fill="#1d4ed8">MONOUSUARIO (multicore / multihilo)</text>
  <text x="40" y="96" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#1f2937">· un sistema operativo, una memoria</text>
  <text x="40" y="118" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#1f2937">· los núcleos comparten la RAM</text>
  <text x="40" y="140" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#1f2937">· comunican por variables y caché</text>
  <text x="40" y="162" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#1f2937">· coherencia por hardware (MESI)</text>
  <text x="40" y="184" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#7c2d12">· límite: el ancho de banda de la memoria</text>
  <text x="40" y="206" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#4b5563">· ejemplo: laptop de 8 núcleos</text>
  <text x="40" y="232" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="700" text-anchor="start" fill="#1f2937">Escala a decenas de núcleos.</text>
  <rect x="472" y="46" width="424" height="216" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="1.4"/>
  <text x="488" y="70" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.8" font-weight="700" text-anchor="start" fill="#15803d">MULTIUSUARIO (cluster / distribuido)</text>
  <text x="488" y="96" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#1f2937">· muchas máquinas, cada una con su SO</text>
  <text x="488" y="118" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#1f2937">· NO comparten memoria: mensajes</text>
  <text x="488" y="140" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#1f2937">· comunican por red (latencia de µs-ms)</text>
  <text x="488" y="162" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#1f2937">· tolera fallas de una máquina</text>
  <text x="488" y="184" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#7c2d12">· límite: la red y el balance de carga</text>
  <text x="488" y="206" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#4b5563">· ejemplo: servidores de un banco</text>
  <text x="488" y="232" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="700" text-anchor="start" fill="#1f2937">Escala a miles de máquinas.</text>
  <rect x="24" y="280" width="872" height="104" rx="6" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="40" y="302" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="700" text-anchor="start" fill="#1f2937">Lo que hay que decir en el final</text>
  <text x="40" y="324" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#1f2937">Mismo objetivo (más rendimiento), distinto mecanismo: memoria compartida = rápido y con techo; paso de mensajes = escala mucho y cuesta coordinar.</text>
  <text x="40" y="344" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#4b5563">La ley de Amdahl vale para los dos: la parte secuencial y la comunicación ponen el techo. Un cluster no arregla un programa poco paralelo.</text>
  <text x="40" y="364" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#4b5563">Vocabulario: SISD/SIMD/MISD/MIMD (Flynn, 8.2.2) · UMA vs NUMA · granularidad gruesa (procesos) vs fina (hilos).</text>
  <text x="24" y="396" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">En la máquina de la cátedra no hay nada de esto: es un solo procesador. Por eso la unidad 8 es 'concepto + cuenta', no circuito.</text>
</svg>
