<svg xmlns="http://www.w3.org/2000/svg" width="920" height="410" viewBox="0 0 920 410">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="26" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1f2937">División con restauración: 7 ÷ 3 (cociente 2, resto 1)</text>
  <text x="24" y="52" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="700" text-anchor="start" fill="#1f2937">Registros: M (divisor), Q (dividendo → luego cociente), A (resto parcial)</text>
  <rect x="60" y="78" width="130" height="40" rx="6" ry="6" fill="#dbeafe" stroke="#1f2937" stroke-width="1.7"/>
  <text x="125.0" y="95.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">M</text>
  <text x="125.0" y="112.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">divisor = 0011</text>
  <rect x="60" y="128" width="130" height="40" rx="6" ry="6" fill="#dcfce7" stroke="#1f2937" stroke-width="1.7"/>
  <text x="125.0" y="145.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">Q</text>
  <text x="125.0" y="162.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">dividendo = 0111</text>
  <rect x="60" y="178" width="130" height="40" rx="6" ry="6" fill="#fef3c7" stroke="#1f2937" stroke-width="1.7"/>
  <text x="125.0" y="195.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">A</text>
  <text x="125.0" y="212.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">resto = 0000</text>
  <text x="24" y="256" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="700" text-anchor="start" fill="#1f2937">Cada vuelta: desplazar (A,Q) a la izquierda · A ← A − M · si A &lt; 0, restaurar (A ← A + M) y Q0 = 0; si no, Q0 = 1</text>
  <text x="470" y="84" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="700" text-anchor="start" fill="#1f2937">paso</text>
  <text x="530" y="84" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="700" text-anchor="start" fill="#1f2937">A</text>
  <text x="600" y="84" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="700" text-anchor="start" fill="#1f2937">Q</text>
  <text x="660" y="84" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="700" text-anchor="start" fill="#1f2937">qué pasó</text>
  <text x="470" y="106" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="400" text-anchor="start" fill="#1f2937">1</text>
  <text x="530" y="106" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="400" text-anchor="start" fill="#1f2937">0000</text>
  <text x="600" y="106" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="400" text-anchor="start" fill="#1f2937">1110</text>
  <text x="660" y="106" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="400" text-anchor="start" fill="#1f2937">A−M = −3 ⇒ restaura, Q0=0</text>
  <text x="470" y="128" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="400" text-anchor="start" fill="#1f2937">2</text>
  <text x="530" y="128" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="400" text-anchor="start" fill="#1f2937">0001</text>
  <text x="600" y="128" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="400" text-anchor="start" fill="#1f2937">1100</text>
  <text x="660" y="128" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="400" text-anchor="start" fill="#1f2937">A−M = −2 ⇒ restaura, Q0=0</text>
  <text x="470" y="150" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="400" text-anchor="start" fill="#1f2937">3</text>
  <text x="530" y="150" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="400" text-anchor="start" fill="#1f2937">0000</text>
  <text x="600" y="150" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="400" text-anchor="start" fill="#1f2937">1001</text>
  <text x="660" y="150" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="400" text-anchor="start" fill="#1f2937">A−M = 0 ⇒ Q0=1</text>
  <text x="470" y="172" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="400" text-anchor="start" fill="#1f2937">4</text>
  <text x="530" y="172" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="400" text-anchor="start" fill="#1f2937">0001</text>
  <text x="600" y="172" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="400" text-anchor="start" fill="#1f2937">0010</text>
  <text x="660" y="172" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="400" text-anchor="start" fill="#1f2937">A−M = −2 ⇒ restaura, Q0=0</text>
  <rect x="460" y="196" width="440" height="32" rx="4" fill="#dcfce7" stroke="#1f2937" stroke-width="1.3"/>
  <text x="470" y="218" font-family="Consolas, 'Courier New', monospace" font-size="9.8" font-weight="700" text-anchor="start" fill="#0f766e">cociente Q = 0010 = 2 · resto A = 0001 = 1  ✓</text>
  <text x="470" y="246" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#4b5563">Comprobación: 7 = 2 × 3 + 1</text>
  <rect x="24" y="272" width="872" height="116" rx="6" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="40" y="294" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#1f2937">Restauración: si la resta dio negativo, se DES HACE la resta (se vuelve a sumar M). Es simple, pero pierde un tiempo.</text>
  <text x="40" y="316" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">No restauración: no se deshace; si A &lt; 0, en la vuelta siguiente se SUMA M en vez de restar. Mismo resultado, menos operaciones.</text>
  <text x="40" y="338" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">Por qué se desplaza el par (A,Q): el resto parcial 'baja' el bit siguiente del dividendo, igual que en la división a mano.</text>
  <text x="40" y="360" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">Costo: n vueltas para n bits (cada una, una resta y un desplazamiento); el cociente queda en Q y el resto en A.</text>
  <text x="24" y="404" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#7c2d12">Trampa de examen: A tiene n bits y el cociente n bits ⇒ el cociente puede no entrar (sobreflujo) cuando el divisor es muy chico.</text>
</svg>
