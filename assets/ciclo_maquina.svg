<svg xmlns="http://www.w3.org/2000/svg" width="780" height="340" viewBox="0 0 780 340">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="26" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1f2937">Ciclo de máquina: búsqueda (fetch) + ejecución (execute)</text>
  <rect x="30" y="60" width="320" height="170" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.8"/>
  <text x="190" y="85" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#1e3a8a">CICLO DE BÚSQUEDA</text>
  <text x="50" y="112" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#1f2937">1. MAR ← PC</text>
  <text x="50" y="134" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#1f2937">2. MEMR = 1  (leer memoria)</text>
  <text x="50" y="156" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#1f2937">3. MBR ← M[MAR]  ;  PC ← PC + 1</text>
  <text x="50" y="178" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#1f2937">4. IR ← MBR</text>
  <text x="50" y="200" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#1f2937">5. decodificar opcode  ;  STATE ← E</text>
  <rect x="430" y="60" width="320" height="170" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.8"/>
  <text x="590" y="85" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#14532d">CICLO DE EJECUCIÓN</text>
  <text x="450" y="112" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#1f2937">6. leer operandos según el modo</text>
  <text x="450" y="134" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#1f2937">7. operar (ALU / registro / memoria)</text>
  <text x="450" y="156" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#1f2937">8. escribir el resultado</text>
  <text x="450" y="178" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#1f2937">9. actualizar PC si es salto</text>
  <text x="450" y="200" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#1f2937">10. STATE ← F   (vuelve a buscar)</text>
  <line x1="350" y1="145" x2="430" y2="145" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="430" y1="145" x2="421.7780908812166" y2="141.3393702123178" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="430" y1="145" x2="421.7780908812166" y2="148.6606297876822" stroke="#1f2937" stroke-width="1.6"/>
  <path d="M590,230 C590,285 190,285 190,230" fill="none" stroke="#7c3aed" stroke-width="1.8" stroke-dasharray="7 5"/>
  <line x1="190" y1="245" x2="190" y2="231" stroke="#7c3aed" stroke-width="1.6"/>
  <line x1="190" y1="231" x2="186.3393702123178" y2="239.2219091187834" stroke="#7c3aed" stroke-width="1.6"/>
  <line x1="190" y1="231" x2="193.6606297876822" y2="239.2219091187834" stroke="#7c3aed" stroke-width="1.6"/>
  <text x="30" y="320" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#4b5563">Mientras RUN = 1 el ciclo se repite instrucción por instrucción; los flip-flops STATE (F/E) y CLOCK (pulsos) lo sincronizan.</text>
</svg>
