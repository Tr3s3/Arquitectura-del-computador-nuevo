<svg xmlns="http://www.w3.org/2000/svg" width="920" height="410" viewBox="0 0 920 410">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="26" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1f2937">La pila: guardar y recuperar el contexto sin pisar nada</text>
  <text x="24" y="52" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.8" font-weight="700" text-anchor="start" fill="#1f2937">Pila LIFO: el último que entra es el primero que sale (SP apunta al tope)</text>
  <rect x="70" y="80" width="150" height="30" rx="3" fill="#dbeafe" stroke="#1f2937" stroke-width="1.2"/>
  <text x="145" y="100" font-family="Consolas, 'Courier New', monospace" font-size="9.4" font-weight="400" text-anchor="middle" fill="#1f2937">ret 3</text>
  <rect x="70" y="114" width="150" height="30" rx="3" fill="#dbeafe" stroke="#1f2937" stroke-width="1.2"/>
  <text x="145" y="134" font-family="Consolas, 'Courier New', monospace" font-size="9.4" font-weight="400" text-anchor="middle" fill="#1f2937">ret 2</text>
  <rect x="70" y="148" width="150" height="30" rx="3" fill="#dbeafe" stroke="#1f2937" stroke-width="1.2"/>
  <text x="145" y="168" font-family="Consolas, 'Courier New', monospace" font-size="9.4" font-weight="400" text-anchor="middle" fill="#1f2937">ret 1</text>
  <rect x="70" y="182" width="150" height="30" rx="3" fill="#f8fafc" stroke="#1f2937" stroke-width="1.2"/>
  <rect x="70" y="216" width="150" height="30" rx="3" fill="#f8fafc" stroke="#1f2937" stroke-width="1.2"/>
  <rect x="70" y="250" width="150" height="30" rx="3" fill="#f8fafc" stroke="#1f2937" stroke-width="1.2"/>
  <line x1="30" y1="176" x2="66" y2="176" stroke="#1d4ed8" stroke-width="1.6"/>
  <line x1="66" y1="176" x2="57.77809088121659" y2="172.3393702123178" stroke="#1d4ed8" stroke-width="1.6"/>
  <line x1="66" y1="176" x2="57.77809088121659" y2="179.6606297876822" stroke="#1d4ed8" stroke-width="1.6"/>
  <text x="26" y="180" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="end" fill="#1d4ed8">SP</text>
  <text x="240" y="100" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="700" text-anchor="start" fill="#1f2937">Al llamar (SRJ / CALL / interrupción):</text>
  <text x="240" y="120" font-family="Consolas, 'Courier New', monospace" font-size="9.4" font-weight="400" text-anchor="start" fill="#7c2d12">SP ← SP − 1 y luego M[SP] ← PC</text>
  <text x="240" y="148" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="700" text-anchor="start" fill="#1f2937">Al volver (RET / RTI):</text>
  <text x="240" y="168" font-family="Consolas, 'Courier New', monospace" font-size="9.4" font-weight="400" text-anchor="start" fill="#7c2d12">PC ← M[SP] y luego SP ← SP + 1</text>
  <text x="240" y="196" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#4b5563">La pila crece hacia abajo en casi todas las máquinas.</text>
  <text x="24" y="264" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.8" font-weight="700" text-anchor="start" fill="#1f2937">Anidamiento: una interrupción dentro de otra</text>
  <rect x="40" y="282" width="860" height="76" rx="6" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="56" y="304" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#1f2937">programa → IRQ1 (apila PC) → rutina 1 → IRQ2 (apila PC de la rutina 1) → rutina 2 → RTI (vuelve a la rutina 1) → RTI (vuelve al programa)</text>
  <text x="56" y="324" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#b91c1c">Sin pila: la segunda interrupción PISA la dirección de retorno de la primera y el primer RTI vuelve a cualquier lado (el programa 'salta al vacío').</text>
  <text x="56" y="344" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">Por eso el SP es obligatorio: es lo que hace que la interrupción sea transparente aun con anidamiento.</text>
  <text x="24" y="384" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#1f2937">En la BLUE de la cátedra la interrupción usa una posición fija (M[0]) en vez de pila; con SP se puede anidar. En el 8086 la pila va con SS:SP.</text>
</svg>
