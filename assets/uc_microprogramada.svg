  <text x="436" y="214" font-family="Consolas, 'Courier New', monospace" font-size="9.5" font-weight="400" text-anchor="start" fill="#4b5563">(μPC ← …)</text>
  <text x="20" y="330" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="400" text-anchor="start" fill="#4b5563">El opcode NO enciende compuertas: elige (por la PLA) la dirección inicial de su microprograma en la ROM.</text>
  <text x="20" y="347" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="400" text-anchor="start" fill="#4b5563">Cada pulso se lee una microinstrucción; sus bits SON las señales de control de ese pulso.</text>
  <text x="20" y="364" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="400" text-anchor="start" fill="#4b5563">El secuenciador decide la próxima dirección: +1 (secuencia), la del SR (retorno) o la de un salto condicional.</text>
  <text x="20" y="381" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="400" text-anchor="start" fill="#4b5563">Microinstrucción del 8088: fuente 5 · destino 5 · tipo 3 · ALU 4 · registro 3 · condición 1 = 21 bits.</text>
</svg>
