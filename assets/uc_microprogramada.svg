  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="26" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1f2937">Unidad de control microprogramada: el opcode elige una dirección de la memoria de control</text>
  <rect x="20" y="70" width="130" height="56" rx="6" ry="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.7"/>
