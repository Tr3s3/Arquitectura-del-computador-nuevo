  <text x="85.0" y="112.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">opcode</text>
  <rect x="190" y="70" width="130" height="56" rx="6" ry="6" fill="#dbeafe" stroke="#1f2937" stroke-width="1.7"/>
  <text x="255.0" y="95.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">PLA</text>
  <text x="255.0" y="112.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">opcode → dirección</text>
  <rect x="360" y="70" width="130" height="56" rx="6" ry="6" fill="#e0e7ff" stroke="#1f2937" stroke-width="1.7"/>
  <text x="425.0" y="95.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">microMAR</text>
  <text x="425.0" y="112.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">apunta a la μ-instr.</text>
  <rect x="530" y="58" width="190" height="84" rx="6" ry="6" fill="#fef3c7" stroke="#1f2937" stroke-width="1.7"/>
  <text x="625.0" y="97.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">ROM de control</text>
  <text x="625.0" y="114.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">504 × 21 bits (8088)</text>
  <rect x="530" y="230" width="190" height="64" rx="6" ry="6" fill="#dcfce7" stroke="#1f2937" stroke-width="1.7"/>
  <text x="625.0" y="259.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">Registro de control</text>
  <text x="625.0" y="276.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">21 bits = las señales</text>
  <rect x="760" y="58" width="140" height="84" rx="6" ry="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.7"/>
  <text x="830.0" y="97.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">señales</text>
  <text x="830.0" y="114.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">Send / Load / R-W</text>
  <rect x="360" y="230" width="130" height="64" rx="6" ry="6" fill="#fde68a" stroke="#1f2937" stroke-width="1.7"/>
  <text x="425.0" y="259.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">secuenciador</text>
  <text x="425.0" y="276.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">μPC + SR / μ-pila</text>
  <rect x="190" y="230" width="130" height="64" rx="6" ry="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.7"/>
