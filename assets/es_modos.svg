<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="26" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1f2937">Los tres modos de entrada/salida: quién espera a quién</text>
  <rect x="30" y="44" width="270" height="232" rx="6" ry="6" fill="#fef3c7" stroke="#1f2937" stroke-width="1.7"/>
  <text x="42" y="66" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.6" font-weight="700" text-anchor="start" fill="#1f2937">1 · E/S PROGRAMADA (polling)</text>
  <text x="42" y="88" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#4b5563">la CPU espera</text>
  <rect x="44" y="98" width="100" height="36" rx="6" ry="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.7"/>
  <text x="94.0" y="120.025" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1f2937">CPU</text>
  <rect x="178" y="98" width="108" height="36" rx="6" ry="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.7"/>
  <text x="232.0" y="119.36" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="600" text-anchor="middle" fill="#1f2937">PERIFÉRICO</text>
  <line x1="146" y1="108" x2="176" y2="108" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="176" y1="108" x2="167.7780908812166" y2="104.3393702123178" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="176" y1="108" x2="167.7780908812166" y2="111.6606297876822" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="176" y1="124" x2="146" y2="124" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="146" y1="124" x2="154.2219091187834" y2="127.6606297876822" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="146" y1="124" x2="154.2219091187834" y2="120.33937021231779" stroke="#1f2937" stroke-width="1.6"/>
  <text x="44" y="168" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.1" font-weight="400" text-anchor="start" fill="#374151">La CPU pregunta en un lazo:</text>
  <text x="44" y="183" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.1" font-weight="400" text-anchor="start" fill="#374151">LEA Flag / CPF / JMP si no</text>
  <text x="44" y="198" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.1" font-weight="400" text-anchor="start" fill="#374151"></text>
  <text x="44" y="213" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.1" font-weight="400" text-anchor="start" fill="#374151">Costo: ciclos tirados a la basura.</text>
  <text x="44" y="228" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.1" font-weight="400" text-anchor="start" fill="#374151">Si el periférico se cuelga,</text>
  <text x="44" y="243" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.1" font-weight="400" text-anchor="start" fill="#374151">la CPU espera para siempre.</text>
  <rect x="345" y="44" width="270" height="232" rx="6" ry="6" fill="#dbeafe" stroke="#1f2937" stroke-width="1.7"/>
  <text x="357" y="66" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.6" font-weight="700" text-anchor="start" fill="#1f2937">2 · POR INTERRUPCIONES</text>
  <text x="357" y="88" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#4b5563">el periférico avisa</text>
  <rect x="359" y="98" width="100" height="36" rx="6" ry="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.7"/>
  <text x="409.0" y="120.025" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1f2937">CPU</text>
  <rect x="493" y="98" width="108" height="36" rx="6" ry="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.7"/>
  <text x="547.0" y="119.36" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="600" text-anchor="middle" fill="#1f2937">PERIFÉRICO</text>
  <line x1="461" y1="108" x2="491" y2="108" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="491" y1="108" x2="482.7780908812166" y2="104.3393702123178" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="491" y1="108" x2="482.7780908812166" y2="111.6606297876822" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="491" y1="124" x2="461" y2="124" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="461" y1="124" x2="469.2219091187834" y2="127.6606297876822" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="461" y1="124" x2="469.2219091187834" y2="120.33937021231779" stroke="#1f2937" stroke-width="1.6"/>
  <text x="359" y="168" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.1" font-weight="400" text-anchor="start" fill="#374151">La CPU lanza la operación y</text>
  <text x="359" y="183" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.1" font-weight="400" text-anchor="start" fill="#374151">sigue con su programa.</text>
  <text x="359" y="198" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.1" font-weight="400" text-anchor="start" fill="#374151"></text>
  <text x="359" y="213" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.1" font-weight="400" text-anchor="start" fill="#374151">El periférico pone IRQ = 1.</text>
  <text x="359" y="228" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.1" font-weight="400" text-anchor="start" fill="#374151">Se atiende en CP8, tras la</text>
  <text x="359" y="243" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.1" font-weight="400" text-anchor="start" fill="#374151">instrucción en curso.</text>
  <rect x="660" y="44" width="270" height="232" rx="6" ry="6" fill="#dcfce7" stroke="#1f2937" stroke-width="1.7"/>
  <text x="672" y="66" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.6" font-weight="700" text-anchor="start" fill="#1f2937">3 · DMA</text>
  <text x="672" y="88" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#4b5563">el controlador mueve</text>
  <rect x="674" y="98" width="100" height="36" rx="6" ry="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.7"/>
  <text x="724.0" y="120.025" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="600" text-anchor="middle" fill="#1f2937">CPU</text>
  <rect x="808" y="98" width="108" height="36" rx="6" ry="6" fill="#ffffff" stroke="#1f2937" stroke-width="1.7"/>
  <text x="862.0" y="119.36" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="600" text-anchor="middle" fill="#1f2937">PERIFÉRICO</text>
  <line x1="776" y1="108" x2="806" y2="108" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="806" y1="108" x2="797.7780908812166" y2="104.3393702123178" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="806" y1="108" x2="797.7780908812166" y2="111.6606297876822" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="806" y1="124" x2="776" y2="124" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="776" y1="124" x2="784.2219091187834" y2="127.6606297876822" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="776" y1="124" x2="784.2219091187834" y2="120.33937021231779" stroke="#1f2937" stroke-width="1.6"/>
  <text x="674" y="168" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.1" font-weight="400" text-anchor="start" fill="#374151">El DMA transfiere bloques</text>
  <text x="674" y="183" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.1" font-weight="400" text-anchor="start" fill="#374151">memoria - periférico solo.</text>
  <text x="674" y="198" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.1" font-weight="400" text-anchor="start" fill="#374151"></text>
  <text x="674" y="213" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.1" font-weight="400" text-anchor="start" fill="#374151">La CPU sólo lo programa y</text>
  <text x="674" y="228" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.1" font-weight="400" text-anchor="start" fill="#374151">recibe una interrupción al</text>
  <text x="674" y="243" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.1" font-weight="400" text-anchor="start" fill="#374151">terminar el bloque.</text>
  <rect x="30" y="292" width="900" height="88" rx="6" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="46" y="314" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.1" font-weight="400" text-anchor="start" fill="#1f2937">Cuánto se pierde: un periférico tarda milisegundos; una instrucción de la CPU, ~1 µs ⇒ 1000 veces más rápido.</text>
  <text x="46" y="336" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.1" font-weight="400" text-anchor="start" fill="#4b5563">Polling: la CPU pregunta N veces y pierde ~N ciclos.  Interrupción: pierde sólo el tiempo de la ISR (~decenas de ciclos).</text>
  <text x="46" y="358" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.1" font-weight="400" text-anchor="start" fill="#4b5563">DMA: la CPU pierde sólo la programación inicial y el reconocimiento final; el bloque lo mueve el controlador.</text>
</svg>
