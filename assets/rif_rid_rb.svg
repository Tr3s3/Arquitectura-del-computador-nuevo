<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="26" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1f2937">La BLUE indexada: RIF, RID y RB más el modificador de 2 bits</text>
  <text x="24" y="52" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.8" font-weight="700" text-anchor="start" fill="#1f2937">Tres registros que la BLUE original no tenía</text>
  <rect x="50" y="80" width="190" height="60" rx="6" ry="6" fill="#dbeafe" stroke="#1f2937" stroke-width="1.7"/>
  <text x="145.0" y="107.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">RIF</text>
  <text x="145.0" y="124.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">índice · incrementa solo</text>
  <rect x="50" y="160" width="190" height="60" rx="6" ry="6" fill="#dbeafe" stroke="#1f2937" stroke-width="1.7"/>
  <text x="145.0" y="187.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">RID</text>
  <text x="145.0" y="204.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">puntero de pila · apila/desapila</text>
  <rect x="50" y="240" width="190" height="60" rx="6" ry="6" fill="#dbeafe" stroke="#1f2937" stroke-width="1.7"/>
  <text x="145.0" y="267.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">RB</text>
  <text x="145.0" y="284.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">base · desplaza el bloque</text>
  <text x="270" y="108" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" text-anchor="start" fill="#4b5563">se usa con el modo indexado: EA = D + RIF (y RIF sube o baja)</text>
  <text x="270" y="188" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" text-anchor="start" fill="#4b5563">SP ⇒ permite anidar interrupciones y subrutinas</text>
  <text x="270" y="268" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" text-anchor="start" fill="#4b5563">se suma a la dirección para mover un programa en memoria</text>
  <rect x="50" y="322" width="190" height="46" rx="4" fill="#fef3c7" stroke="#1f2937" stroke-width="1.4"/>
  <text x="145" y="350" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="700" text-anchor="middle" fill="#1f2937">modificador (2 bits)</text>
  <text x="270" y="338" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" text-anchor="start" fill="#7c2d12">00 sin índice · 01 incrementa · 10 decrementa · 11 usa puntero (o RB)</text>
  <text x="270" y="356" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" text-anchor="start" fill="#4b5563">Son 4 combinaciones porque el campo tiene 2 bits ⇒ 2² = 4.</text>
  <rect x="640" y="80" width="256" height="130" rx="6" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="656" y="102" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="700" text-anchor="start" fill="#1f2937">Por qué 24 pulsos</text>
  <text x="656" y="124" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" text-anchor="start" fill="#1f2937">8 pulsos de búsqueda</text>
  <text x="656" y="142" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" text-anchor="start" fill="#1f2937">+ 8 de ejecución</text>
  <text x="656" y="160" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" text-anchor="start" fill="#4b5563">+ 8 de la indexación (calcular</text>
  <text x="656" y="176" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" text-anchor="start" fill="#4b5563">  EA = D + RIF y actualizar RIF)</text>
  <text x="656" y="196" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="700" text-anchor="start" fill="#7c2d12">= 24 pulsos = 3 µs</text>
  <text x="24" y="384" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#1f2937">La BLUE original (unidad 4) no tiene estos registros: la indexada los agrega para recorrer vectores y usar pila. Eso agrega pulsos a la instrucción.</text>
</svg>
