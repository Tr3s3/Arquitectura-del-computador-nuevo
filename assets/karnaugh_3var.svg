  <text x="40" y="300" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="400" text-anchor="start" fill="#4b5563">Las columnas van en código GRAY (00, 01, 11, 10): así dos casilleros vecinos difieren en UNA sola variable,</text>
  <text x="40" y="316" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="400" text-anchor="start" fill="#4b5563">y agruparlos equivale a aplicar A·B + A·B' = A. Un grupo de 2 elimina 1 variable; de 4, elimina 2; de 8, elimina 3.</text>
