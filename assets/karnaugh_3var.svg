  <text x="536" y="204" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.2" font-weight="400" text-anchor="start" fill="#1f2937">• B cambia  ⇒ desaparece</text>
  <text x="536" y="222" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.2" font-weight="400" text-anchor="start" fill="#1f2937">• C = 1 siempre ⇒ queda</text>
