<svg xmlns="http://www.w3.org/2000/svg" width="940" height="430" viewBox="0 0 940 430">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="26" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1f2937">De la tabla de verdad al circuito canónico (suma de mintérminos)</text>
  <text x="30" y="54" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#1f2937">Tabla de verdad</text>
  <text x="30" y="78" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="700" text-anchor="start" fill="#1f2937">A B C | Y</text>
  <text x="30" y="95" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="400" text-anchor="start" fill="#1f2937">0 0 0 | 0</text>
  <text x="30" y="112" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="400" text-anchor="start" fill="#1f2937">0 0 1 | 1</text>
  <text x="30" y="129" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="400" text-anchor="start" fill="#1f2937">0 1 0 | 1</text>
  <text x="30" y="146" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="400" text-anchor="start" fill="#1f2937">0 1 1 | 0</text>
  <text x="30" y="163" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="400" text-anchor="start" fill="#1f2937">1 0 0 | 0</text>
  <text x="30" y="180" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="400" text-anchor="start" fill="#1f2937">1 0 1 | 1</text>
  <text x="30" y="197" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="400" text-anchor="start" fill="#1f2937">1 1 0 | 0</text>
  <text x="30" y="214" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="400" text-anchor="start" fill="#1f2937">1 1 1 | 1</text>
  <text x="160" y="95" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="400" text-anchor="start" fill="#b91c1c">m1 = A'·B'·C</text>
  <text x="160" y="112" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="400" text-anchor="start" fill="#b91c1c">m2 = A'·B·C'</text>
  <text x="160" y="146" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="400" text-anchor="start" fill="#b91c1c">m5 = A·B'·C</text>
  <text x="160" y="180" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="400" text-anchor="start" fill="#b91c1c">m7 = A·B·C</text>
  <text x="30" y="232" font-family="Consolas, 'Courier New', monospace" font-size="12" font-weight="700" text-anchor="start" fill="#7c2d12">Y = Σm(1, 2, 5, 7)</text>
  <text x="30" y="258" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">Cada 1 de la salida es un mintérmino:</text>
  <text x="30" y="274" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">un AND con TODAS las variables</text>
  <text x="30" y="290" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">(la que vale 0 va negada).</text>
  <text x="30" y="316" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">Cada 0 es un maxtérmino (una OR).</text>
  <rect x="404" y="44" width="512" height="330" rx="6" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="420" y="66" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.6" font-weight="700" text-anchor="start" fill="#1f2937">Circuito canónico: 4 AND de 3 entradas + 1 OR de 4</text>
  <path d="M424,86 L459.0,86 A25.0,25.0 0 0 1 459.0,136 L424,136 Z" fill="#ffffff" stroke="#1f2937" stroke-width="1.7"/>
  <line x1="408" y1="98.5" x2="424" y2="98.5" stroke="#1f2937" stroke-width="1.6"/>
  <text x="403" y="102.5" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="600" text-anchor="end" fill="#1f2937">A'</text>
  <line x1="408" y1="111.0" x2="424" y2="111.0" stroke="#1f2937" stroke-width="1.6"/>
  <text x="403" y="115.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="600" text-anchor="end" fill="#1f2937">B'</text>
  <line x1="408" y1="123.5" x2="424" y2="123.5" stroke="#1f2937" stroke-width="1.6"/>
  <text x="403" y="127.5" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="600" text-anchor="end" fill="#1f2937">C</text>
  <line x1="484" y1="111.0" x2="500" y2="111.0" stroke="#1f2937" stroke-width="1.6"/>
  <text x="505" y="115.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="700" text-anchor="start" fill="#1d4ed8">m1</text>
  <path d="M424,148 L459.0,148 A25.0,25.0 0 0 1 459.0,198 L424,198 Z" fill="#ffffff" stroke="#1f2937" stroke-width="1.7"/>
  <line x1="408" y1="160.5" x2="424" y2="160.5" stroke="#1f2937" stroke-width="1.6"/>
  <text x="403" y="164.5" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="600" text-anchor="end" fill="#1f2937">A'</text>
  <line x1="408" y1="173.0" x2="424" y2="173.0" stroke="#1f2937" stroke-width="1.6"/>
  <text x="403" y="177.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="600" text-anchor="end" fill="#1f2937">B</text>
  <line x1="408" y1="185.5" x2="424" y2="185.5" stroke="#1f2937" stroke-width="1.6"/>
  <text x="403" y="189.5" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="600" text-anchor="end" fill="#1f2937">C'</text>
  <line x1="484" y1="173.0" x2="500" y2="173.0" stroke="#1f2937" stroke-width="1.6"/>
  <text x="505" y="177.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="700" text-anchor="start" fill="#1d4ed8">m2</text>
  <path d="M424,210 L459.0,210 A25.0,25.0 0 0 1 459.0,260 L424,260 Z" fill="#ffffff" stroke="#1f2937" stroke-width="1.7"/>
  <line x1="408" y1="222.5" x2="424" y2="222.5" stroke="#1f2937" stroke-width="1.6"/>
  <text x="403" y="226.5" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="600" text-anchor="end" fill="#1f2937">A</text>
  <line x1="408" y1="235.0" x2="424" y2="235.0" stroke="#1f2937" stroke-width="1.6"/>
  <text x="403" y="239.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="600" text-anchor="end" fill="#1f2937">B'</text>
  <line x1="408" y1="247.5" x2="424" y2="247.5" stroke="#1f2937" stroke-width="1.6"/>
  <text x="403" y="251.5" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="600" text-anchor="end" fill="#1f2937">C</text>
  <line x1="484" y1="235.0" x2="500" y2="235.0" stroke="#1f2937" stroke-width="1.6"/>
  <text x="505" y="239.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="700" text-anchor="start" fill="#1d4ed8">m5</text>
  <path d="M424,272 L459.0,272 A25.0,25.0 0 0 1 459.0,322 L424,322 Z" fill="#ffffff" stroke="#1f2937" stroke-width="1.7"/>
  <line x1="408" y1="284.5" x2="424" y2="284.5" stroke="#1f2937" stroke-width="1.6"/>
  <text x="403" y="288.5" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="600" text-anchor="end" fill="#1f2937">A</text>
  <line x1="408" y1="297.0" x2="424" y2="297.0" stroke="#1f2937" stroke-width="1.6"/>
  <text x="403" y="301.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="600" text-anchor="end" fill="#1f2937">B</text>
  <line x1="408" y1="309.5" x2="424" y2="309.5" stroke="#1f2937" stroke-width="1.6"/>
  <text x="403" y="313.5" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="600" text-anchor="end" fill="#1f2937">C</text>
  <line x1="484" y1="297.0" x2="500" y2="297.0" stroke="#1f2937" stroke-width="1.6"/>
  <text x="505" y="301.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="700" text-anchor="start" fill="#1d4ed8">m7</text>
  <path d="M600,110 C618.2,110 651.8,120.4 670,162.0 C651.8,203.60000000000002 618.2,214 600,214 C612.6,178.64 612.6,145.36 600,110 Z" fill="#ffffff" stroke="#1f2937" stroke-width="1.7"/>
  <line x1="588" y1="130.8" x2="608" y2="130.8" stroke="#1f2937" stroke-width="1.6"/>
  <text x="583" y="134.8" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="600" text-anchor="end" fill="#1f2937"></text>
  <line x1="588" y1="151.6" x2="608" y2="151.6" stroke="#1f2937" stroke-width="1.6"/>
  <text x="583" y="155.6" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="600" text-anchor="end" fill="#1f2937"></text>
  <line x1="588" y1="172.4" x2="608" y2="172.4" stroke="#1f2937" stroke-width="1.6"/>
  <text x="583" y="176.4" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="600" text-anchor="end" fill="#1f2937"></text>
  <line x1="588" y1="193.2" x2="608" y2="193.2" stroke="#1f2937" stroke-width="1.6"/>
  <text x="583" y="197.2" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="600" text-anchor="end" fill="#1f2937"></text>
  <line x1="670" y1="162.0" x2="690" y2="162.0" stroke="#1f2937" stroke-width="1.6"/>
  <text x="695" y="166.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="700" text-anchor="start" fill="#1d4ed8">Y</text>
  <text x="700" y="128" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="700" text-anchor="start" fill="#1f2937">Dos niveles:</text>
  <text x="700" y="148" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="700" text-anchor="start" fill="#1d4ed8">AND – OR</text>
  <text x="700" y="176" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#4b5563">SOP = suma de</text>
  <text x="700" y="192" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#4b5563">productos (Σm).</text>
  <text x="700" y="218" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#4b5563">POS = producto</text>
  <text x="700" y="234" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#4b5563">de sumas (ΠM).</text>
  <text x="700" y="262" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#4b5563">Las entradas del OR</text>
  <text x="700" y="278" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#4b5563">son las salidas de</text>
  <text x="700" y="294" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#4b5563">los AND (m1…m7).</text>
  <text x="420" y="348" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#7c2d12">Es el punto de partida: nunca falla, pero gasta mucho (por eso se simplifica con Karnaugh).</text>
  <text x="30" y="392" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="400" text-anchor="start" fill="#1f2937">El índice del mintérmino es el número binario de las entradas: A=0,B=1,C=0 ⇒ 010 ⇒ m2.</text>
  <text x="30" y="412" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="400" text-anchor="start" fill="#4b5563">Para 3 variables hay 8 mintérminos (m0…m7); para 4 variables, dieciséis (m0…m15).</text>
</svg>
