<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="26" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1f2937">El ciclo de búsqueda: los 8 pulsos de CP1 a CP8</text>
  <rect x="40" y="62" width="66" height="28" rx="3" fill="#dbeafe" stroke="#1f2937" stroke-width="1.3"/>
  <text x="73" y="81" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="700" text-anchor="middle" fill="#1d4ed8">CP1</text>
  <rect x="106" y="62" width="230" height="28" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="116" y="81" font-family="Consolas, 'Courier New', monospace" font-size="9.6" font-weight="700" text-anchor="start" fill="#1f2937">MAR ← PC</text>
  <text x="350" y="81" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#4b5563">la dirección de la instrucción va al bus</text>
  <rect x="40" y="96" width="66" height="28" rx="3" fill="#dbeafe" stroke="#1f2937" stroke-width="1.3"/>
  <text x="73" y="115" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="700" text-anchor="middle" fill="#1d4ed8">CP2</text>
  <rect x="106" y="96" width="230" height="28" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="116" y="115" font-family="Consolas, 'Courier New', monospace" font-size="9.6" font-weight="700" text-anchor="start" fill="#1f2937">PC ← PC + 1</text>
  <text x="350" y="115" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#4b5563">se apunta a la siguiente</text>
  <rect x="40" y="130" width="66" height="28" rx="3" fill="#dbeafe" stroke="#1f2937" stroke-width="1.3"/>
  <text x="73" y="149" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="700" text-anchor="middle" fill="#1d4ed8">CP3</text>
  <rect x="106" y="130" width="230" height="28" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="116" y="149" font-family="Consolas, 'Courier New', monospace" font-size="9.6" font-weight="700" text-anchor="start" fill="#1f2937">MBR ← M[MAR], Read</text>
  <text x="350" y="149" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#4b5563">llega la instrucción</text>
  <rect x="40" y="164" width="66" height="28" rx="3" fill="#dbeafe" stroke="#1f2937" stroke-width="1.3"/>
  <text x="73" y="183" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="700" text-anchor="middle" fill="#1d4ed8">CP4</text>
  <rect x="106" y="164" width="230" height="28" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="116" y="183" font-family="Consolas, 'Courier New', monospace" font-size="9.6" font-weight="700" text-anchor="start" fill="#1f2937">IR ← MBR</text>
  <text x="350" y="183" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#4b5563">queda en el registro de instrucción</text>
  <rect x="40" y="198" width="66" height="28" rx="3" fill="#dbeafe" stroke="#1f2937" stroke-width="1.3"/>
  <text x="73" y="217" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="700" text-anchor="middle" fill="#1d4ed8">CP5</text>
  <rect x="106" y="198" width="230" height="28" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="116" y="217" font-family="Consolas, 'Courier New', monospace" font-size="9.6" font-weight="700" text-anchor="start" fill="#1f2937">UC decodifica</text>
  <text x="350" y="217" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#4b5563">el opcode elige la secuencia</text>
  <rect x="40" y="232" width="66" height="28" rx="3" fill="#dbeafe" stroke="#1f2937" stroke-width="1.3"/>
  <text x="73" y="251" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="700" text-anchor="middle" fill="#1d4ed8">CP6</text>
  <rect x="106" y="232" width="230" height="28" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="116" y="251" font-family="Consolas, 'Courier New', monospace" font-size="9.6" font-weight="700" text-anchor="start" fill="#1f2937">— (nada)</text>
  <text x="350" y="251" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#4b5563">pulso de decodificación</text>
  <rect x="40" y="266" width="66" height="28" rx="3" fill="#dbeafe" stroke="#1f2937" stroke-width="1.3"/>
  <text x="73" y="285" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="700" text-anchor="middle" fill="#1d4ed8">CP7</text>
  <rect x="106" y="266" width="230" height="28" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="116" y="285" font-family="Consolas, 'Courier New', monospace" font-size="9.6" font-weight="700" text-anchor="start" fill="#1f2937">— (nada)</text>
  <text x="350" y="285" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#4b5563">pulso de decodificación</text>
  <rect x="40" y="300" width="66" height="28" rx="3" fill="#dbeafe" stroke="#1f2937" stroke-width="1.3"/>
  <text x="73" y="319" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="700" text-anchor="middle" fill="#1d4ed8">CP8</text>
  <rect x="106" y="300" width="230" height="28" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.1"/>
  <text x="116" y="319" font-family="Consolas, 'Courier New', monospace" font-size="9.6" font-weight="700" text-anchor="start" fill="#1f2937">estado ← E</text>
  <text x="350" y="319" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#4b5563">pasa a ejecución (o interrupción)</text>
  <rect x="620" y="62" width="276" height="248" rx="6" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="636" y="84" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="700" text-anchor="start" fill="#1f2937">Reglas del ciclo</text>
  <text x="636" y="106" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" text-anchor="start" fill="#1f2937">· 8 pulsos = 1 ciclo de máquina.</text>
  <text x="636" y="124" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" text-anchor="start" fill="#4b5563">· Un pulso dura 125 ns si el reloj</text>
  <text x="636" y="142" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" text-anchor="start" fill="#4b5563">  es de 1 MHz.</text>
  <text x="636" y="164" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" text-anchor="start" fill="#4b5563">· Toda instrucción empieza con</text>
  <text x="636" y="182" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" text-anchor="start" fill="#4b5563">  este mismo ciclo de búsqueda.</text>
  <text x="636" y="204" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" text-anchor="start" fill="#b91c1c">· La interrupción se acepta en CP8.</text>
  <text x="636" y="226" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" text-anchor="start" fill="#4b5563">· En CP8 el estado pasa de F a E:</text>
  <text x="636" y="244" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" text-anchor="start" fill="#4b5563">  búsqueda (F) → ejecución (E) →</text>
  <text x="636" y="262" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" text-anchor="start" fill="#4b5563">  interrupción (I).</text>
  <text x="636" y="288" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" text-anchor="start" fill="#4b5563">Los pulsos 5-7 se usan para decodificar</text>
  <text x="636" y="304" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" text-anchor="start" fill="#4b5563">sin tocar el bus.</text>
  <text x="24" y="356" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="400" text-anchor="start" fill="#1f2937">Ciclo de reloj (1 pulso) ⊂ ciclo de máquina (8 pulsos) ⊂ ciclo de instrucción (búsqueda + 1 o más ciclos de ejecución).</text>
  <text x="24" y="378" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="400" text-anchor="start" fill="#4b5563">Por eso la instrucción más corta dura 8 pulsos = 1 µs, y por eso el tiempo de un programa se cuenta en pulsos.</text>
</svg>
