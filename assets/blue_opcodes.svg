<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="26" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1f2937">Los 16 códigos de operación de la BLUE (4 bits, en octal)</text>
  <rect x="30" y="60" width="206" height="68" rx="5" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="42" y="86" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="700" text-anchor="start" fill="#1d4ed8">0</text>
  <text x="74" y="86" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#1f2937">HLT</text>
  <text x="42" y="112" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.8" font-weight="400" text-anchor="start" fill="#4b5563">alta (detiene)</text>
  <rect x="252" y="60" width="206" height="68" rx="5" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="264" y="86" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="700" text-anchor="start" fill="#1d4ed8">1</text>
  <text x="296" y="86" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#1f2937">ADD</text>
  <text x="264" y="112" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.8" font-weight="400" text-anchor="start" fill="#4b5563">AC ← AC + M[D]</text>
  <rect x="474" y="60" width="206" height="68" rx="5" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="486" y="86" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="700" text-anchor="start" fill="#1d4ed8">2</text>
  <text x="518" y="86" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#1f2937">SUB</text>
  <text x="486" y="112" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.8" font-weight="400" text-anchor="start" fill="#4b5563">AC ← AC − M[D]</text>
  <rect x="696" y="60" width="206" height="68" rx="5" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="708" y="86" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="700" text-anchor="start" fill="#1d4ed8">3</text>
  <text x="740" y="86" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#1f2937">STA</text>
  <text x="708" y="112" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.8" font-weight="400" text-anchor="start" fill="#4b5563">M[D] ← AC</text>
  <rect x="30" y="142" width="206" height="68" rx="5" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="42" y="168" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="700" text-anchor="start" fill="#1d4ed8">4</text>
  <text x="74" y="168" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#1f2937">LDA</text>
  <text x="42" y="194" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.8" font-weight="400" text-anchor="start" fill="#4b5563">AC ← M[D]</text>
  <rect x="252" y="142" width="206" height="68" rx="5" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="264" y="168" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="700" text-anchor="start" fill="#1d4ed8">5</text>
  <text x="296" y="168" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#1f2937">INP</text>
  <text x="264" y="194" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.8" font-weight="400" text-anchor="start" fill="#4b5563">AC ← periférico</text>
  <rect x="474" y="142" width="206" height="68" rx="5" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="486" y="168" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="700" text-anchor="start" fill="#1d4ed8">6</text>
  <text x="518" y="168" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#1f2937">OUT</text>
  <text x="486" y="194" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.8" font-weight="400" text-anchor="start" fill="#4b5563">periférico ← AC</text>
  <rect x="696" y="142" width="206" height="68" rx="5" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="708" y="168" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="700" text-anchor="start" fill="#1d4ed8">7</text>
  <text x="740" y="168" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#1f2937">SKF</text>
  <text x="708" y="194" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.8" font-weight="400" text-anchor="start" fill="#4b5563">salta si bandera</text>
  <rect x="30" y="224" width="206" height="68" rx="5" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="42" y="250" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="700" text-anchor="start" fill="#1d4ed8">10</text>
  <text x="74" y="250" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#1f2937">JMP</text>
  <text x="42" y="276" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.8" font-weight="400" text-anchor="start" fill="#4b5563">PC ← D</text>
  <rect x="252" y="224" width="206" height="68" rx="5" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="264" y="250" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="700" text-anchor="start" fill="#1d4ed8">11</text>
  <text x="296" y="250" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#1f2937">JMA</text>
  <text x="264" y="276" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.8" font-weight="400" text-anchor="start" fill="#4b5563">salto si AC&lt;0</text>
  <rect x="474" y="224" width="206" height="68" rx="5" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="486" y="250" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="700" text-anchor="start" fill="#1d4ed8">12</text>
  <text x="518" y="250" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#1f2937">JSR</text>
  <text x="486" y="276" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.8" font-weight="400" text-anchor="start" fill="#4b5563">salto a subrutina</text>
  <rect x="696" y="224" width="206" height="68" rx="5" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="708" y="250" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="700" text-anchor="start" fill="#1d4ed8">13</text>
  <text x="740" y="250" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#1f2937">RET</text>
  <text x="708" y="276" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.8" font-weight="400" text-anchor="start" fill="#4b5563">vuelve de subrutina</text>
  <rect x="30" y="306" width="206" height="68" rx="5" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="42" y="332" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="700" text-anchor="start" fill="#1d4ed8">14</text>
  <text x="74" y="332" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#1f2937">SRJ</text>
  <text x="42" y="358" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.8" font-weight="400" text-anchor="start" fill="#4b5563">salto y retorno</text>
  <rect x="252" y="306" width="206" height="68" rx="5" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="264" y="332" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="700" text-anchor="start" fill="#1d4ed8">15</text>
  <text x="296" y="332" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#1f2937">RAL</text>
  <text x="264" y="358" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.8" font-weight="400" text-anchor="start" fill="#4b5563">rota AC a la izquierda</text>
  <rect x="474" y="306" width="206" height="68" rx="5" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="486" y="332" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="700" text-anchor="start" fill="#1d4ed8">16</text>
  <text x="518" y="332" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#1f2937">CSA</text>
  <text x="486" y="358" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.8" font-weight="400" text-anchor="start" fill="#4b5563">cambia signo</text>
  <rect x="696" y="306" width="206" height="68" rx="5" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
  <text x="708" y="332" font-family="Consolas, 'Courier New', monospace" font-size="13" font-weight="700" text-anchor="start" fill="#1d4ed8">17</text>
  <text x="740" y="332" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" text-anchor="start" fill="#1f2937">NOP</text>
  <text x="708" y="358" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.8" font-weight="400" text-anchor="start" fill="#4b5563">no opera</text>
  <text x="30" y="400" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">En octal se escribe con un dígito (0-7 con 3 bits) — la BLUE usa 4 bits de opcode, así que los códigos van de 0 a 17 octal (0 a 15 decimal).</text>
  <text x="30" y="416" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#7c2d12">Grupos de ciclo: HLT, NOP, RAL, CSA, SRJ, JMP y JMA son de 1 ciclo (8 pulsos); LDA/STA/ADD/SUB de 2; indexada e indirecta, más.</text>
</svg>
