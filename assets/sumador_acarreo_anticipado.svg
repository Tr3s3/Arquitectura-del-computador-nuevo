<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="26" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1f2937">Acarreo anticipado: G = A·B, P = A⊕B, C(i+1) = G + P·C(i)</text>
  <text x="40" y="58" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="start" fill="#1f2937">Del acarreo en cadena al acarreo anticipado</text>
  <text x="40" y="86" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.6" font-weight="600" text-anchor="start" fill="#b91c1c">RIPPLE CARRY: el acarreo atraviesa 4 etapas</text>
  <rect x="40" y="96" width="150" height="56" rx="6" ry="6" fill="#fee2e2" stroke="#1f2937" stroke-width="1.7"/>
  <text x="115.0" y="121.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">FA 0</text>
  <text x="115.0" y="138.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">espera el acarreo</text>
  <line x1="190" y1="124" x2="230" y2="124" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="230" y1="124" x2="221.7780908812166" y2="120.3393702123178" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="230" y1="124" x2="221.7780908812166" y2="127.6606297876822" stroke="#1f2937" stroke-width="1.6"/>
  <text x="210" y="116" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="400" text-anchor="middle" fill="#b91c1c">C</text>
  <rect x="240" y="96" width="150" height="56" rx="6" ry="6" fill="#fee2e2" stroke="#1f2937" stroke-width="1.7"/>
  <text x="315.0" y="121.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">FA 1</text>
  <text x="315.0" y="138.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">espera el acarreo</text>
  <line x1="390" y1="124" x2="430" y2="124" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="430" y1="124" x2="421.7780908812166" y2="120.3393702123178" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="430" y1="124" x2="421.7780908812166" y2="127.6606297876822" stroke="#1f2937" stroke-width="1.6"/>
  <text x="410" y="116" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="400" text-anchor="middle" fill="#b91c1c">C</text>
  <rect x="440" y="96" width="150" height="56" rx="6" ry="6" fill="#fee2e2" stroke="#1f2937" stroke-width="1.7"/>
  <text x="515.0" y="121.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">FA 2</text>
  <text x="515.0" y="138.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">espera el acarreo</text>
  <line x1="590" y1="124" x2="630" y2="124" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="630" y1="124" x2="621.7780908812166" y2="120.3393702123178" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="630" y1="124" x2="621.7780908812166" y2="127.6606297876822" stroke="#1f2937" stroke-width="1.6"/>
  <text x="610" y="116" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="400" text-anchor="middle" fill="#b91c1c">C</text>
  <rect x="640" y="96" width="150" height="56" rx="6" ry="6" fill="#fee2e2" stroke="#1f2937" stroke-width="1.7"/>
  <text x="715.0" y="121.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">FA 3</text>
  <text x="715.0" y="138.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">espera el acarreo</text>
  <text x="40" y="172" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="400" text-anchor="start" fill="#4b5563">retardo total ≈ 4 × (retardo del FA) = 8 niveles de compuerta</text>
  <text x="40" y="208" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.6" font-weight="600" text-anchor="start" fill="#15803d">ACARREO ANTICIPADO: todos los acarreos se calculan a la vez</text>
  <rect x="40" y="220" width="200" height="92" rx="6" ry="6" fill="#dcfce7" stroke="#1f2937" stroke-width="1.7"/>
  <text x="140.0" y="263.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">G(i) = A(i) · B(i)</text>
  <text x="140.0" y="280.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">genera acarreo</text>
  <rect x="280" y="220" width="200" height="92" rx="6" ry="6" fill="#dcfce7" stroke="#1f2937" stroke-width="1.7"/>
  <text x="380.0" y="263.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">P(i) = A(i) ⊕ B(i)</text>
  <text x="380.0" y="280.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">propaga acarreo</text>
  <rect x="520" y="220" width="360" height="92" rx="6" ry="6" fill="#fef3c7" stroke="#1f2937" stroke-width="1.7"/>
  <text x="700.0" y="263.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">C(i+1) = G(i) + P(i) · C(i)</text>
  <text x="700.0" y="280.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">con 2 niveles por acarreo</text>
  <line x1="240" y1="266" x2="280" y2="266" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="280" y1="266" x2="271.7780908812166" y2="262.3393702123178" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="280" y1="266" x2="271.7780908812166" y2="269.6606297876822" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="480" y1="266" x2="520" y2="266" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="520" y1="266" x2="511.7780908812166" y2="262.3393702123178" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="520" y1="266" x2="511.7780908812166" y2="269.6606297876822" stroke="#1f2937" stroke-width="1.6"/>
  <rect x="40" y="330" width="840" height="122" rx="6" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="56" y="352" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="600" text-anchor="start" fill="#1f2937">Desarrollo para 4 bits (C0 = acarreo de entrada):</text>
  <text x="56" y="374" font-family="Consolas, 'Courier New', monospace" font-size="10.6" font-weight="400" text-anchor="start" fill="#1f2937">C1 = G0 + P0·C0</text>
  <text x="56" y="394" font-family="Consolas, 'Courier New', monospace" font-size="10.6" font-weight="400" text-anchor="start" fill="#1f2937">C2 = G1 + P1·G0 + P1·P0·C0</text>
  <text x="56" y="414" font-family="Consolas, 'Courier New', monospace" font-size="10.6" font-weight="400" text-anchor="start" fill="#1f2937">C3 = G2 + P2·G1 + P2·P1·G0 + P2·P1·P0·C0</text>
  <text x="56" y="434" font-family="Consolas, 'Courier New', monospace" font-size="10.6" font-weight="400" text-anchor="start" fill="#b91c1c">C4 = G3 + P3·G2 + P3·P2·G1 + P3·P2·P1·G0 + P3·P2·P1·P0·C0</text>
  <text x="600" y="374" font-family="Consolas, 'Courier New', monospace" font-size="10.4" font-weight="400" text-anchor="start" fill="#1d4ed8">Suma: S(i) = P(i) ⊕ C(i)</text>
  <text x="600" y="398" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="600" text-anchor="start" fill="#1f2937">Cascada en bloques de 4:</text>
  <text x="600" y="418" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="400" text-anchor="start" fill="#4b5563">cada bloque calcula su G* y P*</text>
  <text x="600" y="436" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="400" text-anchor="start" fill="#4b5563">y se pasa el acarreo de grupo</text>
</svg>
