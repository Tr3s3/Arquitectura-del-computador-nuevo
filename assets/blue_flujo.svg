  <text x="45" y="440" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#4b5563">1) PC → MAR: la dirección de la instrucción.             2) MAR → memoria: bus de direcciones (12 bits ⇒ 4096 posiciones).</text>
  <text x="45" y="462" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#4b5563">3) memoria → MBR: el dato leído viaja por el bus de datos (16 bits).      4) MBR → IR: la instrucción queda en el IR.</text>
  <text x="45" y="484" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#4b5563">5) IR(opcode) → UC: la UC decodifica y genera las señales del ciclo de ejecución.      6) AC: operando implícito de la ALU.</text>
  <text x="45" y="506" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="400" text-anchor="start" fill="#4b5563">El bus es el único camino entre registros: nunca hay dos transferencias al mismo tiempo ⇒ cada microoperación usa 1 pulso.</text>
</svg>
