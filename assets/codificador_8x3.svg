  <text x="40" y="90" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.6" font-weight="400" text-anchor="start" fill="#4b5563">Cada salida es la OR de las entradas</text>
  <text x="40" y="107" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.6" font-weight="400" text-anchor="start" fill="#4b5563">cuyo NÚMERO tiene ese bit en 1:</text>
  <text x="40" y="124" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.6" font-weight="400" text-anchor="start" fill="#4b5563"></text>
  <text x="40" y="141" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.6" font-weight="400" text-anchor="start" fill="#4b5563">  E5 = 101₂  ⇒  aporta a A2 y a A0</text>
  <text x="40" y="158" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.6" font-weight="400" text-anchor="start" fill="#4b5563"></text>
  <text x="40" y="175" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.6" font-weight="400" text-anchor="start" fill="#4b5563">Sólo una entrada debe estar activa;</text>
  <text x="40" y="192" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.6" font-weight="400" text-anchor="start" fill="#4b5563">si hay dos, la salida es la OR de los</text>
  <text x="40" y="209" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.6" font-weight="400" text-anchor="start" fill="#4b5563">códigos (basura) ⇒ hace falta el</text>
  <text x="40" y="226" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.6" font-weight="400" text-anchor="start" fill="#4b5563">codificador CON PRIORIDAD.</text>
  <text x="40" y="330" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.8" font-weight="400" text-anchor="start" fill="#1f2937">Circuito: 3 compuertas OR de 4 entradas. No lleva AND ni inversores.</text>
</svg>
