  <line x1="408" y1="303.2" x2="438" y2="303.2" stroke="#1f2937" stroke-width="1.6"/>
  <text x="403" y="307.2" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" text-anchor="end" fill="#1f2937">E7</text>
  <line x1="506" y1="287.0" x2="536" y2="287.0" stroke="#1f2937" stroke-width="1.6"/>
