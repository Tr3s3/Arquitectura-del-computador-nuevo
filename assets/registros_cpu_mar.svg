<svg xmlns="http://www.w3.org/2000/svg" width="920" height="410" viewBox="0 0 920 410">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="26" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1f2937">Los registros de la CPU y su papel en el ciclo de instrucción</text>
  <rect x="340" y="60" width="240" height="60" rx="6" ry="6" fill="#dbeafe" stroke="#1f2937" stroke-width="1.7"/>
  <text x="460" y="84" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="700" text-anchor="middle" fill="#1f2937">UNIDAD DE CONTROL</text>
  <text x="460" y="104" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="400" text-anchor="middle" fill="#4b5563">decodifica el IR y genera señales</text>
  <rect x="60" y="60" width="200" height="60" rx="6" ry="6" fill="#dcfce7" stroke="#1f2937" stroke-width="1.7"/>
  <text x="160.0" y="87.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">PC</text>
  <text x="160.0" y="104.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">dir. de la próxima</text>
  <rect x="60" y="160" width="200" height="60" rx="6" ry="6" fill="#dcfce7" stroke="#1f2937" stroke-width="1.7"/>
  <text x="160.0" y="187.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">MAR</text>
  <text x="160.0" y="204.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">dirección al bus</text>
  <rect x="60" y="260" width="200" height="60" rx="6" ry="6" fill="#dcfce7" stroke="#1f2937" stroke-width="1.7"/>
  <text x="160.0" y="287.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">MBR</text>
  <text x="160.0" y="304.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">dato que entra/sale</text>
  <rect x="660" y="60" width="210" height="60" rx="6" ry="6" fill="#fef3c7" stroke="#1f2937" stroke-width="1.7"/>
  <text x="765.0" y="87.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">IR</text>
  <text x="765.0" y="104.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">instrucción en curso</text>
  <rect x="660" y="160" width="210" height="60" rx="6" ry="6" fill="#fef3c7" stroke="#1f2937" stroke-width="1.7"/>
  <text x="765.0" y="187.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">AC</text>
  <text x="765.0" y="204.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">acumulador</text>
  <rect x="660" y="260" width="210" height="60" rx="6" ry="6" fill="#fef3c7" stroke="#1f2937" stroke-width="1.7"/>
  <text x="765.0" y="287.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">SP / índice</text>
  <text x="765.0" y="304.0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.5" font-weight="400" text-anchor="middle" fill="#4b5563">pila y direccionamiento</text>
  <line x1="260" y1="90" x2="336" y2="90" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="336" y1="90" x2="327.7780908812166" y2="86.3393702123178" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="336" y1="90" x2="327.7780908812166" y2="93.6606297876822" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="584" y1="90" x2="656" y2="90" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="656" y1="90" x2="647.7780908812166" y2="86.3393702123178" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="656" y1="90" x2="647.7780908812166" y2="93.6606297876822" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="160" y1="122" x2="160" y2="156" stroke="#b91c1c" stroke-width="1.6"/>
  <line x1="160" y1="156" x2="163.6606297876822" y2="147.7780908812166" stroke="#b91c1c" stroke-width="1.6"/>
  <line x1="160" y1="156" x2="156.3393702123178" y2="147.7780908812166" stroke="#b91c1c" stroke-width="1.6"/>
  <line x1="160" y1="222" x2="160" y2="256" stroke="#b91c1c" stroke-width="1.6"/>
  <line x1="160" y1="256" x2="163.6606297876822" y2="247.7780908812166" stroke="#b91c1c" stroke-width="1.6"/>
  <line x1="160" y1="256" x2="156.3393702123178" y2="247.7780908812166" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="168" y="146" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.6" font-weight="400" text-anchor="start" fill="#b91c1c">PC → MAR</text>
  <text x="168" y="246" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.6" font-weight="400" text-anchor="start" fill="#b91c1c">MBR → memoria</text>
  <line x1="656" y1="190" x2="584" y2="190" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="584" y1="190" x2="592.2219091187834" y2="193.6606297876822" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="584" y1="190" x2="592.2219091187834" y2="186.3393702123178" stroke="#1f2937" stroke-width="1.6"/>
  <text x="600" y="182" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.6" font-weight="400" text-anchor="start" fill="#b91c1c">IR → UC</text>
  <line x1="260" y1="290" x2="660" y2="290" stroke="#1d4ed8" stroke-width="2"/>
  <text x="400" y="306" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.6" font-weight="400" text-anchor="start" fill="#1d4ed8">bus interno</text>
  <text x="24" y="350" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#1f2937">PC apunta a la próxima instrucción · MAR lleva la dirección a memoria · MBR recibe el dato · IR guarda la instrucción que se decodifica</text>
  <text x="24" y="372" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#4b5563">AC es el registro de trabajo de la ALU · SP guarda la pila (llamadas, interrupciones) · los de índice y base calculan direcciones</text>
  <text x="24" y="394" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#4b5563">Por qué se llaman así: MAR = Memory Address Register, MBR = Memory Buffer Register, IR = Instruction Register, PC = Program Counter.</text>
</svg>
