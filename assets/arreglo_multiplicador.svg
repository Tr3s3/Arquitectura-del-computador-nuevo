  <rect x="40" y="356" width="780" height="94" rx="6" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="56" y="376" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="400" text-anchor="start" fill="#374151">Cada 'a' es un sumador completo (o un sumador con acarreo guardado: carry-save).</text>
  <text x="56" y="398" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="600" text-anchor="start" fill="#1f2937">Ventaja: es COMBINACIONAL — el producto aparece en el retardo de la matriz (≈ 2n niveles), sin reloj ni ciclos.</text>
  <text x="56" y="420" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="400" text-anchor="start" fill="#4b5563">Costo: n² celdas (un multiplicador de 32 × 32 pide 1024 sumadores) y muchísimos transistores.</text>
  <text x="56" y="440" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="400" text-anchor="start" fill="#4b5563">Alternativa secuencial: sumas y desplazamientos ⇒ n ciclos de reloj, pero con un solo sumador.</text>
</svg>
