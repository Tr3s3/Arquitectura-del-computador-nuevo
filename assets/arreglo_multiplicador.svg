  <text x="20" y="26" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1f2937">Multiplicador de arreglo: n² celdas suman todos los productos parciales a la vez</text>
  <text x="40" y="58" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="600" text-anchor="start" fill="#1f2937">4 × 4: cada fila es un producto parcial; cada celda es un sumador completo</text>
  <text x="40" y="120" font-family="Consolas, 'Courier New', monospace" font-size="9.8" font-weight="400" text-anchor="start" fill="#7c2d12">PP0 = M·b0</text>
