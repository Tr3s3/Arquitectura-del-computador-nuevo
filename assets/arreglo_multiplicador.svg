  <rect x="520" y="288" width="120" height="52" rx="4" fill="#dbeafe" stroke="#1f2937" stroke-width="1.3"/>
  <text x="580.0" y="310" font-family="Consolas, 'Courier New', monospace" font-size="9.4" font-weight="400" text-anchor="middle" fill="#1f2937">a33</text>
