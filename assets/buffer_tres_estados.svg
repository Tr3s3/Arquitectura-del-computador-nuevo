<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="26" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1f2937">Buffer de 3 estados: la compuerta que permite compartir un bus</text>
  <text x="24" y="52" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" text-anchor="start" fill="#1f2937">Símbolo y tabla</text>
  <polygon points="80,90 80,166 170,128" fill="#dbeafe" stroke="#1f2937" stroke-width="1.8" stroke-linejoin="round"/>
  <line x1="48" y1="108" x2="80" y2="108" stroke="#1f2937" stroke-width="1.6"/>
  <text x="44" y="112" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="end" fill="#1f2937">D</text>
  <line x1="48" y1="148" x2="80" y2="148" stroke="#1f2937" stroke-width="1.6"/>
  <text x="44" y="152" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="end" fill="#1f2937">EN</text>
  <line x1="170" y1="128" x2="210" y2="128" stroke="#1f2937" stroke-width="1.6"/>
  <text x="214" y="132" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.5" font-weight="700" text-anchor="start" fill="#1d4ed8">Y</text>
  <text x="24" y="210" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="700" text-anchor="start" fill="#1f2937">EN D | Y</text>
  <text x="24" y="228" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="400" text-anchor="start" fill="#b91c1c">0  x | Z (alta impedancia)</text>
  <text x="24" y="244" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="400" text-anchor="start" fill="#1f2937">1  0 | 0</text>
  <text x="24" y="260" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="400" text-anchor="start" fill="#1f2937">1  1 | 1</text>
  <text x="24" y="288" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">Con EN = 0 la salida queda 'desconectada':</text>
  <text x="24" y="304" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">no empuja ni 0 ni 1, no carga el bus.</text>
  <text x="24" y="330" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="700" text-anchor="start" fill="#7c2d12">Ése es el tercer estado: 0, 1 y Z (alta impedancia).</text>
  <rect x="360" y="86" width="516" height="288" rx="6" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="376" y="110" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.6" font-weight="700" text-anchor="start" fill="#1f2937">Por qué es imprescindible: el bus es un solo cable para muchos</text>
  <line x1="400" y1="176" x2="850" y2="176" stroke="#1d4ed8" stroke-width="3"/>
  <rect x="420" y="128" width="90" height="36" rx="4" fill="#dbeafe" stroke="#1f2937" stroke-width="1.4"/>
  <text x="465" y="152" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#1f2937">R0</text>
  <line x1="465" y1="166" x2="465" y2="174" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="465" y1="174" x2="468.6606297876822" y2="165.7780908812166" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="465" y1="174" x2="461.3393702123178" y2="165.7780908812166" stroke="#1f2937" stroke-width="1.6"/>
  <rect x="570" y="128" width="90" height="36" rx="4" fill="#dbeafe" stroke="#1f2937" stroke-width="1.4"/>
  <text x="615" y="152" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#1f2937">R1</text>
  <line x1="615" y1="166" x2="615" y2="174" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="615" y1="174" x2="618.6606297876822" y2="165.7780908812166" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="615" y1="174" x2="611.3393702123178" y2="165.7780908812166" stroke="#1f2937" stroke-width="1.6"/>
  <rect x="720" y="128" width="90" height="36" rx="4" fill="#dbeafe" stroke="#1f2937" stroke-width="1.4"/>
  <text x="765" y="152" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#1f2937">R2</text>
  <line x1="765" y1="166" x2="765" y2="174" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="765" y1="174" x2="768.6606297876822" y2="165.7780908812166" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="765" y1="174" x2="761.3393702123178" y2="165.7780908812166" stroke="#1f2937" stroke-width="1.6"/>
  <text x="400" y="204" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#b91c1c">Si dos registros hablaran a la vez, uno forzaría 1 y el otro 0 ⇒ cortocircuito.</text>
  <text x="400" y="226" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">Con buffers de 3 estados, la UC habilita UNO solo por pulso: el resto queda en Z.</text>
  <text x="400" y="258" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">Dónde más aparece: salidas de memoria y periféricos, bus de datos bidireccional,</text>
  <text x="400" y="276" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">y el 'chip select' (CS) de cualquier integrado.</text>
  <text x="400" y="306" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">En la BLUE: cada registro tiene su buffer y la UC abre el que corresponde</text>
  <text x="400" y="324" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">en cada uno de los 8 pulsos (ver la instrucción LDA).</text>
  <text x="400" y="352" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#4b5563">Se dice 'tres estados' porque la salida puede ser 0, 1 o alta impedancia: no es un 0 ni un 1,</text>
  <text x="400" y="368" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#4b5563">es una desconexión eléctrica.</text>
</svg>
