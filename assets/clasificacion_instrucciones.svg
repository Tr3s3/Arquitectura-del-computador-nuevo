<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="26" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1f2937">Clasificación de las instrucciones de un repertorio</text>
  <rect x="340" y="52" width="240" height="46" rx="6" ry="6" fill="#dbeafe" stroke="#1f2937" stroke-width="1.7"/>
  <text x="460.0" y="79.55" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#1f2937">INSTRUCCIONES</text>
  <rect x="40" y="140" width="270" height="92" rx="5" fill="#f8fafc" stroke="#1f2937" stroke-width="1.4"/>
  <text x="52" y="164" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="700" text-anchor="start" fill="#1d4ed8">Transferencia de datos</text>
  <text x="52" y="188" font-family="Consolas, 'Courier New', monospace" font-size="8.8" font-weight="400" text-anchor="start" fill="#7c2d12">LOAD · STORE · MOV · INP/OUT</text>
  <text x="52" y="210" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.8" font-weight="400" text-anchor="start" fill="#4b5563">mueven datos, no los cambian</text>
  <rect x="330" y="140" width="270" height="92" rx="5" fill="#f8fafc" stroke="#1f2937" stroke-width="1.4"/>
  <text x="342" y="164" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="700" text-anchor="start" fill="#1d4ed8">Aritméticas</text>
  <text x="342" y="188" font-family="Consolas, 'Courier New', monospace" font-size="8.8" font-weight="400" text-anchor="start" fill="#7c2d12">ADD · SUB · MUL · DIV · INC · DEC</text>
  <text x="342" y="210" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.8" font-weight="400" text-anchor="start" fill="#4b5563">operan con números</text>
  <rect x="620" y="140" width="270" height="92" rx="5" fill="#f8fafc" stroke="#1f2937" stroke-width="1.4"/>
  <text x="632" y="164" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="700" text-anchor="start" fill="#1d4ed8">Lógicas y de bits</text>
  <text x="632" y="188" font-family="Consolas, 'Courier New', monospace" font-size="8.8" font-weight="400" text-anchor="start" fill="#7c2d12">AND · OR · XOR · NOT · SHIFT · ROT</text>
  <text x="632" y="210" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.8" font-weight="400" text-anchor="start" fill="#4b5563">bit a bit</text>
  <rect x="40" y="250" width="270" height="92" rx="5" fill="#f8fafc" stroke="#1f2937" stroke-width="1.4"/>
  <text x="52" y="274" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="700" text-anchor="start" fill="#1d4ed8">Control de flujo</text>
  <text x="52" y="298" font-family="Consolas, 'Courier New', monospace" font-size="8.8" font-weight="400" text-anchor="start" fill="#7c2d12">JMP · JZ · CALL · RET · HLT</text>
  <text x="52" y="320" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.8" font-weight="400" text-anchor="start" fill="#4b5563">cambian el PC</text>
  <rect x="330" y="250" width="270" height="92" rx="5" fill="#f8fafc" stroke="#1f2937" stroke-width="1.4"/>
  <text x="342" y="274" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="700" text-anchor="start" fill="#1d4ed8">Entrada/salida</text>
  <text x="342" y="298" font-family="Consolas, 'Courier New', monospace" font-size="8.8" font-weight="400" text-anchor="start" fill="#7c2d12">IN · OUT · INP · OUT (BLUE)</text>
  <text x="342" y="320" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.8" font-weight="400" text-anchor="start" fill="#4b5563">hablan con periféricos</text>
  <rect x="620" y="250" width="270" height="92" rx="5" fill="#f8fafc" stroke="#1f2937" stroke-width="1.4"/>
  <text x="632" y="274" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="700" text-anchor="start" fill="#1d4ed8">De control del sistema</text>
  <text x="632" y="298" font-family="Consolas, 'Courier New', monospace" font-size="8.8" font-weight="400" text-anchor="start" fill="#7c2d12">NOP · flags · interrupciones (EI/DI)</text>
  <text x="632" y="320" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="8.8" font-weight="400" text-anchor="start" fill="#4b5563">gobiernan la máquina</text>
  <text x="24" y="380" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="400" text-anchor="start" fill="#1f2937">Lo que cambia el flujo (saltos, llamadas, retornos) es lo que rompe el pipeline: ver 7.1.2 (conflicto de control).</text>
</svg>
