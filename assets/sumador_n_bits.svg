  <text x="115" y="92" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="middle" fill="#4b5563">SUMADOR</text>
  <text x="115" y="106" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="middle" fill="#4b5563">completo 0</text>
  <text x="54" y="134" font-family="Consolas, 'Courier New', monospace" font-size="10.5" font-weight="700" text-anchor="start" fill="#1f2937">A0  B0</text>
  <text x="54" y="152" font-family="Consolas, 'Courier New', monospace" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">Cin</text>
  <text x="176" y="134" font-family="Consolas, 'Courier New', monospace" font-size="10.5" font-weight="700" text-anchor="end" fill="#1d4ed8">S0</text>
  <text x="176" y="152" font-family="Consolas, 'Courier New', monospace" font-size="9.6" font-weight="400" text-anchor="end" fill="#b91c1c">Cout</text>
