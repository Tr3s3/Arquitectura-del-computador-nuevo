<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="20" y="26" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" fill="#1f2937">SIMD: una instrucción, varios datos</text>
  <text x="24" y="52" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="700" text-anchor="start" fill="#1f2937">Un registro ancho se parte en lanes: se opera con todos a la vez</text>
  <text x="24" y="80" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.4" font-weight="400" text-anchor="start" fill="#4b5563">Registro de 32 bits partido en 4 lanes de 8 bits</text>
  <rect x="60" y="94" width="94" height="34" rx="3" fill="#dbeafe" stroke="#1f2937" stroke-width="1.4"/>
  <text x="107" y="116" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="400" text-anchor="middle" fill="#1f2937">a0</text>
  <rect x="160" y="94" width="94" height="34" rx="3" fill="#dbeafe" stroke="#1f2937" stroke-width="1.4"/>
  <text x="207" y="116" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="400" text-anchor="middle" fill="#1f2937">a1</text>
  <rect x="260" y="94" width="94" height="34" rx="3" fill="#dbeafe" stroke="#1f2937" stroke-width="1.4"/>
  <text x="307" y="116" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="400" text-anchor="middle" fill="#1f2937">a2</text>
  <rect x="360" y="94" width="94" height="34" rx="3" fill="#dbeafe" stroke="#1f2937" stroke-width="1.4"/>
  <text x="407" y="116" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="400" text-anchor="middle" fill="#1f2937">a3</text>
  <text x="470" y="108" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="700" text-anchor="start" fill="#1d4ed8">+   (UNA instrucción ADD)</text>
  <rect x="60" y="140" width="94" height="34" rx="3" fill="#fef3c7" stroke="#1f2937" stroke-width="1.4"/>
  <text x="107" y="162" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="400" text-anchor="middle" fill="#1f2937">b0</text>
  <rect x="160" y="140" width="94" height="34" rx="3" fill="#fef3c7" stroke="#1f2937" stroke-width="1.4"/>
  <text x="207" y="162" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="400" text-anchor="middle" fill="#1f2937">b1</text>
  <rect x="260" y="140" width="94" height="34" rx="3" fill="#fef3c7" stroke="#1f2937" stroke-width="1.4"/>
  <text x="307" y="162" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="400" text-anchor="middle" fill="#1f2937">b2</text>
  <rect x="360" y="140" width="94" height="34" rx="3" fill="#fef3c7" stroke="#1f2937" stroke-width="1.4"/>
  <text x="407" y="162" font-family="Consolas, 'Courier New', monospace" font-size="10" font-weight="400" text-anchor="middle" fill="#1f2937">b3</text>
  <rect x="60" y="200" width="94" height="34" rx="3" fill="#dcfce7" stroke="#1f2937" stroke-width="1.4"/>
  <text x="107" y="222" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="400" text-anchor="middle" fill="#1f2937">a0+b0</text>
  <line x1="107" y1="176" x2="107" y2="196" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="107" y1="196" x2="110.6606297876822" y2="187.7780908812166" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="107" y1="196" x2="103.3393702123178" y2="187.7780908812166" stroke="#1f2937" stroke-width="1.6"/>
  <rect x="160" y="200" width="94" height="34" rx="3" fill="#dcfce7" stroke="#1f2937" stroke-width="1.4"/>
  <text x="207" y="222" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="400" text-anchor="middle" fill="#1f2937">a1+b1</text>
  <line x1="207" y1="176" x2="207" y2="196" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="207" y1="196" x2="210.6606297876822" y2="187.7780908812166" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="207" y1="196" x2="203.3393702123178" y2="187.7780908812166" stroke="#1f2937" stroke-width="1.6"/>
  <rect x="260" y="200" width="94" height="34" rx="3" fill="#dcfce7" stroke="#1f2937" stroke-width="1.4"/>
  <text x="307" y="222" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="400" text-anchor="middle" fill="#1f2937">a2+b2</text>
  <line x1="307" y1="176" x2="307" y2="196" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="307" y1="196" x2="310.6606297876822" y2="187.7780908812166" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="307" y1="196" x2="303.3393702123178" y2="187.7780908812166" stroke="#1f2937" stroke-width="1.6"/>
  <rect x="360" y="200" width="94" height="34" rx="3" fill="#dcfce7" stroke="#1f2937" stroke-width="1.4"/>
  <text x="407" y="222" font-family="Consolas, 'Courier New', monospace" font-size="9.2" font-weight="400" text-anchor="middle" fill="#1f2937">a3+b3</text>
  <line x1="407" y1="176" x2="407" y2="196" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="407" y1="196" x2="410.6606297876822" y2="187.7780908812166" stroke="#1f2937" stroke-width="1.6"/>
  <line x1="407" y1="196" x2="403.3393702123178" y2="187.7780908812166" stroke="#1f2937" stroke-width="1.6"/>
  <text x="480" y="214" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#15803d">4 sumas en el tiempo de 1 ⇒ 4× de rendimiento</text>
  <text x="480" y="232" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.2" font-weight="400" text-anchor="start" fill="#4b5563">sin tocar la frecuencia ni el repertorio</text>
  <rect x="24" y="256" width="872" height="128" rx="6" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="40" y="278" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.4" font-weight="700" text-anchor="start" fill="#1f2937">Dónde se usa y qué límites tiene</text>
  <text x="40" y="300" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#1f2937">SSE/AVX (x86): registros de 128-512 bits · NEON (ARM) · vectoriales de 64 lanes en GPUs.</text>
  <text x="40" y="320" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#4b5563">GPU: miles de lanes simples (SIMT) contra pocos lanes anchos de la CPU; el mismo programa sobre datos distintos.</text>
  <text x="40" y="340" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#7c2d12">Límite 1: el programa tiene que tener datos paralelos (multiplicar matrices sí; un cálculo en cadena no).</text>
  <text x="40" y="360" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.6" font-weight="400" text-anchor="start" fill="#7c2d12">Límite 2: hay que EMPAQUETAR y DESEMPAQUETAR los datos (si vienen de a uno, se pierde lo ganado). Límite 3: las máscaras/condicionales.</text>
</svg>
