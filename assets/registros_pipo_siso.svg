  <text x="24" y="392" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#4b5563">Cada pulso corre un bit: el dato tarda n pulsos en atravesar el registro (lento, pero con 2 cables en vez de n).</text>
