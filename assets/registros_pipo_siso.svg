  <text x="24" y="222" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="9.8" font-weight="400" text-anchor="start" fill="#4b5563">En un solo pulso los 4 bits se cargan o se leen juntos: es la memoria de trabajo más rápida (un registro).</text>
  <text x="24" y="242" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.8" font-weight="700" text-anchor="start" fill="#1f2937">SISO: Serial In – Serial Out · el dato entra por un extremo y sale por el otro, un bit por pulso</text>
