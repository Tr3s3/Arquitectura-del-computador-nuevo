  <rect x="30" y="330" width="840" height="72" rx="6" fill="#f8fafc" stroke="#e5e7eb" stroke-width="1.2"/>
  <text x="46" y="352" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.6" font-weight="600" text-anchor="start" fill="#1f2937">Sin entrelazar: 4 palabras en serie = 4 × t.   Entrelazada: las 4 salen a la vez = 1 × t  ⇒  4× ancho de banda.</text>
  <text x="46" y="374" font-family="Consolas, 'Courier New', monospace" font-size="10.4" font-weight="400" text-anchor="start" fill="#7c2d12">ancho de banda = (nº de bancos × bytes por palabra) / tiempo de ciclo     ·     ej.: 4 bancos × 8 B / 10 ns = 3,2 GB/s</text>
  <text x="46" y="392" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="10.2" font-weight="400" text-anchor="start" fill="#b91c1c">Ojo: si el paso (stride) es múltiplo del nº de bancos, todas las direcciones caen en el mismo banco ⇒ conflicto y no hay ganancia.</text>
