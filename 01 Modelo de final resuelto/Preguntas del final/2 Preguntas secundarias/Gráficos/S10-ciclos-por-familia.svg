<text x='765.0' y='87.66666666666667' font-size='14' font-weight='bold' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>Pulsos</text>
<rect x='30' y='106' width='260' height='46' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='160.0' y='133.66666666666666' font-size='14' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>Se resuelven en la búsqueda</text>
<rect x='290' y='106' width='300' height='46' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='440.0' y='124.16666666666667' font-size='14' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>HLT, NOP, JMP, JMA, SRJ, CSA, NOT,</text>
<text x='440.0' y='143.16666666666669' font-size='14' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>RAL</text>
