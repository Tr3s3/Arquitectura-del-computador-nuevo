<text x='765.0' y='133.66666666666666' font-size='14' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>8</text>
<rect x='30' y='152' width='260' height='46' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='160.0' y='179.66666666666666' font-size='14' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>Operando en memoria</text>
<rect x='290' y='152' width='300' height='46' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='440.0' y='179.66666666666666' font-size='14' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>LDA, STA, ADD, XOR, AND, IOR</text>
<rect x='590' y='152' width='110' height='46' fill='#ffffff' stroke='#555' stroke-width='1'/>
