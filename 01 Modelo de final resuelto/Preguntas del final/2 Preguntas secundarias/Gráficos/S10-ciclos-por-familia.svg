<svg xmlns='http://www.w3.org/2000/svg' width='900' height='430' viewBox='0 0 900 430'><title>Ciclos de ejecución según la familia de instrucción</title><defs><marker id='ah' markerWidth='10' markerHeight='10' refX='9' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#333'/></marker></defs><rect width='900' height='430' fill='#ffffff'/><text x='20' y='30' font-size='18' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>Ciclos de ejecución según la familia de instrucción</text><rect x='30' y='60' width='260' height='46' fill='#dfe9f5' stroke='#555' stroke-width='1'/>
<text x='160.0' y='87.66666666666667' font-size='14' font-weight='bold' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>Familia</text>
