<rect x='290' y='244' width='300' height='46' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='440.0' y='271.6666666666667' font-size='14' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>LDA, ADD… (directo/indexado)</text>
<rect x='590' y='244' width='110' height='46' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='645.0' y='271.6666666666667' font-size='14' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>3</text>
<rect x='700' y='244' width='130' height='46' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='765.0' y='271.6666666666667' font-size='14' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>24</text>
<rect x='30' y='290' width='260' height='46' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='160.0' y='317.6666666666667' font-size='14' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>BLUE indexada, indirecto</text>
<rect x='290' y='290' width='300' height='46' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='440.0' y='317.6666666666667' font-size='14' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>LDA con modif. 1</text>
<rect x='590' y='290' width='110' height='46' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='645.0' y='317.6666666666667' font-size='14' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>4</text>
<rect x='700' y='290' width='130' height='46' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='765.0' y='317.6666666666667' font-size='14' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>32</text>
<text x='30' y='380' font-size='13' text-anchor='start' font-weight='normal' fill='#222' font-family='Helvetica,Arial,sans-serif'>El número de ciclos depende de cuántos accesos a memoria necesita la instrucción.</text></svg>
