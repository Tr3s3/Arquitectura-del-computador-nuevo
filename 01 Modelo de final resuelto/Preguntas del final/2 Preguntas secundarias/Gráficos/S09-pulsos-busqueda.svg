<svg xmlns='http://www.w3.org/2000/svg' width='900' height='500' viewBox='0 0 900 500'><title>Ciclo de búsqueda: 8 pulsos (BLUE)</title><defs><marker id='ah' markerWidth='10' markerHeight='10' refX='9' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#333'/></marker></defs><rect width='900' height='500' fill='#ffffff'/><text x='20' y='30' font-size='18' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>Ciclo de búsqueda: 8 pulsos (BLUE)</text><rect x='30' y='60' width='80' height='38' fill='#dfe9f5' stroke='#555' stroke-width='1'/>
<text x='70.0' y='83.33333333333333' font-size='13' font-weight='bold' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>Pulso</text>
<rect x='110' y='60' width='360' height='38' fill='#dfe9f5' stroke='#555' stroke-width='1'/>
<text x='290.0' y='83.33333333333333' font-size='13' font-weight='bold' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>Microoperación</text>
<rect x='470' y='60' width='360' height='38' fill='#dfe9f5' stroke='#555' stroke-width='1'/>
<text x='650.0' y='83.33333333333333' font-size='13' font-weight='bold' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>Por qué</text>
<rect x='30' y='98' width='80' height='38' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='70.0' y='121.33333333333333' font-size='13' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>CP1</text>
<rect x='110' y='98' width='360' height='38' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='290.0' y='121.33333333333333' font-size='13' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>PC→MAR, PC→Z, orden de lectura</text>
<rect x='470' y='98' width='360' height='38' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='650.0' y='121.33333333333333' font-size='13' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>dirección a memoria cuanto antes</text>
<rect x='30' y='136' width='80' height='38' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='70.0' y='159.33333333333334' font-size='13' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>CP2</text>
<rect x='110' y='136' width='360' height='38' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='290.0' y='159.33333333333334' font-size='13' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>+1 → Y</text>
<rect x='470' y='136' width='360' height='38' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='650.0' y='159.33333333333334' font-size='13' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>prepara el incremento del PC</text>
<rect x='30' y='174' width='80' height='38' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='70.0' y='197.33333333333334' font-size='13' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>CP3</text>
<rect x='110' y='174' width='360' height='38' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='290.0' y='197.33333333333334' font-size='13' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>— (espera)</text>
<rect x='470' y='174' width='360' height='38' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='650.0' y='197.33333333333334' font-size='13' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>memoria y ALU trabajan</text>
<rect x='30' y='212' width='80' height='38' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='70.0' y='235.33333333333334' font-size='13' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>CP4</text>
<rect x='110' y='212' width='360' height='38' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='290.0' y='235.33333333333334' font-size='13' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>SUMA → PC</text>
<rect x='470' y='212' width='360' height='38' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='650.0' y='235.33333333333334' font-size='13' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>PC ← PC + 1</text>
<rect x='30' y='250' width='80' height='38' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='70.0' y='273.3333333333333' font-size='13' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>CP5</text>
<rect x='110' y='250' width='360' height='38' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='290.0' y='273.3333333333333' font-size='13' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>strobe MBR</text>
<rect x='470' y='250' width='360' height='38' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='650.0' y='273.3333333333333' font-size='13' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>el dato está estable en el bus</text>
<rect x='30' y='288' width='80' height='38' fill='#fff4cc' stroke='#555' stroke-width='1'/>
<text x='70.0' y='311.3333333333333' font-size='13' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>CP6</text>
<rect x='110' y='288' width='360' height='38' fill='#fff4cc' stroke='#555' stroke-width='1'/>
<text x='290.0' y='311.3333333333333' font-size='13' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>MBR → IR</text>
<rect x='470' y='288' width='360' height='38' fill='#fff4cc' stroke='#555' stroke-width='1'/>
<text x='650.0' y='311.3333333333333' font-size='13' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>la instrucción entra al IR</text>
<rect x='30' y='326' width='80' height='38' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='70.0' y='349.3333333333333' font-size='13' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>CP7</text>
<rect x='110' y='326' width='360' height='38' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='290.0' y='349.3333333333333' font-size='13' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>decodificación</text>
<rect x='470' y='326' width='360' height='38' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='650.0' y='349.3333333333333' font-size='13' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>la UC identifica el opcode</text>
<rect x='30' y='364' width='80' height='38' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='70.0' y='387.3333333333333' font-size='13' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>CP8</text>
<rect x='110' y='364' width='360' height='38' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='290.0' y='387.3333333333333' font-size='13' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>E → STATE (si hay ejecución)</text>
<rect x='470' y='364' width='360' height='38' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='650.0' y='387.3333333333333' font-size='13' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>pasa a ejecutar o sigue en F</text>
<text x='30' y='470' font-size='13' text-anchor='start' font-weight='normal' fill='#222' font-family='Helvetica,Arial,sans-serif'>Son 7 pasos de trabajo + 1 de espera de memoria, por eso se cuentan 8 pulsos.</text></svg>
