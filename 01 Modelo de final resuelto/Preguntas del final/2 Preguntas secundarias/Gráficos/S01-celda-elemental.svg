<svg xmlns='http://www.w3.org/2000/svg' width='900' height='430' viewBox='0 0 900 430'><title>Celda elemental de memoria (1 bit)</title><defs><marker id='ah' markerWidth='10' markerHeight='10' refX='9' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#333'/></marker></defs><rect width='900' height='430' fill='#ffffff'/><text x='20' y='30' font-size='18' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>Celda elemental de memoria (1 bit)</text><rect x='330' y='130' width='220' height='110' rx='6' fill='#eef6ee' stroke='#333' stroke-width='2'/>
<text x='440.0' y='171.66666666666666' text-anchor='middle' font-size='14' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>Biestable (SRAM)</text>
<text x='440.0' y='189.66666666666666' text-anchor='middle' font-size='14' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>o capacitor (DRAM)</text>
<text x='440.0' y='207.66666666666666' text-anchor='middle' font-size='14' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>guarda el bit</text>
<line x1='160' y1='185' x2='330' y2='185' stroke='#333' stroke-width='2' marker-end='url(#ah)'/>
<text x='240' y='178' font-size='13' text-anchor='middle' fill='#333' font-family='Helvetica,Arial,sans-serif'>entrada D</text>
<line x1='550' y1='185' x2='680' y2='185' stroke='#333' stroke-width='2' marker-end='url(#ah)'/>
<text x='615' y='178' font-size='13' text-anchor='middle' fill='#333' font-family='Helvetica,Arial,sans-serif'>salida Q</text>
<rect x='680' y='160' width='170' height='50' rx='6' fill='#fff8e6' stroke='#333' stroke-width='2'/>
<text x='765.0' y='189.66666666666666' text-anchor='middle' font-size='14' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>buffer 3 estados</text>
<line x1='765' y1='210' x2='765' y2='280' stroke='#333' stroke-width='2' marker-end='url(#ah)'/>
<line x1='600' y1='300' x2='880' y2='300' stroke='#b8860b' stroke-width='9' stroke-linecap='round'/>
<text x='740.0' y='288' font-size='14' font-weight='bold' text-anchor='middle' fill='#b8860b' font-family='Helvetica,Arial,sans-serif'>Bus de datos compartido</text>
<line x1='440' y1='60' x2='440' y2='130' stroke='#333' stroke-width='2' marker-end='url(#ah)'/>
<text x='440' y='52' font-size='13' text-anchor='middle' fill='#333' font-family='Helvetica,Arial,sans-serif'>línea de selección</text>
<line x1='330' y1='60' x2='330' y2='130' stroke='#333' stroke-width='2' marker-end='url(#ah)'/>
<text x='330' y='52' font-size='13' text-anchor='middle' fill='#333' font-family='Helvetica,Arial,sans-serif'>L/E</text>
<text x='40' y='360' font-size='13' text-anchor='start' font-weight='normal' fill='#222' font-family='Helvetica,Arial,sans-serif'>SRAM: biestable, ~6 transistores, rápida, no necesita refresco (caché).</text>
<text x='40' y='385' font-size='13' text-anchor='start' font-weight='normal' fill='#222' font-family='Helvetica,Arial,sans-serif'>DRAM: 1 transistor + 1 capacitor, densa y barata, necesita refresco (memoria principal).</text></svg>
