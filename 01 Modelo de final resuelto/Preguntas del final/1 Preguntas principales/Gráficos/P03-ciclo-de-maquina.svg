<svg xmlns='http://www.w3.org/2000/svg' width='900' height='460' viewBox='0 0 900 460'><title>Ciclo de máquina: búsqueda, decodificación y ejecución</title><defs><marker id='ah' markerWidth='10' markerHeight='10' refX='9' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#333'/></marker></defs><rect width='900' height='460' fill='#ffffff'/><text x='20' y='30' font-size='18' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>Ciclo de máquina: búsqueda, decodificación y ejecución</text><rect x='40' y='180' width='170' height='60' rx='6' fill='#fff8e6' stroke='#333' stroke-width='2'/>
<text x='125.0' y='205.5' text-anchor='middle' font-size='15' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>¿RUN = 1?</text>
<text x='125.0' y='224.5' text-anchor='middle' font-size='15' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>(START / STOP)</text>
<rect x='280' y='180' width='190' height='60' rx='6' fill='#e3f0ff' stroke='#333' stroke-width='2'/>
<text x='375.0' y='197.33333333333334' text-anchor='middle' font-size='13' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>BÚSQUEDA (F)</text>
<text x='375.0' y='214.33333333333334' text-anchor='middle' font-size='13' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>MAR←PC, MBR←M[MAR]</text>
<text x='375.0' y='231.33333333333334' text-anchor='middle' font-size='13' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>IR←MBR, PC+1</text>
<rect x='540' y='180' width='180' height='60' rx='6' fill='#eef6ee' stroke='#333' stroke-width='2'/>
<text x='630.0' y='205.83333333333334' text-anchor='middle' font-size='13' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>DECODIFICACIÓN</text>
<text x='630.0' y='222.83333333333334' text-anchor='middle' font-size='13' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>la UC lee el opcode</text>
<rect x='540' y='330' width='180' height='60' rx='6' fill='#ffe1e1' stroke='#333' stroke-width='2'/>
<text x='630.0' y='355.8333333333333' text-anchor='middle' font-size='13' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>EJECUCIÓN (E)</text>
<text x='630.0' y='372.8333333333333' text-anchor='middle' font-size='13' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>según el opcode</text>
<rect x='280' y='330' width='190' height='60' rx='6' fill='#fff8e6' stroke='#333' stroke-width='2'/>
<text x='375.0' y='355.8333333333333' text-anchor='middle' font-size='13' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>STATE = E ?</text>
<text x='375.0' y='372.8333333333333' text-anchor='middle' font-size='13' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>sí: ejecutar  ·  no: F</text>
<line x1='210' y1='210' x2='280' y2='210' stroke='#333' stroke-width='2' marker-end='url(#ah)'/>
<text x='245.0' y='204.0' font-size='13' text-anchor='middle' fill='#333' font-family='Helvetica,Arial,sans-serif'>sí</text>
<line x1='470' y1='210' x2='540' y2='210' stroke='#333' stroke-width='2' marker-end='url(#ah)'/>
<line x1='630' y1='240' x2='630' y2='330' stroke='#333' stroke-width='2' marker-end='url(#ah)'/>
<line x1='540' y1='360' x2='470' y2='360' stroke='#333' stroke-width='2' marker-end='url(#ah)'/>
<line x1='375' y1='330' x2='375' y2='240' stroke='#333' stroke-width='2' marker-end='url(#ah)'/>
<text x='375.0' y='279.0' font-size='13' text-anchor='middle' fill='#333' font-family='Helvetica,Arial,sans-serif'>no: otra búsqueda</text>
<line x1='125' y1='180' x2='125' y2='90' stroke='#333' stroke-width='2' marker-end='url(#ah)'/>
<rect x='40' y='50' width='170' height='40' rx='6' fill='#f5f5f5' stroke='#333' stroke-width='2'/>
<text x='125.0' y='74.33333333333333' text-anchor='middle' font-size='13' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>HLT → RUN = 0 (parar)</text>
<text x='40' y='430' font-size='13' text-anchor='start' font-weight='normal' fill='#222' font-family='Helvetica,Arial,sans-serif'>Cada pulso ejecuta una microoperación. La búsqueda es igual para todas las instrucciones.</text></svg>
