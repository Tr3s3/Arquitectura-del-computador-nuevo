<svg xmlns='http://www.w3.org/2000/svg' width='900' height='500' viewBox='0 0 900 500'><title>Flujo de información en BLUE: un bus único</title><defs><marker id='ah' markerWidth='10' markerHeight='10' refX='9' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#333'/></marker></defs><rect width='900' height='500' fill='#ffffff'/><text x='20' y='30' font-size='18' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>Flujo de información en BLUE: un bus único</text><rect x='330' y='50' width='240' height='60' rx='6' fill='#eef6ee' stroke='#333' stroke-width='2'/>
<text x='450.0' y='75.5' text-anchor='middle' font-size='15' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>Memoria</text>
<text x='450.0' y='94.5' text-anchor='middle' font-size='15' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>4096 × 16 bits</text>
<line x1='450' y1='110' x2='450' y2='240' stroke='#333' stroke-width='2' marker-end='url(#ah)'/>
<line x1='60' y1='250' x2='840' y2='250' stroke='#b8860b' stroke-width='9' stroke-linecap='round'/>
<text x='450.0' y='238' font-size='14' font-weight='bold' text-anchor='middle' fill='#b8860b' font-family='Helvetica,Arial,sans-serif'>Bus único: direcciones (12 bits) y datos (16 bits), una transferencia por pulso</text>
<rect x='60' y='330' width='130' height='50' rx='6' fill='#fff8e6' stroke='#333' stroke-width='2'/>
<text x='125.0' y='360.0' text-anchor='middle' font-size='15' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>PC</text>
<line x1='125' y1='330' x2='125' y2='258' stroke='#333' stroke-width='2' marker-end='url(#ah)'/>
<rect x='225' y='330' width='130' height='50' rx='6' fill='#fff8e6' stroke='#333' stroke-width='2'/>
<text x='290.0' y='360.0' text-anchor='middle' font-size='15' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>MAR</text>
<line x1='290' y1='330' x2='290' y2='258' stroke='#333' stroke-width='2' marker-end='url(#ah)'/>
<rect x='390' y='330' width='130' height='50' rx='6' fill='#fff8e6' stroke='#333' stroke-width='2'/>
<text x='455.0' y='360.0' text-anchor='middle' font-size='15' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>MBR</text>
<line x1='455' y1='330' x2='455' y2='258' stroke='#333' stroke-width='2' marker-end='url(#ah)'/>
<rect x='555' y='330' width='130' height='50' rx='6' fill='#fff8e6' stroke='#333' stroke-width='2'/>
<text x='620.0' y='360.0' text-anchor='middle' font-size='15' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>IR</text>
<line x1='620' y1='330' x2='620' y2='258' stroke='#333' stroke-width='2' marker-end='url(#ah)'/>
<rect x='720' y='330' width='130' height='50' rx='6' fill='#fff8e6' stroke='#333' stroke-width='2'/>
<text x='785.0' y='360.0' text-anchor='middle' font-size='15' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>AC</text>
<line x1='785' y1='330' x2='785' y2='258' stroke='#333' stroke-width='2' marker-end='url(#ah)'/>
<rect x='60' y='420' width='380' height='56' rx='6' fill='#eef0fb' stroke='#333' stroke-width='2'/>
<text x='250.0' y='443.6666666666667' text-anchor='middle' font-size='14' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>UC (manda)</text>
<text x='250.0' y='461.6666666666667' text-anchor='middle' font-size='14' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>genera LOAD y salida habilitada</text>
<rect x='480' y='420' width='380' height='56' rx='6' fill='#eef0fb' stroke='#333' stroke-width='2'/>
<text x='670.0' y='443.6666666666667' text-anchor='middle' font-size='14' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>ALU (calcula)</text>
<text x='670.0' y='461.6666666666667' text-anchor='middle' font-size='14' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>AC → ALU → AC</text>
<text x='60' y='496' font-size='13' text-anchor='start' font-weight='normal' fill='#222' font-family='Helvetica,Arial,sans-serif'>Direcciones: PC → MAR → memoria (búsqueda);  IR(dir) → MAR → memoria (ejecución)</text>
<text x='60' y='468' font-size='1' text-anchor='start' font-weight='normal' fill='#222' font-family='Helvetica,Arial,sans-serif'></text></svg>
