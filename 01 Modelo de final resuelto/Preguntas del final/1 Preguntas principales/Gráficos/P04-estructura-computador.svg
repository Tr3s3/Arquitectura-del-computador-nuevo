<svg xmlns='http://www.w3.org/2000/svg' width='900' height='470' viewBox='0 0 900 470'><title>Estructura básica: CPU, memoria, E/S y tres buses</title><defs><marker id='ah' markerWidth='10' markerHeight='10' refX='9' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#333'/></marker></defs><rect width='900' height='470' fill='#ffffff'/><text x='20' y='30' font-size='18' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>Estructura básica: CPU, memoria, E/S y tres buses</text><rect x='40' y='120' width='240' height='240' rx='6' fill='#eef0fb' stroke='#333' stroke-width='2'/>
<text x='160.0' y='235.33333333333334' text-anchor='middle' font-size='16' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>CPU</text>
<text x='160.0' y='255.33333333333334' text-anchor='middle' font-size='16' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>UC · ALU · registros</text>
<rect x='620' y='70' width='240' height='90' rx='6' fill='#eef6ee' stroke='#333' stroke-width='2'/>
<text x='740.0' y='110.5' text-anchor='middle' font-size='15' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>MEMORIA</text>
<text x='740.0' y='129.5' text-anchor='middle' font-size='15' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>programa y datos</text>
<rect x='620' y='330' width='240' height='90' rx='6' fill='#fff8e6' stroke='#333' stroke-width='2'/>
<text x='740.0' y='370.5' text-anchor='middle' font-size='15' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>E/S</text>
<text x='740.0' y='389.5' text-anchor='middle' font-size='15' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>interfaces, periféricos</text>
<line x1='280' y1='150' x2='620' y2='150' stroke='#b8860b' stroke-width='9' stroke-linecap='round'/>
<text x='450.0' y='138' font-size='14' font-weight='bold' text-anchor='middle' fill='#b8860b' font-family='Helvetica,Arial,sans-serif'>Bus de datos (16 bits, bidireccional)</text>
<line x1='280' y1='210' x2='620' y2='210' stroke='#b8860b' stroke-width='9' stroke-linecap='round'/>
<text x='450.0' y='198' font-size='14' font-weight='bold' text-anchor='middle' fill='#b8860b' font-family='Helvetica,Arial,sans-serif'>Bus de direcciones (12 bits, CPU → memoria)</text>
<line x1='280' y1='270' x2='620' y2='270' stroke='#2e6b9e' stroke-width='9' stroke-linecap='round'/>
<text x='450.0' y='258' font-size='14' font-weight='bold' text-anchor='middle' fill='#2e6b9e' font-family='Helvetica,Arial,sans-serif'>Bus de control (MEMR, MEMW, IRQ…)</text>
<line x1='620' y1='115' x2='620' y2='150' stroke='#333' stroke-width='2' stroke-dasharray='6,4' marker-end='url(#ah)'/>
<line x1='620' y1='150' x2='620' y2='270' stroke='#333' stroke-width='2'/>
<line x1='620' y1='330' x2='620' y2='270' stroke='#333' stroke-width='2' stroke-dasharray='6,4' marker-end='url(#ah)'/>
<text x='40' y='400' font-size='14' text-anchor='start' font-weight='normal' fill='#222' font-family='Helvetica,Arial,sans-serif'>Von Neumann: una sola memoria para programa y datos.</text>
<text x='40' y='425' font-size='14' text-anchor='start' font-weight='normal' fill='#222' font-family='Helvetica,Arial,sans-serif'>Cuello de botella: un solo bus, así que no se trae instrucción y dato a la vez.</text>
<text x='40' y='450' font-size='14' text-anchor='start' font-weight='normal' fill='#222' font-family='Helvetica,Arial,sans-serif'>Un dispositivo que comparte el bus debe poder ponerse en alta impedancia.</text></svg>
