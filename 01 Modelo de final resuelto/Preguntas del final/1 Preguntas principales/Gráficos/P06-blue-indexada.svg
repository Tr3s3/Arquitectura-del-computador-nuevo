<svg xmlns='http://www.w3.org/2000/svg' width='900' height='560' viewBox='0 0 900 560'><title>BLUE indexada: formato, sumador de direcciones y LDA 3 (24 pulsos)</title><defs><marker id='ah' markerWidth='10' markerHeight='10' refX='9' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#333'/></marker></defs><rect width='900' height='560' fill='#ffffff'/><text x='20' y='30' font-size='18' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>BLUE indexada: formato, sumador de direcciones y LDA 3 (24 pulsos)</text><text x='30' y='60' font-size='15' text-anchor='start' font-weight='bold' fill='#222' font-family='Helvetica,Arial,sans-serif'>Formato nuevo:</text>
<rect x='160' y='40' width='130' height='40' rx='6' fill='#ffe1e1' stroke='#333' stroke-width='2'/>
<text x='225.0' y='64.66666666666667' text-anchor='middle' font-size='14' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>opcode 5</text>
<rect x='290' y='40' width='220' height='40' rx='6' fill='#e3f0ff' stroke='#333' stroke-width='2'/>
<text x='400.0' y='64.66666666666667' text-anchor='middle' font-size='14' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>dirección 16</text>
<rect x='510' y='40' width='120' height='40' rx='6' fill='#fff8e6' stroke='#333' stroke-width='2'/>
<text x='570.0' y='64.66666666666667' text-anchor='middle' font-size='14' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>modif. 2</text>
<rect x='630' y='40' width='150' height='40' rx='6' fill='#f5f5f5' stroke='#333' stroke-width='2'/>
<text x='705.0' y='64.66666666666667' text-anchor='middle' font-size='14' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>sin uso 9</text>
<rect x='120' y='150' width='170' height='60' rx='6' fill='#eef0fb' stroke='#333' stroke-width='2'/>
<text x='205.0' y='175.83333333333334' text-anchor='middle' font-size='13' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>RID (registro índice)</text>
<text x='205.0' y='192.83333333333334' text-anchor='middle' font-size='13' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>X ← RID (pulso 5)</text>
<rect x='330' y='150' width='200' height='60' rx='6' fill='#eef6ee' stroke='#333' stroke-width='2'/>
<text x='430.0' y='175.66666666666666' text-anchor='middle' font-size='14' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>Sumador de direcciones</text>
<text x='430.0' y='193.66666666666666' text-anchor='middle' font-size='14' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>Σ = W + X = EA</text>
<rect x='570' y='150' width='190' height='60' rx='6' fill='#fff8e6' stroke='#333' stroke-width='2'/>
<text x='665.0' y='175.83333333333334' text-anchor='middle' font-size='13' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>W ← MBR (campo dir.)</text>
<text x='665.0' y='192.83333333333334' text-anchor='middle' font-size='13' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>pulso 6</text>
<line x1='205' y1='150' x2='360' y2='150' stroke='#333' stroke-width='2' marker-end='url(#ah)'/>
<line x1='400' y1='150' x2='400' y2='130' stroke='#333' stroke-width='2' marker-end='url(#ah)'/>
<line x1='570' y1='180' x2='530' y2='180' stroke='#333' stroke-width='2' marker-end='url(#ah)'/>
<line x1='430' y1='210' x2='430' y2='260' stroke='#333' stroke-width='2' marker-end='url(#ah)'/>
<text x='430.0' y='229.0' font-size='13' text-anchor='middle' fill='#333' font-family='Helvetica,Arial,sans-serif'>Σ → MAR (pulso 8 de ejec. 2)</text>
<text x='30' y='290' font-size='14' text-anchor='start' font-weight='bold' fill='#222' font-family='Helvetica,Arial,sans-serif'>LDA 3, X (ciclo de la EA + ciclo del operando), 3 ciclos × 8 pulsos = 24:</text>
<rect x='30' y='305' width='140' height='36' fill='#dfe9f5' stroke='#555' stroke-width='1'/>
<text x='100.0' y='327.0' font-size='12' font-weight='bold' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>Ciclo</text>
<rect x='170' y='305' width='300' height='36' fill='#dfe9f5' stroke='#555' stroke-width='1'/>
<text x='320.0' y='327.0' font-size='12' font-weight='bold' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>Pulso</text>
<rect x='470' y='305' width='330' height='36' fill='#dfe9f5' stroke='#555' stroke-width='1'/>
<text x='635.0' y='327.0' font-size='12' font-weight='bold' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>Acción</text>
<rect x='30' y='341' width='140' height='36' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='100.0' y='363.0' font-size='12' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>1. Búsqueda</text>
<rect x='170' y='341' width='300' height='36' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='320.0' y='363.0' font-size='12' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>CP1–CP8</text>
<rect x='470' y='341' width='330' height='36' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='635.0' y='363.0' font-size='12' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>PC→MAR, lectura, IR←MBR, PC+1; CP8 pasa a E</text>
<rect x='30' y='377' width='140' height='42' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='100.0' y='402.0' font-size='12' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>2. Ejecución 1</text>
<rect x='170' y='377' width='300' height='42' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='320.0' y='402.0' font-size='12' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>CP1–CP8</text>
<rect x='470' y='377' width='330' height='42' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='635.0' y='393.5' font-size='12' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>lee la segunda palabra; CP5: RID→X; CP6: MBR→W;</text>
<text x='635.0' y='410.5' font-size='12' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>CP8 sigue en E</text>
<rect x='30' y='419' width='140' height='42' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='100.0' y='444.0' font-size='12' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>3. Ejecución 2</text>
<rect x='170' y='419' width='300' height='42' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='320.0' y='444.0' font-size='12' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>CP1–CP8</text>
<rect x='470' y='419' width='330' height='42' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='635.0' y='435.5' font-size='12' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>CP1: Σ→MAR + lectura; CP6: MBR→Acc; CP8 vuelve</text>
<text x='635.0' y='452.5' font-size='12' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>a F</text>
<text x='30' y='500' font-size='13' text-anchor='start' font-weight='normal' fill='#222' font-family='Helvetica,Arial,sans-serif'>Modos: 0 directo (X=0) · 1 indirecto (32 pulsos) · 2 RIF · 3 RID (24 pulsos).</text></svg>
