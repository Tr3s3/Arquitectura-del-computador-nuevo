<svg xmlns='http://www.w3.org/2000/svg' width='700' height='280' viewBox='0 0 700 280'><rect width='100%' height='100%' fill='#ffffff'/><title>Sumador completo: dos semisumadores y una OR</title><text x='24' y='74' font-size='16' text-anchor='start' font-weight='bold' fill='#222' font-family='DejaVu Sans, Liberation Sans, Arial, sans-serif'>A</text><text x='24' y='94' font-size='16' text-anchor='start' font-weight='bold' fill='#222' font-family='DejaVu Sans, Liberation Sans, Arial, sans-serif'>B</text><text x='24' y='155' font-size='16' text-anchor='start' font-weight='bold' fill='#222' font-family='DejaVu Sans, Liberation Sans, Arial, sans-serif'>Cin</text><path d='M40,70 L130,70' stroke='#222' stroke-width='2' fill='none'/><path d='M40,90 L130,90' stroke='#222' stroke-width='2' fill='none'/><path d='M40,160 L320,160' stroke='#222' stroke-width='2' fill='none'/><rect x='130' y='50' width='140' height='60' rx='6' fill='#f4f6f8' stroke='#222' stroke-width='2'/><text x='200.0' y='75.83333333333333' font-size='13' text-anchor='middle' font-weight='normal' fill='#222' font-family='DejaVu Sans, Liberation Sans, Arial, sans-serif'>Semisumador 1</text><text x='200.0' y='92.83333333333333' font-size='13' text-anchor='middle' font-weight='normal' fill='#222' font-family='DejaVu Sans, Liberation Sans, Arial, sans-serif'>(XOR + AND)</text><rect x='320' y='120' width='140' height='60' rx='6' fill='#f4f6f8' stroke='#222' stroke-width='2'/><text x='390.0' y='145.83333333333334' font-size='13' text-anchor='middle' font-weight='normal' fill='#222' font-family='DejaVu Sans, Liberation Sans, Arial, sans-serif'>Semisumador 2</text><text x='390.0' y='162.83333333333334' font-size='13' text-anchor='middle' font-weight='normal' fill='#222' font-family='DejaVu Sans, Liberation Sans, Arial, sans-serif'>(XOR + AND)</text><path d='M270,70 L295,70 L295,140 L320,140' stroke='#222' stroke-width='2' fill='none'/><path d='M270,90 L300,90 L300,205 L500,205' stroke='#222' stroke-width='2' fill='none'/><path d='M460,160 L480,160 L480,235 L500,235' stroke='#222' stroke-width='2' fill='none'/><path d='M460,140 L600,140' stroke='#222' stroke-width='2' fill='none'/><rect x='500' y='190' width='80' height='60' rx='6' fill='#f4f6f8' stroke='#222' stroke-width='2'/><text x='540.0' y='225.0' font-size='15' text-anchor='middle' font-weight='normal' fill='#222' font-family='DejaVu Sans, Liberation Sans, Arial, sans-serif'>OR</text><path d='M580,220 L615,220' stroke='#222' stroke-width='2' fill='none'/><text x='606' y='134' font-size='16' text-anchor='start' font-weight='bold' fill='#222' font-family='DejaVu Sans, Liberation Sans, Arial, sans-serif'>S</text><text x='618' y='214' font-size='16' text-anchor='start' font-weight='bold' fill='#222' font-family='DejaVu Sans, Liberation Sans, Arial, sans-serif'>Cout</text><text x='20' y='268' font-size='14' text-anchor='start' font-weight='normal' fill='#555' font-family='DejaVu Sans, Liberation Sans, Arial, sans-serif'>S = A ⊕ B ⊕ Cin ;   Cout = A·B + Cin·(A ⊕ B)</text></svg>