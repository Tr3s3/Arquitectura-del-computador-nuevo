<text x='400' y='380' font-size='14' text-anchor='start' font-weight='bold' fill='#222' font-family='Helvetica,Arial,sans-serif'>Y = S1'S0' I0 + S1'S0 I1 + S1 S0' I2 + S1 S0 I3</text>
