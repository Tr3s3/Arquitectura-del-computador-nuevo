<svg xmlns='http://www.w3.org/2000/svg' width='900' height='470' viewBox='0 0 900 470'><title>Compuertas básicas y Leyes de DeMorgan</title><defs><marker id='ah' markerWidth='10' markerHeight='10' refX='9' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#333'/></marker></defs><rect width='900' height='470' fill='#ffffff'/><text x='20' y='30' font-size='18' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>Compuertas básicas y Leyes de DeMorgan</text><rect x='40' y='80' width='150' height='60' rx='6' fill='#eef0fb' stroke='#333' stroke-width='2'/>
<text x='115.0' y='105.5' text-anchor='middle' font-size='15' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>AND</text>
<text x='115.0' y='124.5' text-anchor='middle' font-size='15' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>A·B</text>
<rect x='230' y='80' width='150' height='60' rx='6' fill='#eef0fb' stroke='#333' stroke-width='2'/>
<text x='305.0' y='105.5' text-anchor='middle' font-size='15' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>OR</text>
<text x='305.0' y='124.5' text-anchor='middle' font-size='15' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>A+B</text>
<rect x='420' y='80' width='150' height='60' rx='6' fill='#eef0fb' stroke='#333' stroke-width='2'/>
<text x='495.0' y='105.5' text-anchor='middle' font-size='15' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>NOT</text>
<text x='495.0' y='124.5' text-anchor='middle' font-size='15' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>A'</text>
<rect x='610' y='80' width='150' height='60' rx='6' fill='#eef0fb' stroke='#333' stroke-width='2'/>
<text x='685.0' y='105.5' text-anchor='middle' font-size='15' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>XOR</text>
<text x='685.0' y='124.5' text-anchor='middle' font-size='15' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>A⊕B</text>
<text x='40' y='190' font-size='16' text-anchor='start' font-weight='bold' fill='#222' font-family='Helvetica,Arial,sans-serif'>DeMorgan: (A·B)' = A' + B'      (A + B)' = A'·B'</text>
<rect x='40' y='230' width='300' height='90' rx='6' fill='#eef6ee' stroke='#333' stroke-width='2'/>
<text x='190.0' y='261.6666666666667' text-anchor='middle' font-size='14' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>(A·B)' = NAND</text>
<text x='190.0' y='279.6666666666667' text-anchor='middle' font-size='14' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>es igual a A' + B'</text>
<text x='190.0' y='297.6666666666667' text-anchor='middle' font-size='14' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>(OR con entradas negadas)</text>
<rect x='380' y='230' width='300' height='90' rx='6' fill='#eef6ee' stroke='#333' stroke-width='2'/>
<text x='530.0' y='261.6666666666667' text-anchor='middle' font-size='14' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>(A+B)' = NOR</text>
<text x='530.0' y='279.6666666666667' text-anchor='middle' font-size='14' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>es igual a A'·B'</text>
<text x='530.0' y='297.6666666666667' text-anchor='middle' font-size='14' font-weight='normal' font-family='Helvetica,Arial,sans-serif'>(AND con entradas negadas)</text>
<text x='40' y='370' font-size='13' text-anchor='start' font-weight='normal' fill='#222' font-family='Helvetica,Arial,sans-serif'>Postulados: identidad, conmutativa, asociativa, distributiva, complemento, dominancia.</text>
<text x='40' y='395' font-size='13' text-anchor='start' font-weight='normal' fill='#222' font-family='Helvetica,Arial,sans-serif'>Teoremas: idempotencia, involución, absorción, DeMorgan, consenso.</text></svg>
