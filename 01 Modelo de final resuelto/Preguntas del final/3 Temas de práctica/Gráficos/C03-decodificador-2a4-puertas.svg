f' stroke='#222' stroke-width='2'/><circle cx='220' cy='100' r='3.5' fill='#222'/><path d='M220,100 L220,124 L300,124' stroke='#222' stroke-width='2' fill='none'/><circle cx='230' cy='150' r='3.5' fill='#222'/><path d='M230,150 L230,146 L300,146' stroke='#222' stroke-width='2' fill='none'/><path d='M351,135 L372,135' stroke='#222' stroke-width='2' fill='none'/><text x='376' y='140' font-size='14' text-anchor='start' font-weight='bold' fill='#222' font-family='DejaVu Sans, Liberation Sans, Arial, sans-serif'>D1 = A1'·A0</text><path d='M300,180 H326 A25,25 0 0 1 326,230 H300 Z' fill='#fff' stroke='#222' stroke-width='2'/><circle cx='240' cy='50' r='3.5' fill='#222'/><path d='M240,50 L240,194 L300,194' stroke='#222' stroke-width='2' fill='none'/><circle cx='250' cy='200' r='3.5' fill='#222'/><path d='M250,200 L250,216 L300,216' stroke='#222' stroke-width='2' fill='none'/><path d='M351,205 L372,205' stroke='#222' stroke-width='2' fill='none'/><text x='376' y='210' font-size='14' text-anchor='start' font-weight='bold' fill='#222' font-family='DejaVu Sans, Liberation Sans, Arial, sans-serif'>D2 = A1·A0'</text><path d='M300,250 H326 A25,25 0 0 1 326,300 H300 Z' fill='#fff' stroke='#222' stroke-width='2'/><circle cx='260' cy='50' r='3.5' fill='#222'/><path d='M260,50 L260,264 L300,264' stroke='#222' stroke-width='2' fill='none'/><circle cx='270' cy='150' r='3.5' fill='#222'/><path d='M270,150 L270,286 L300,286' stroke='#222' stroke-width='2' fill='none'/><path d='M351,275 L372,275' stroke='#222' stroke-width='2' fill='none'/><text x='376' y='280' font-size='14' text-anchor='start' font-weight='bold' fill='#222' font-family='DejaVu Sans, Liberation Sans, Arial, sans-serif'>D3 = A1·A0</text><text x='14' y='318' font-size='13' text-anchor='start' font-weight='normal' fill='#555' font-family='DejaVu Sans, Liberation Sans, Arial, sans-serif'>Entradas A1 A0 en binario. Para cada combinación se activa una sola salida.</text></svg>