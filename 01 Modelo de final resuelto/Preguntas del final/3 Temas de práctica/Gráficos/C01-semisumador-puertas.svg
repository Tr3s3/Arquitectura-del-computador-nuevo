<svg xmlns='http://www.w3.org/2000/svg' width='420' height='210' viewBox='0 0 420 210'><rect width='100%' height='100%' fill='#ffffff'/><title>Semisumador: compuertas XOR y AND</title><text x='60' y='18' font-size='16' text-anchor='middle' font-weight='bold' fill='#222' font-family='DejaVu Sans, Liberation Sans, Arial, sans-serif'>A</text><text x='90' y='18' font-size='16' text-anchor='middle' font-weight='bold' fill='#222' font-family='DejaVu Sans, Liberation Sans, Arial, sans-serif'>B</text><path d='M60,26 L60,134' stroke='#222' stroke-width='2' fill='none'/><path d='M90,26 L90,156' stroke='#222' stroke-width='2' fill='none'/><circle cx='60' cy='54' r='3.5' fill='#222'/><circle cx='60' cy='134' r='3.5' fill='#222'/><circle cx='90' cy='76' r='3.5' fill='#222'/><circle cx='90' cy='156' r='3.5' fill='#222'/><path d='M60,54 L220,54' stroke='#222' stroke-width='2' fill='none'/><path d='M90,76 L220,76' stroke='#222' stroke-width='2' fill='none'/><path d='M60,134 L220,134' stroke='#222' stroke-width='2' fill='none'/><path d='M90,156 L220,156' stroke='#222' stroke-width='2' fill='none'/><path d='M226,40 Q250,40 270,65 Q250,90 226,90 Q236,65 226,40 Z' fill='#fff' stroke='#222' stroke-width='2'/><path d='M220,40 Q230,65 220,90' stroke='#222' stroke-width='2' fill='none'/><path d='M220,120 H246 A25,25 0 0 1 246,170 H220 Z' fill='#fff' stroke='#222' stroke-width='2'/><path d='M276,65 L330,65' stroke='#222' stroke-width='2' fill='none'/><path d='M271,145 L330,145' stroke='#222' stroke-width='2' fill='none'/><text x='336' y='70' font-size='15' text-anchor='start' font-weight='bold' fill='#222' font-family='DejaVu Sans, Liberation Sans, Arial, sans-serif'>S = A ⊕ B</text><text x='336' y='150' font-size='15' text-anchor='start' font-weight='bold' fill='#222' font-family='DejaVu Sans, Liberation Sans, Arial, sans-serif'>C = A · B</text><text x='20' y='200' font-size='13' text-anchor='start' font-weight='normal' fill='#555' font-family='DejaVu Sans, Liberation Sans, Arial, sans-serif'>La XOR da el bit de suma y la AND da el acarreo.</text></svg>