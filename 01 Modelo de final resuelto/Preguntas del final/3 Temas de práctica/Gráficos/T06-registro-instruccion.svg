<svg xmlns='http://www.w3.org/2000/svg' width='900' height='440' viewBox='0 0 900 440'><title>Registro de instrucción (IR, 16 bits) y 3 ejemplos</title><defs><marker id='ah' markerWidth='10' markerHeight='10' refX='9' refY='5' orient='auto'><path d='M0,0 L10,5 L0,10 z' fill='#333'/></marker></defs><rect width='900' height='440' fill='#ffffff'/><text x='20' y='30' font-size='18' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>Registro de instrucción (IR, 16 bits) y 3 ejemplos</text><rect x='60' y='80' width='360' height='60' rx='6' fill='#ffe1e1' stroke='#333' stroke-width='2'/>
<text x='240.0' y='114.66666666666667' text-anchor='middle' font-size='14' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>opcode (4 bits)  IR15…IR12</text>
<rect x='420' y='80' width='420' height='60' rx='6' fill='#e3f0ff' stroke='#333' stroke-width='2'/>
<text x='630.0' y='114.66666666666667' text-anchor='middle' font-size='14' font-weight='bold' font-family='Helvetica,Arial,sans-serif'>dirección (12 bits)  IR11…IR0</text>
<rect x='60' y='180' width='200' height='40' fill='#dfe9f5' stroke='#555' stroke-width='1'/>
<text x='160.0' y='204.66666666666666' font-size='14' font-weight='bold' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>Instrucción</text>
<rect x='260' y='180' width='160' height='40' fill='#dfe9f5' stroke='#555' stroke-width='1'/>
<text x='340.0' y='204.66666666666666' font-size='14' font-weight='bold' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>Opcode (bin)</text>
<rect x='420' y='180' width='160' height='40' fill='#dfe9f5' stroke='#555' stroke-width='1'/>
<text x='500.0' y='204.66666666666666' font-size='14' font-weight='bold' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>Hex (ejemplo)</text>
<rect x='580' y='180' width='200' height='40' fill='#dfe9f5' stroke='#555' stroke-width='1'/>
<text x='680.0' y='204.66666666666666' font-size='14' font-weight='bold' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>Microoperación</text>
<rect x='60' y='220' width='200' height='40' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='160.0' y='244.66666666666666' font-size='14' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>LDA 500</text>
<rect x='260' y='220' width='160' height='40' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='340.0' y='244.66666666666666' font-size='14' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>0110</text>
<rect x='420' y='220' width='160' height='40' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='500.0' y='244.66666666666666' font-size='14' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>6500</text>
<rect x='580' y='220' width='200' height='40' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='680.0' y='244.66666666666666' font-size='14' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>AC ← M[500]</text>
<rect x='60' y='260' width='200' height='40' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='160.0' y='284.6666666666667' font-size='14' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>ADD 501</text>
<rect x='260' y='260' width='160' height='40' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='340.0' y='284.6666666666667' font-size='14' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>0001</text>
<rect x='420' y='260' width='160' height='40' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='500.0' y='284.6666666666667' font-size='14' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>1501</text>
<rect x='580' y='260' width='200' height='40' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='680.0' y='284.6666666666667' font-size='14' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>AC ← AC + M[501]</text>
<rect x='60' y='300' width='200' height='40' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='160.0' y='324.6666666666667' font-size='14' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>STA 502</text>
<rect x='260' y='300' width='160' height='40' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='340.0' y='324.6666666666667' font-size='14' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>0111</text>
<rect x='420' y='300' width='160' height='40' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='500.0' y='324.6666666666667' font-size='14' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>7502</text>
<rect x='580' y='300' width='200' height='40' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='680.0' y='324.6666666666667' font-size='14' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>M[502] ← AC</text>
<rect x='60' y='340' width='200' height='40' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='160.0' y='364.6666666666667' font-size='14' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>JMP 100</text>
<rect x='260' y='340' width='160' height='40' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='340.0' y='364.6666666666667' font-size='14' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>1010</text>
<rect x='420' y='340' width='160' height='40' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='500.0' y='364.6666666666667' font-size='14' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>A100</text>
<rect x='580' y='340' width='200' height='40' fill='#ffffff' stroke='#555' stroke-width='1'/>
<text x='680.0' y='364.6666666666667' font-size='14' font-weight='normal' text-anchor='middle' font-family='Helvetica,Arial,sans-serif'>PC ← 100</text>
<text x='60' y='400' font-size='13' text-anchor='start' font-weight='normal' fill='#222' font-family='Helvetica,Arial,sans-serif'>IR = instrucción actual (la que la UC decodifica). Opcode octal 06 = LDA = 0110.</text></svg>
